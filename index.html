            const [msg, setMsg] = useState('');
            const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);

            const handleSave = async () => {
                await saveDoc('users', currentUser.id, { username: name, password: pass });
                setMsg('Profil berhasil diperbarui!');
                setTimeout(()=>setMsg(''), 3000);
            };

            const handleDeleteHistory = async () => {
                for(let tx of userTx) {
                    await deleteDoc('transactions', tx.id);
                }
                setMsg('Semua riwayat berhasil dihapus.');
                setShowDeleteConfirm(false);
                setTimeout(()=>setMsg(''), 3000);
            };

            return (
                <div className="animate-fade-in max-w-md mx-auto space-y-6 pt-4">
                    <h2 className="text-2xl font-black mb-4">Pengaturan Akun</h2>
                    
                    {msg && <div className="bg-green-100 text-green-700 p-3 rounded-xl text-sm font-bold text-center animate-fade-in">{msg}</div>}

                    <div className="bg-white dark:bg-darkCard p-6 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-800 space-y-4">
                        <div>
                            <label className="text-xs font-bold text-gray-500 uppercase block mb-1">Ubah Nama</label>
                            <div className="relative mt-1">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <UserImageIcon />
                                </div>
                                <input type="text" value={name} onChange={e=>setName(e.target.value)} className="w-full p-3 pl-10 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none border border-transparent focus:border-brandGreen" />
                            </div>
                        </div>
                        <div>
                            <label className="text-xs font-bold text-gray-500 uppercase block mb-1">Ubah Password</label>
                            <div className="relative mt-1">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <PasswordImageIcon />
                                </div>
                                <input type="text" value={pass} onChange={e=>setPass(e.target.value)} className="w-full p-3 pl-10 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none border border-transparent focus:border-brandGreen" />
                            </div>
                        </div>
                        <button type="button" onClick={handleSave} className="w-full py-3 bg-brandGreen text-white rounded-xl font-bold shadow-md hover:bg-emerald-600 transition">Simpan Perubahan</button>
                    </div>

                    <div className="bg-red-50 dark:bg-red-900/10 p-6 rounded-3xl border border-red-100 dark:border-red-900/30">
                        <h3 className="font-bold text-brandRed mb-2"><i className="fas fa-exclamation-triangle mr-2"></i>Zona Berbahaya</h3>
                        <p className="text-xs text-gray-500 mb-4">Menghapus semua riwayat akan mereset saldo Anda menjadi 0. Tindakan ini tidak dapat dibatalkan.</p>
                        <button type="button" onClick={() => setShowDeleteConfirm(true)} className="w-full py-3 bg-brandRed text-white rounded-xl font-bold shadow-md hover:bg-red-600 transition">Hapus Semua Riwayat</button>
                    </div>

                    {showDeleteConfirm && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/65 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white dark:bg-darkCard w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-brandRed/20 text-center">
                                <div className="w-16 h-16 rounded-full bg-red-100 dark:bg-red-900/30 text-brandRed flex items-center justify-center text-2xl mx-auto mb-4">
                                    <i className="fas fa-trash-alt"></i>
                                </div>
                                <h3 className="text-lg font-bold mb-2">Hapus Semua Riwayat?</h3>
                                <p className="text-sm text-gray-500 mb-6">Yakin ingin menghapus semua riwayat transaksi Anda? Data di Cloud akan hilang permanen dan saldo Anda di-reset ke Rp 0.</p>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setShowDeleteConfirm(false)} className="flex-1 py-3 rounded-xl bg-gray-100 dark:bg-gray-800 font-bold text-sm hover:bg-gray-200 transition">Batal</button>
                                    <button type="button" onClick={handleDeleteHistory} className="flex-1 py-3 rounded-xl bg-brandRed text-white font-bold text-sm hover:bg-red-600 transition">Hapus Semua</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // ADMIN LAYOUT & VIEWS
        // ==========================================
        function AdminLayout({ users, transactions, saveDoc, deleteDoc, onLogout, toggleTheme, theme }) {
            const [activeTab, setActiveTab] = useState('dashboard');
            
            const tabs = [
                { id: 'dashboard', icon: 'fa-chart-pie', label: 'Dashboard' },
                { id: 'datauser', icon: 'fa-users', label: 'Data User' },
                { id: 'brankas', icon: 'fa-vault', label: 'Brankas Global' },
                { id: 'pengaturan', icon: 'fa-cog', label: 'Pengaturan' },
            ];

            return (
                <div className="flex h-screen overflow-hidden bg-gray-100 dark:bg-[#0a0a0a]">
                    {/* Desktop Sidebar Admin */}
                    <div className="hidden md:flex flex-col w-64 bg-white dark:bg-darkCard border-r border-gray-200 dark:border-gray-800 shadow-xl z-20">
                        <div className="p-6 flex flex-col items-center justify-center gap-2 border-b border-gray-100 dark:border-gray-800">
                            <img src="https://iili.io/C9EsjQS.png" className="w-16 h-16 object-contain" alt="logo"/>
                            <span className="font-black text-xl text-center text-transparent bg-clip-text bg-gradient-to-r from-brandGreen to-teal-400">Family Money</span>
                        </div>
                        <div className="flex-1 p-4 flex flex-col gap-2">
                            {tabs.map(t => (
                                <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex items-center gap-4 px-4 py-3 rounded-xl font-medium transition ${activeTab === t.id ? 'bg-brandRed text-white shadow-lg' : 'text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800'}`}>
                                    <i className={`fas ${t.icon} w-5`}></i> {t.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col h-full overflow-hidden relative">
                        {/* Admin Content Header */}
                        <header className="px-4 py-3 md:px-8 md:py-4 bg-white/80 dark:bg-darkCard/80 backdrop-blur-md sticky top-0 z-10 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <img src="https://iili.io/C9EsjQS.png" alt="Logo" className="w-10 h-10 object-contain drop-shadow-md" />
                                <div>
                                    <p className="text-xs text-gray-500 font-medium">Selamat Datang,</p>
                                    <h2 className="text-sm md:text-base font-bold capitalize">arnnon</h2>
                                </div>
                            </div>
                            <div className="flex items-center gap-2 md:gap-4">
                                <button type="button" onClick={toggleTheme} className="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-sm">
                                    <i className={`fas ${theme === 'dark' ? 'fa-sun text-yellow-400' : 'fa-moon text-gray-400'}`}></i>
                                </button>
                                <button type="button" onClick={onLogout} className="text-brandRed hover:bg-red-50 dark:hover:bg-red-900/20 p-2 rounded-lg text-sm font-semibold transition shrink-0">
                                    <i className="fas fa-sign-out-alt md:mr-2"></i><span className="hidden md:inline">Keluar</span>
                                </button>
                            </div>
                        </header>

                        <main className="flex-1 overflow-y-auto p-4 md:p-8 pb-24 md:pb-8">
                            {activeTab === 'dashboard' && <AdminDashboard users={users} transactions={transactions} />}
                            {activeTab === 'datauser' && <AdminDataUser users={users} saveDoc={saveDoc} deleteDoc={deleteDoc} transactions={transactions} />}
                            {activeTab === 'brankas' && <AdminBrankas transactions={transactions} users={users} />}
                            {activeTab === 'pengaturan' && <AdminPengaturan saveDoc={saveDoc} deleteDoc={deleteDoc} users={users} transactions={transactions} />}
                        </main>
                    </div>

                    <div className="md:hidden fixed bottom-0 left-0 w-full bg-white dark:bg-darkCard border-t border-brandRed/20 flex justify-around p-2 pb-safe z-30 shadow-[0_-10px_20px_rgba(0,0,0,0.2)]">
                        {tabs.map(t => (
                            <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex flex-col items-center p-2 rounded-xl transition ${activeTab === t.id ? 'text-brandRed' : 'text-gray-400'}`}>
                                <i className={`fas ${t.icon} text-lg mb-1`}></i>
                                <span className="text-[10px] font-bold uppercase">{t.label}</span>
                            </button>
                        ))}
                    </div>
                </div>
            );
        }

        // --- Admin Views ---
        function AdminDashboard({ users, transactions }) {
            const [filterDate, setFilterDate] = useState('');
            const [filterUser, setFilterUser] = useState('');

            const stats = useMemo(() => {
                let bal = 0, tab = 0, pin = 0;
                transactions.forEach(tx => {
                    const amt = Number(tx.amount);
                    if(tx.type === 'income') {
                        bal += amt;
                        if(tx.category === 'Tabungan') tab -= amt;
                        if(tx.category === 'Pinjaman') pin += amt;
                    } else {
                        bal -= amt;
                        if(tx.category === 'Tabungan') tab += amt;
                        if(tx.category === 'Pinjaman') pin -= amt;
                    }
                });
                return { users: users.length, bal, tab, pin };
            }, [transactions, users.length]);

            const listFiltered = useMemo(() => {
                let res = [...transactions].sort((a,b) => b.timestamp - a.timestamp);
                if(filterDate) res = res.filter(t => t.date === filterDate);
                if(filterUser) {
                    const term = filterUser.toLowerCase();
                    res = res.filter(t => {
                        const u = users.find(usr => usr.id === t.userId);
                        return u && u.username.toLowerCase().includes(term);
                    });
                }
                return res;
            }, [transactions, filterDate, filterUser, users]);

            const listTotal = useMemo(() => listFiltered.reduce((acc, curr) => acc + (curr.type==='income'?curr.amount:-curr.amount), 0), [listFiltered]);

            return (
                <div className="space-y-6 animate-fade-in max-w-6xl mx-auto">
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div className="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-2xl shadow-sm border border-blue-200 dark:border-blue-800">
                            <p className="text-xs text-blue-600 dark:text-blue-400 font-bold uppercase mb-1">Total User</p>
                            <h3 className="text-2xl font-black text-blue-600 dark:text-blue-400">{stats.users}</h3>
                        </div>
                        <div className={`${stats.bal >= 0 ? 'bg-green-50 dark:bg-green-900/20 border-green-200 dark:border-green-800' : 'bg-red-50 dark:bg-red-900/20 border-red-200 dark:border-red-800'} p-4 rounded-2xl shadow-sm border`}>
                            <p className={`text-xs font-bold uppercase mb-1 ${stats.bal >= 0 ? 'text-brandGreen' : 'text-brandRed'}`}>Saldo Global</p>
                            <h3 className={`text-xl font-black ${stats.bal >= 0 ? 'text-brandGreen' : 'text-brandRed'}`}>{formatRp(stats.bal)}</h3>
                        </div>
                        <div className="bg-emerald-50 dark:bg-emerald-900/20 p-4 rounded-2xl shadow-sm border border-emerald-200 dark:border-emerald-800">
                            <p className="text-xs text-emerald-600 dark:text-emerald-400 font-bold uppercase mb-1">Tabungan Global</p>
                            <h3 className="text-xl font-black text-emerald-600 dark:text-emerald-400">{formatRp(stats.tab)}</h3>
                        </div>
                        <div className="bg-yellow-50 dark:bg-yellow-900/20 p-4 rounded-2xl shadow-sm border border-yellow-200 dark:border-yellow-800">
                            <p className="text-xs text-brandYellow font-bold uppercase mb-1">Pinjaman Global</p>
                            <h3 className="text-xl font-black text-brandYellow">{formatRp(stats.pin)}</h3>
                        </div>
                    </div>

                    <div className="bg-white dark:bg-darkCard rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 overflow-hidden">
                        <div className="p-3 md:p-4 border-b border-gray-100 dark:border-gray-800 flex flex-col md:flex-row justify-between md:items-center gap-3">
                            <h3 className="font-bold uppercase text-xs md:text-sm">Semua Transaksi</h3>
                            <div className="flex gap-2">
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
                                        <TanggalImageIcon />
                                    </div>
                                    <input type="date" value={filterDate} onChange={e=>setFilterDate(e.target.value)} className="p-2 pl-9 text-[10px] md:text-xs rounded-lg bg-gray-100 dark:bg-gray-800 outline-none w-full md:w-auto border border-transparent focus:border-brandGreen" />
                                </div>
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
                                        <SearchImageIcon />
                                    </div>
                                    <input type="text" placeholder="Cari nama user..." value={filterUser} onChange={e=>setFilterUser(e.target.value)} className="p-2 pl-9 text-[10px] md:text-xs rounded-lg bg-gray-100 dark:bg-gray-800 outline-none w-full md:w-auto border border-transparent focus:border-brandGreen" />
                                </div>
                            </div>
                        </div>
                        <div className="max-h-[50vh] overflow-y-auto p-2 md:p-4 space-y-2 bg-gray-50/30 dark:bg-darkBg/30">
                            {listFiltered.length === 0 ? <p className="p-4 text-center text-gray-400 text-xs">Tidak ada transaksi</p> :
                            listFiltered.map(tx => {
                                const u = users.find(usr => usr.id === tx.userId);
                                return (
                                <div key={tx.id} className="bg-white dark:bg-darkCard p-3 rounded-xl border border-gray-100 dark:border-gray-800 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-2 md:gap-4 hover:bg-gray-50 dark:hover:bg-gray-800/30">
                                    <div className="flex items-start md:items-center gap-3 min-w-0">
                                        <div className="w-8 h-8 rounded-full bg-blue-100 text-blue-500 flex items-center justify-center font-bold text-xs uppercase shrink-0">
                                            {u ? u.username.charAt(0) : '?'}
                                        </div>
                                        <div className="min-w-0">
                                            <p className="font-bold text-xs md:text-sm truncate">{tx.name}</p>
                                            <p className="text-[10px] text-gray-500 truncate">{u ? u.username : 'Unknown'} • {tx.category} • {tx.date}</p>
                                        </div>
                                    </div>
                                    <div className={`font-bold text-xs md:text-sm text-right md:text-right ${tx.type==='income'?'text-brandGreen':'text-brandRed'}`}>
                                        {tx.type==='income'?'+':'-'}{formatRp(tx.amount)}
                                    </div>
                                </div>
                            )})}
                        </div>
                        <div className="bg-gray-50 dark:bg-gray-900 p-3 md:p-4 border-t border-gray-200 dark:border-gray-800 flex justify-between items-center">
                            <span className="font-bold text-gray-500 uppercase text-[10px] md:text-xs">Jumlah Total Filter:</span>
                            <span className={`font-black text-sm md:text-base ${listTotal >= 0 ? 'text-brandGreen' : 'text-brandRed'}`}>{formatRp(listTotal)}</span>
                        </div>
                    </div>
                </div>
            );
        }

        function AdminDataUser({ users, saveDoc, deleteDoc, transactions }) {
            const [showAdd, setShowAdd] = useState(false);
            const [newU, setNewU] = useState('');
            const [newP, setNewP] = useState('');
            const [isReadOnly, setIsReadOnly] = useState(false);
            const [parentId, setParentId] = useState('');
            
            const [visiblePasswords, setVisiblePasswords] = useState({});
            const [deleteTargetUser, setDeleteTargetUser] = useState(null);
            const [editTargetUser, setEditTargetUser] = useState(null);
            const [editU, setEditU] = useState('');
            const [editP, setEditP] = useState('');
            const [editRole, setEditRole] = useState('utama');
            const [editParentId, setEditParentId] = useState('');

            const handleAdd = async (e) => {
                e.preventDefault();
                if(!newU || !newP) return;
                if(isReadOnly && !parentId) return alert('Silakan pilih User Utama yang ingin dipantau!');
                
                const id = generateId();
                await saveDoc('users', id, { 
                    id, 
                    username: newU, 
                    password: newP, 
                    targetName: 'Target', 
                    targetPrice: 1000000,
                    role: isReadOnly ? 'anggota' : 'utama',
                    parentId: isReadOnly ? parentId : null
                });
                setNewU(''); setNewP(''); setIsReadOnly(false); setParentId(''); setShowAdd(false);
            };

            const confirmDeleteUser = async () => {
                if (!deleteTargetUser) return;
                
                const children = users.filter(u => u.parentId === deleteTargetUser.id);
                for(let child of children) {
                    await deleteDoc('users', child.id);
                }
                await deleteDoc('users', deleteTargetUser.id);
                
                const userTx = transactions.filter(t => t.userId === deleteTargetUser.id);
                for(let tx of userTx) {
                    await deleteDoc('transactions', tx.id);
                }
                setDeleteTargetUser(null);
            };

            const handleEditClick = (u) => {
                setEditTargetUser(u);
                setEditU(u.username);
                setEditP(u.password);
                setEditRole(u.role || 'utama');
                setEditParentId(u.parentId || '');
            };

            const confirmEditUser = async (e) => {
                e.preventDefault();
                if(!editU || !editP) return;
                if(editRole === 'anggota' && !editParentId) return alert('Silakan pilih User Utama yang ingin dipantau!');
                
                await saveDoc('users', editTargetUser.id, { 
                    ...editTargetUser,
                    username: editU, 
                    password: editP, 
                    role: editRole,
                    parentId: editRole === 'anggota' ? editParentId : null
                });
                setEditTargetUser(null);
            };

            const togglePass = (id) => setVisiblePasswords(prev => ({...prev, [id]: !prev[id]}));

            return (
                <div className="space-y-4 animate-fade-in max-w-4xl mx-auto">
                    <div className="flex justify-between items-center">
                        <h2 className="text-xl font-black">Data User</h2>
                        <button onClick={()=>setShowAdd(!showAdd)} className="bg-brandRed text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md hover:bg-red-600 transition">
                            <i className="fas fa-plus mr-2"></i> Tambah User
                        </button>
                    </div>

                    {showAdd && (
                        <form onSubmit={handleAdd} className="bg-white dark:bg-darkCard p-4 md:p-6 rounded-2xl border border-brandRed/20 animate-fade-in shadow-lg">
                            <h3 className="font-bold text-sm mb-4 border-b border-gray-100 dark:border-gray-800 pb-2">Buat Akun Baru</h3>
                            <div className="flex flex-col gap-4">
                                <div className="flex flex-col sm:flex-row gap-3">
                                    <div className="relative w-full sm:flex-1">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <UserImageIcon />
                                        </div>
                                        <input type="text" placeholder="Username" value={newU} onChange={e=>setNewU(e.target.value)} className="w-full p-2.5 pl-10 rounded-lg bg-gray-100 dark:bg-gray-800 text-xs md:text-sm outline-none border border-transparent focus:border-brandGreen" required />
                                    </div>
                                    <div className="relative w-full sm:flex-1">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <PasswordImageIcon />
                                        </div>
                                        <input type="text" placeholder="Password" value={newP} onChange={e=>setNewP(e.target.value)} className="w-full p-2.5 pl-10 rounded-lg bg-gray-100 dark:bg-gray-800 text-xs md:text-sm outline-none border border-transparent focus:border-brandGreen" required />
                                    </div>
                                </div>
                                <div className="flex flex-col sm:flex-row gap-3 sm:items-center">
                                    <div className="flex items-center gap-2 w-full sm:w-auto shrink-0 bg-blue-50 dark:bg-blue-900/10 p-2.5 rounded-lg border border-blue-100 dark:border-blue-900/30">
                                        <input type="checkbox" id="readOnlyCheck" className="w-4 h-4 cursor-pointer accent-brandRed" checked={isReadOnly} onChange={e => { setIsReadOnly(e.target.checked); setParentId(''); }} />
                                        <label htmlFor="readOnlyCheck" className="text-xs font-bold text-blue-700 dark:text-blue-400 cursor-pointer">Akses Read-Only (Anggota)</label>
                                    </div>
                                    {isReadOnly && (
                                        <select value={parentId} onChange={e=>setParentId(e.target.value)} className="w-full sm:flex-1 p-2.5 rounded-lg bg-white dark:bg-darkBg text-xs md:text-sm outline-none border border-blue-200 dark:border-blue-800 focus:border-brandGreen cursor-pointer" required>
                                            <option value="">-- Pilih User Utama yang Dipantau --</option>
                                            {users.filter(u => u.role !== 'anggota').map(u => (
                                                <option key={u.id} value={u.id}>{u.username}</option>
                                            ))}
                                        </select>
                                    )}
                                    <button type="submit" className="w-full sm:w-auto bg-brandGreen text-white px-8 py-2.5 rounded-lg font-bold text-xs md:text-sm shrink-0 mt-2 sm:mt-0 shadow-md">Simpan</button>
                                </div>
                            </div>
                        </form>
                    )}

                    <div className="bg-white dark:bg-darkCard rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs md:text-sm whitespace-nowrap">
                                <thead className="bg-gray-50 dark:bg-gray-800/50 text-gray-500 uppercase">
                                    <tr>
                                        <th className="p-4 w-12 text-center">No</th>
                                        <th className="p-4">Nama</th>
                                        <th className="p-4">Password</th>
                                        <th className="p-4">Akses Role</th>
                                        <th className="p-4 text-center w-28">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100 dark:divide-gray-800">
                                    {users.length === 0 ? (
                                        <tr>
                                            <td colSpan="5" className="p-6 text-center text-gray-400">Tidak ada user terdaftar.</td>
                                        </tr>
                                    ) : (
                                        users.map((u, i) => (
                                            <tr key={u.id} className="hover:bg-gray-50 dark:hover:bg-gray-800/30 transition-colors">
                                                <td className="p-4 text-center text-gray-500 font-bold">{i+1}</td>
                                                <td className="p-4 font-bold capitalize">{u.username}</td>
                                                <td className="p-4">
                                                    <div className="flex items-center gap-2">
                                                        <span className="font-mono bg-gray-100 dark:bg-gray-800 px-2 py-1 rounded text-xs text-gray-500">
                                                            {visiblePasswords[u.id] ? u.password : '••••••••'}
                                                        </span>
                                                        <button type="button" onClick={()=>togglePass(u.id)} className="text-gray-400 hover:text-brandRed text-xs">
                                                            <i className={`fas ${visiblePasswords[u.id] ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                                        </button>
                                                    </div>
                                                </td>
                                                <td className="p-4">
                                                    {u.role === 'anggota' ? (
                                                        <span className="inline-flex items-center gap-1.5 text-[10px] bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 border border-blue-200 dark:border-blue-800 px-2.5 py-1 rounded-md font-bold">
                                                            <i className="fas fa-eye"></i> Anggota dari: {users.find(x => x.id === u.parentId)?.username || '?'}
                                                        </span>
                                                    ) : (
                                                        <span className="inline-flex items-center gap-1.5 text-[10px] bg-green-50 text-brandGreen dark:bg-green-900/30 border border-green-200 dark:border-green-800 px-2.5 py-1 rounded-md font-bold">
                                                            <i className="fas fa-user-shield"></i> Utama (CRUD)
                                                        </span>
                                                    )}
                                                </td>
                                                <td className="p-4 text-center">
                                                    <div className="flex items-center justify-center gap-0.5">
                                                        <button type="button" onClick={()=>handleEditClick(u)} className="text-blue-500 hover:text-blue-600 transition p-1 flex items-center justify-center" title="Edit">
                                                            <i className="fas fa-edit text-lg"></i>
                                                        </button>
                                                        <button type="button" onClick={()=>setDeleteTargetUser(u)} className="text-brandRed hover:text-red-600 transition p-1 flex items-center justify-center" title="Hapus">
                                                            <i className="fas fa-trash-alt text-lg"></i>
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {deleteTargetUser && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/65 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white dark:bg-darkCard w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-brandRed/20 text-center">
                                <div className="w-16 h-16 rounded-full bg-red-100 dark:bg-red-900/30 text-brandRed flex items-center justify-center text-2xl mx-auto mb-4">
                                    <i className="fas fa-exclamation-triangle"></i>
                                </div>
                                <h3 className="text-lg font-bold mb-2">Hapus User?</h3>
                                <p className="text-sm text-gray-500 mb-6">Yakin ingin menghapus user <span className="font-bold text-gray-800 dark:text-white capitalize">{deleteTargetUser.username}</span> beserta semua data transaksinya dari Cloud? Tindakan ini tidak bisa dibatalkan.</p>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setDeleteTargetUser(null)} className="flex-1 py-3 rounded-xl bg-gray-100 dark:bg-gray-800 font-bold text-sm hover:bg-gray-200 transition">Batal</button>
                                    <button type="button" onClick={confirmDeleteUser} className="flex-1 py-3 rounded-xl bg-brandRed text-white font-bold text-sm hover:bg-red-600 transition">Hapus User</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Edit Data User */}
                    {editTargetUser && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/65 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white dark:bg-darkCard w-full max-w-sm rounded-3xl p-6 shadow-2xl border-t-4 border-blue-500">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold">Edit Data User</h3>
                                    <button type="button" onClick={() => setEditTargetUser(null)} className="text-gray-400 hover:text-gray-800"><i className="fas fa-times"></i></button>
                                </div>
                                <form onSubmit={confirmEditUser} className="flex flex-col gap-4">
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-500 uppercase">Username</label>
                                        <div className="relative mt-1">
                                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                                <UserImageIcon />
                                            </div>
                                            <input type="text" value={editU} onChange={e=>setEditU(e.target.value)} className="w-full p-3 pl-10 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none text-sm focus:ring-2 focus:ring-blue-500" required />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-500 uppercase">Password</label>
                                        <div className="relative mt-1">
                                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                                <PasswordImageIcon />
                                            </div>
                                            <input type="text" value={editP} onChange={e=>setEditP(e.target.value)} className="w-full p-3 pl-10 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none text-sm focus:ring-2 focus:ring-blue-500" required />
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2 p-3 bg-blue-50 dark:bg-blue-900/10 rounded-xl border border-blue-100 dark:border-blue-900/30">
                                        <input type="checkbox" id="editReadOnlyCheck" className="w-4 h-4 cursor-pointer accent-blue-600" checked={editRole === 'anggota'} onChange={e => { setEditRole(e.target.checked ? 'anggota' : 'utama'); setEditParentId(''); }} />
                                        <label htmlFor="editReadOnlyCheck" className="text-xs font-bold text-blue-700 dark:text-blue-400 cursor-pointer">Akses Read-Only (Anggota)</label>
                                    </div>
                                    {editRole === 'anggota' && (
                                        <div className="animate-fade-in">
                                            <label className="text-[10px] font-bold text-gray-500 uppercase">Pantau User Utama</label>
                                            <select value={editParentId} onChange={e=>setEditParentId(e.target.value)} className="w-full mt-1 p-3 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none text-sm focus:ring-2 focus:ring-blue-500 cursor-pointer" required>
                                                <option value="">-- Pilih User Utama --</option>
                                                {users.filter(u => u.role !== 'anggota' && u.id !== editTargetUser.id).map(u => (
                                                    <option key={u.id} value={u.id}>{u.username}</option>
                                                ))}
                                            </select>
                                        </div>
                                    )}
                                    <div className="flex gap-3 mt-2">
                                        <button type="button" onClick={() => setEditTargetUser(null)} className="flex-1 py-3 rounded-xl bg-gray-100 dark:bg-gray-800 font-bold text-sm hover:bg-gray-200 transition">Batal</button>
                                        <button type="submit" className="flex-1 py-3 rounded-xl bg-blue-600 text-white font-bold text-sm hover:bg-blue-700 transition shadow-md">Simpan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function AdminBrankas({ transactions, users }) {
            const [tab, setTab] = useState('tabungan');
            const [fDate, setFDate] = useState('');
            const [fUser, setFUser] = useState('');

            const catLabel = tab === 'tabungan' ? 'Tabungan' : 'Pinjaman';
            
            const listData = useMemo(() => {
                let res = transactions.filter(t => t.category.toLowerCase() === tab).sort((a,b) => b.timestamp - a.timestamp);
                if(fDate) res = res.filter(t => t.date === fDate);
                if(fUser) {
                    const term = fUser.toLowerCase();
                    res = res.filter(t => {
                        const u = users.find(usr => usr.id === t.userId);
                        return u && u.username.toLowerCase().includes(term);
                    });
                }
                return res;
            }, [transactions, tab, fDate, fUser, users]);

            const globalTotal = useMemo(() => {
                let total = 0;
                transactions.filter(t => t.category.toLowerCase() === tab).forEach(tx => {
                    const amt = Number(tx.amount);
                    if (tab === 'tabungan') {
                        if(tx.type === 'income') total -= amt; 
                        else total += amt;
                    } else {
                        if(tx.type === 'income') total += amt; 
                        else total -= amt;
                    }
                });
                return total;
            }, [transactions, tab]);

            const listFilteredTotal = useMemo(() => {
                return listData.reduce((acc, curr) => {
                    const isVaultIncome = tab === 'tabungan' ? curr.type === 'expense' : curr.type === 'income';
                    return acc + (isVaultIncome ? curr.amount : -curr.amount);
                }, 0);
            }, [listData, tab]);

            return (
                <div className="space-y-6 animate-fade-in max-w-5xl mx-auto">
                    <div className="flex bg-gray-200 dark:bg-gray-800 p-1 rounded-2xl w-full max-w-sm mx-auto">
                        <button onClick={() => setTab('tabungan')} className={`flex-1 py-2 rounded-xl text-sm font-bold transition ${tab === 'tabungan' ? 'bg-white dark:bg-gray-600 shadow text-brandGreen' : 'text-gray-500'}`}>Tabungan Global</button>
                        <button onClick={() => setTab('pinjaman')} className={`flex-1 py-2 rounded-xl text-sm font-bold transition ${tab === 'pinjaman' ? 'bg-white dark:bg-gray-600 shadow text-brandYellow' : 'text-gray-500'}`}>Pinjaman Global</button>
                    </div>

                    <div className={`relative ${tab === 'tabungan' ? 'bg-emerald-900 text-white border-transparent' : 'bg-yellow-900 text-white border-transparent'} rounded-3xl p-6 text-center shadow-xl overflow-hidden`}>
                        <i className={`fas ${tab === 'tabungan' ? 'fa-piggy-bank' : 'fa-hand-holding-usd'} absolute -right-4 -bottom-4 text-9xl opacity-20`}></i>
                        <p className="text-white/80 font-bold uppercase text-[10px] md:text-xs mb-2">Total Akumulasi {catLabel} Seluruh User</p>
                        <h2 className="text-3xl md:text-4xl font-black">{formatRp(globalTotal)}</h2>
                    </div>

                    <div className="bg-white dark:bg-darkCard rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 overflow-hidden">
                        <div className="p-3 md:p-4 border-b border-gray-100 dark:border-gray-800 flex flex-col md:flex-row justify-between md:items-center gap-3">
                            <h3 className="font-bold uppercase text-xs md:text-sm">Riwayat {catLabel} Global</h3>
                            <div className="flex gap-2">
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
                                        <TanggalImageIcon />
                                    </div>
                                    <input type="date" value={fDate} onChange={e=>setFDate(e.target.value)} className="p-2 pl-9 text-[10px] md:text-xs rounded-lg bg-gray-100 dark:bg-gray-800 outline-none w-full md:w-auto border border-transparent focus:border-brandGreen" />
                                </div>
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
                                        <SearchImageIcon />
                                    </div>
                                    <input type="text" placeholder="Cari nama user..." value={fUser} onChange={e=>setFUser(e.target.value)} className="p-2 pl-9 text-[10px] md:text-xs rounded-lg bg-gray-100 dark:bg-gray-800 outline-none w-full md:w-auto border border-transparent focus:border-brandGreen" />
                                </div>
                            </div>
                        </div>
                        <div className="max-h-[50vh] overflow-y-auto p-2 md:p-4 space-y-2 bg-gray-50/30 dark:bg-darkBg/30">
                            {listData.length === 0 ? <p className="p-4 text-center text-gray-400 text-xs">Tidak ada transaksi</p> :
                            listData.map((tx, idx) => {
                                const u = users.find(usr => usr.id === tx.userId);
                                const isVaultIncome = tab === 'tabungan' ? tx.type === 'expense' : tx.type === 'income';
                                return (
                                <div key={tx.id} className="bg-white dark:bg-darkCard p-3 rounded-xl border border-gray-100 dark:border-gray-800 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-2 hover:bg-gray-50 dark:hover:bg-gray-800/30 transition">
                                    <div className="flex items-start md:items-center gap-3 min-w-0">
                                        <div className="w-6 h-6 md:w-8 md:h-8 shrink-0 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center font-bold text-[10px] md:text-xs text-gray-500">{idx+1}</div>
                                        <div className="min-w-0">
                                            <p className="font-bold text-xs md:text-sm truncate">{tx.name}</p>
                                            <p className="text-[10px] text-gray-500 truncate">{u ? u.username : 'Unknown'} • {tx.date}</p>
                                        </div>
                                    </div>
                                    <div className={`font-bold text-xs md:text-sm text-right ${isVaultIncome ? 'text-brandGreen' : 'text-brandRed'}`}>
                                        {isVaultIncome ? '+' : '-'}{formatRp(tx.amount)}
                                    </div>
                                </div>
                            )})}
                        </div>
                        <div className="bg-gray-50 dark:bg-gray-900 p-3 md:p-4 border-t border-gray-200 dark:border-gray-800 flex justify-between items-center">
                            <span className="font-bold text-gray-500 uppercase text-[10px] md:text-xs">Jumlah Total (Dari data tampil):</span>
                            <span className={`font-black text-sm md:text-base ${listFilteredTotal >= 0 ? 'text-brandGreen' : 'text-brandRed'}`}>{formatRp(listFilteredTotal)}</span>
                        </div>
                    </div>
                </div>
            );
        }

        function AdminPengaturan({ saveDoc, deleteDoc, users, transactions }) {
            const [showConfirmReset, setShowConfirmReset] = useState(false);
            const [msg, setMsg] = useState('');

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onloadend = async () => {
                        await saveDoc('settings', 'global', { bgImage: reader.result });
                        alert('Background berhasil diubah untuk semua perangkat.');
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleResetCloud = async () => {
                try {
                    for (let tx of transactions) {
                        await deleteDoc('transactions', tx.id);
                    }
                    for (let u of users) {
                        await deleteDoc('users', u.id);
                    }
                    setMsg('Seluruh data Cloud Firestore berhasil di-reset!');
                    setShowConfirmReset(false);
                    setTimeout(() => setMsg(''), 4000);
                } catch (error) {
                    console.error("Reset Error:", error);
                    alert("Gagal mereset data. Periksa koneksi Anda.");
                }
            };

            return (
                <div className="animate-fade-in max-w-md mx-auto pt-4 space-y-6">
                    {msg && (
                        <div className="bg-green-100 text-green-700 p-3 rounded-xl text-sm font-bold text-center animate-fade-in">
                            {msg}
                        </div>
                    )}

                    <div className="bg-white dark:bg-darkCard p-6 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-800">
                        <h2 className="text-xl font-black mb-4 flex items-center gap-2"><i className="fas fa-image text-brandRed"></i> Kustomisasi Tampilan</h2>
                        <p className="text-xs text-gray-500 mb-4">Ubah gambar latar belakang untuk seluruh halaman aplikasi (User & Admin). Gunakan gambar transparan/gelap untuk hasil terbaik.</p>
                        
                        <label className="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-gray-300 dark:border-gray-700 rounded-xl cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800/50 transition">
                            <div className="flex flex-col items-center justify-center pt-5 pb-6">
                                <i className="fas fa-cloud-upload-alt text-3xl text-gray-400 mb-2"></i>
                                <p className="mb-2 text-sm text-gray-500"><span className="font-bold">Klik untuk upload</span></p>
                            </div>
                            <input type="file" className="hidden" accept="image/*" onChange={handleImageUpload} />
                        </label>
                        <button type="button" onClick={async () => { await saveDoc('settings', 'global', { bgImage: '' }); alert('Background di-reset.'); }} className="w-full mt-4 py-2 text-sm text-brandRed border border-brandRed/30 rounded-xl hover:bg-red-50 dark:hover:bg-red-900/20 font-bold transition">
                            Hapus Latar Belakang
                        </button>
                    </div>

                    <div className="bg-red-50 dark:bg-red-900/10 p-6 rounded-3xl border border-red-100 dark:border-red-900/30">
                        <h3 className="font-bold text-brandRed mb-2 flex items-center gap-2">
                            <i className="fas fa-radiation-alt"></i> Area Reset Sistem
                        </h3>
                        <p className="text-xs text-gray-500 mb-4">Menghapus seluruh akun user terdaftar serta melenyapkan semua riwayat transaksi yang tersimpan di Cloud database secara permanen.</p>
                        <button type="button" onClick={() => setShowConfirmReset(true)} className="w-full py-3 bg-brandRed text-white rounded-xl font-bold shadow-md hover:bg-red-600 transition duration-200">
                            Reset Total Semua Data Cloud
                        </button>
                    </div>

                    {showConfirmReset && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white dark:bg-darkCard w-full max-w-sm rounded-3xl p-6 shadow-2xl border-2 border-brandRed text-center animate-shake">
                                <div className="w-16 h-16 rounded-full bg-red-100 dark:bg-red-900/30 text-brandRed flex items-center justify-center text-2xl mx-auto mb-4 animate-bounce">
                                    <i className="fas fa-trash-alt"></i>
                                </div>
                                <h3 className="text-lg font-bold mb-2 text-brandRed">PERINGATAN KERAS!</h3>
                                <p className="text-sm text-gray-500 mb-6">Yakin ingin menghapus seluruh akun user dan semua data transaksi dari Cloud database? Tindakan ini akan melenyapkan sistem secara total dan data tidak dapat dipulihkan kembali.</p>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setShowConfirmReset(false)} className="flex-1 py-3 rounded-xl bg-gray-100 dark:bg-gray-800 font-bold text-sm hover:bg-gray-200 transition">Batal</button>
                                    <button type="button" onClick={handleResetCloud} className="flex-1 py-3 rounded-xl bg-brandRed text-white font-bold text-sm hover:bg-red-600 transition">Reset Sekarang</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
