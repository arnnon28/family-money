<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Money</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        darkCard: '#1e1e1e',
                        brandGreen: '#10b981',
                        brandRed: '#ef4444',
                        brandYellow: '#f59e0b',
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'shake': 'shake 0.82s cubic-bezier(.36,.07,.19,.97) both',
                        'shake-infinite': 'shake 1s cubic-bezier(.36,.07,.19,.97) infinite',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'blink': 'blink 1.5s infinite'
                    },
                    keyframes: {
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        blink: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0' }
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&display=swap');

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; transition: background-color 0.3s, color 0.3s; }
        .bg-glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .dark .bg-glass { background: rgba(30, 30, 30, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
            appearance: none;
        }

        .global-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: -1;
            opacity: 0.15;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-darkBg dark:text-gray-100 antialiased overflow-x-hidden selection:bg-brandGreen selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const formatRp = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num || 0);
        const generateId = () => crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).substr(2);
        const getTodayDate = () => {
            const now = new Date();
            const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
            return local.toISOString().slice(0, 10);
        };
        const normalizeDateValue = (value) => {
            if (!value || typeof value !== 'string') return '';
            const normalized = value.trim().replace(/\//g, '-');
            const parts = normalized.split('-');
            if (parts.length !== 3) return value;
            const [first, second, third] = parts;
            if (first.length === 4) {
                return `${first}-${second.padStart(2, '0')}-${third.padStart(2, '0')}`;
            }
            if (third.length === 4) {
                return `${third}-${second.padStart(2, '0')}-${first.padStart(2, '0')}`;
            }
            return value;
        };
        const compressImageFile = (file, maxWidth = 1200, quality = 0.72) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        const scale = Math.min(1, maxWidth / img.width);
                        const width = Math.round(img.width * scale);
                        const height = Math.round(img.height * scale);
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        let dataUrl;
                        try {
                            dataUrl = canvas.toDataURL('image/webp', quality);
                        } catch (error) {
                            dataUrl = canvas.toDataURL('image/jpeg', quality);
                        }
                        resolve(dataUrl);
                    };
                    img.onerror = reject;
                    img.src = reader.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        };
        const quotes = ["Hemat pangkal kaya.", "Kelola uangmu, atau uang yang mengelolamu.", "Investasi terbaik adalah pada dirimu sendiri.", "Sedikit demi sedikit, lama-lama menjadi bukit."];

        // --- Ikon Gambar Vektor Premium (Reusable Inline SVGs) ---

                <path d="M12 13C9.33 13 4 14.33 4 17V19H20V17C20 14.33 14.67 13 12 13Z" fill="white"/>
                <defs>
                    <linearGradient id="userGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                        <stop stopColor="#3b82f6"/>

        const PasswordImageIcon = () => (
            <svg className="w-5 h-5 drop-shadow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="24" height="24" rx="12" fill="url(#lockGrad)" />
                <path d="M12 11C11.1716 11 10.5 11.6716 10.5 12.5C10.5 13.1116 10.8654 13.6377 11.3875 13.8712L11 17H13L12.6125 13.8712C13.1346 13.6377 13.5 13.1116 13.5 12.5C13.5 11.6716 12.8284 11 12 11Z" fill="white"/>
                <path d="M17 10H16V8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8V10H7C6.45 10 6 10.45 6 11V18C6 18.55 6.45 19 7 19H17C17.55 19 18 18.55 18 18V11C18 10.45 17.55 10 17 10ZM10 8C10 6.9 10.9 6 12 6C13.1 6 14 6.9 14 8V10H10V8Z" fill="white" fillRule="evenodd" clipRule="evenodd"/>
                <defs>
                    <linearGradient id="lockGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                        <stop stopColor="#ef4444"/>

        const TransactionNameImageIcon = () => (
            <svg className="w-5 h-5 drop-shadow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="24" height="24" rx="12" fill="url(#noteGrad)" />
                <path d="M16 12H8V14H16V12Z" fill="white"/>
                <path d="M16 8H8V10H16V8Z" fill="white"/>
                <path d="M6 18V6C6 4.9 6.9 4 8 4H16C17.1 4 18 4.9 18 6V18L12 15L6 18Z" fill="white" fillRule="evenodd" clipRule="evenodd"/>
                <defs>
                    <linearGradient id="noteGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                        <stop stopColor="#10b981"/>

        const NominalImageIcon = () => (
            <svg className="w-5 h-5 drop-shadow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="24" height="24" rx="12" fill="url(#walletGrad)" />
                <path d="M19 10V14C19 14.55 18.55 15 18 15H17V17C17 17.55 16.55 18 16 18H7C6.45 18 6 17.55 6 17V7C6 6.45 6.45 6 7 6H16C16.55 6 17 6.45 17 7V9H18C18.55 9 19 9.45 19 10ZM15 14H8V16H15V14ZM15 8H8V10H15V8ZM18 11H16V13H18V11Z" fill="white" fillRule="evenodd" clipRule="evenodd"/>
                <defs>
                    <linearGradient id="walletGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                        <stop stopColor="#f59e0b"/>
                        <stop offset="1" stopColor="#d97706"/>
                    </linearGradient>
                </defs>
            </svg>
        );

        const TanggalImageIcon = () => (
            <svg className="w-5 h-5 drop-shadow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="24" height="24" rx="12" fill="url(#calGrad)" />
                <path d="M17 12H7V14H17V12ZM14 15H10V17H14V15ZM16 5V7H8V5H6V19H18V5H16ZM16 9H8V11H16V9Z" fill="white" fillRule="evenodd" clipRule="evenodd"/>
                <defs>
                    <linearGradient id="calGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                        <stop stopColor="#3b82f6"/>
                        <stop offset="1" stopColor="#1d4ed8"/>
                    </linearGradient>
                </defs>
            </svg>
        );

        const KategoriImageIcon = () => (
            <svg className="w-5 h-5 drop-shadow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="24" height="24" rx="12" fill="url(#catGrad)" />
                <path d="M12 7H17V9H12V7ZM12 11H17V13H12V11ZM12 15H17V17H12V15ZM7 7H9V9H7V7ZM7 11H9V13H7V11ZM7 15H9V17H7V15Z" fill="white" fillRule="evenodd" clipRule="evenodd"/>
                <defs>
                    <linearGradient id="catGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                        <stop stopColor="#8b5cf6"/>
                        <stop offset="1" stopColor="#6d28d9"/>
                    </linearGradient>
                </defs>
            </svg>
        );

        const SearchImageIcon = () => (
            <svg className="w-5 h-5 drop-shadow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="24" height="24" rx="12" fill="url(#searchGrad)" />
                <path d="M15.5 14H14.71L14.43 13.73C15.41 12.59 16 11.11 16 9.5C16 5.91 13.09 3 9.5 3C5.91 3 3 5.91 3 9.5C3 13.09 5.91 16 9.5 16C11.11 16 12.59 15.41 13.73 14.43L14 14.71V15.5L19 20.49L20.49 19L15.5 14ZM9.5 14C7.01 14 5 11.99 5 9.5C5 7.01 7.01 5 9.5 5C11.99 5 14 7.01 14 9.5C14 11.99 11.99 14 9.5 14Z" fill="white"/>
                <defs>
                    <linearGradient id="searchGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                        <stop stopColor="#4b5563"/>
                        <stop offset="1" stopColor="#1f2937"/>
                    </linearGradient>
                </defs>
            </svg>
        );

        const TargetNameImageIcon = () => (
            <svg className="w-5 h-5 drop-shadow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="24" height="24" rx="12" fill="url(#targetGrad)" />
                <circle cx="12" cy="12" r="5" stroke="white" strokeWidth="2" />
                <circle cx="12" cy="12" r="2" fill="white" />
                <path d="M12 2V5" stroke="white" strokeWidth="2" strokeLinecap="round"/>
                <path d="M12 19V22" stroke="white" strokeWidth="2" strokeLinecap="round"/>
                <path d="M2 12H5" stroke="white" strokeWidth="2" strokeLinecap="round"/>
                <path d="M19 12H22" stroke="white" strokeWidth="2" strokeLinecap="round"/>
                <defs>
                    <linearGradient id="targetGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                        <stop stopColor="#f59e0b"/>
                        <stop offset="1" stopColor="#ef4444"/>
                    </linearGradient>
                </defs>
            </svg>
        );

        // --- Main App Component ---
        function App() {
            // State: System
            const [fb, setFb] = useState(null);
            const [appState, setAppState] = useState('splash'); // splash, auth, user, admin
            const [theme, setTheme] = useState('dark');
            const [bgImage, setBgImage] = useState('');
            const [loadingStr, setLoadingStr] = useState('Memuat Sistem...');

            // State: Data
            const [users, setUsers] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [currentUser, setCurrentUser] = useState(null);
            const currentUserDoc = currentUser ? (users.find(u => u.id === currentUser.id) || currentUser) : null;
            const effectiveBgImage = currentUserDoc?.customBg || bgImage;

            // --- Initialize Firebase dynamically ---
            useEffect(() => {
                const initFirebase = async () => {
                    try {
                        const appModule = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js');
                        const authModule = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js');
                        const firestoreModule = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');

                        let config;
                        if (typeof __firebase_config !== 'undefined') {
                            config = JSON.parse(__firebase_config);
                        } else {
                            config = {
                                apiKey: "AIzaSyDthArIAK750A5QCZqhQHhkFqyex9thfAE",
                                authDomain: "family-money-39f70.firebaseapp.com",
                                projectId: "family-money-39f70",
                                storageBucket: "family-money-39f70.firebasestorage.app",
                                messagingSenderId: "599306599652",
                                appId: "1:599306599652:web:9177b4597708226ae2c0f1"
                            };
                        }

                        const app = appModule.initializeApp(config);
                        const auth = authModule.getAuth(app);
                        const db = firestoreModule.getFirestore(app);

                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await authModule.signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await authModule.signInAnonymously(auth);
                        }

                        setFb({ db, firestoreModule, authModule, auth });
                    } catch (error) {
                        console.error("Firebase Init Error:", error);
                        setLoadingStr('Gagal memuat database.');
                    }
                };
                initFirebase();
            }, []);

            // --- Theme Manager ---
            useEffect(() => {
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [theme]);

            const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

            // --- Data Listeners ---
            useEffect(() => {
                if (!fb?.db) return;
                const { collection, onSnapshot, doc } = fb.firestoreModule;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-money';
                
                const usersRef = collection(fb.db, 'artifacts', appId, 'public', 'data', 'users');
                const txRef = collection(fb.db, 'artifacts', appId, 'public', 'data', 'transactions');
                const settingsRef = doc(fb.db, 'artifacts', appId, 'public', 'data', 'settings', 'global');

                const unsubUsers = onSnapshot(usersRef, snap => {
                    setUsers(snap.docs.map(d => ({ ...d.data(), id: d.id })));
                }, err => console.error(err));

                const unsubTx = onSnapshot(txRef, snap => {
                    setTransactions(snap.docs.map(d => ({ ...d.data(), id: d.id })));
                }, err => console.error(err));

                const unsubSettings = onSnapshot(settingsRef, snap => {
                    if(snap.exists()) setBgImage(snap.data().bgImage || '');
                });

                return () => { unsubUsers(); unsubTx(); unsubSettings(); };
            }, [fb]);

            // --- Database Helpers ---
            const saveDoc = async (collectionName, id, data) => {
                if(!fb) return;
                const { doc, setDoc } = fb.firestoreModule;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-money';
                const ref = doc(fb.db, 'artifacts', appId, 'public', 'data', collectionName, id);
                await setDoc(ref, data, { merge: true });
            };

            const deleteDocRef = async (collectionName, id) => {
                if(!fb) return;
                const { doc, deleteDoc } = fb.firestoreModule;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-money';
                const ref = doc(fb.db, 'artifacts', appId, 'public', 'data', collectionName, id);
                await deleteDoc(ref);
            };

            // --- Render Logic ---
            if (!fb) {
                return <div className="min-h-screen flex items-center justify-center font-bold text-xl animate-pulse">{loadingStr}</div>;
            }

            return (
                <div className="min-h-screen relative">
                    {effectiveBgImage && <div className="global-bg" style={{ backgroundImage: `url(${effectiveBgImage})` }}></div>}
                    
                    {appState === 'splash' && <SplashScreen onLoginClick={() => setAppState('auth')} onAdminClick={() => setAppState('adminAuth')} toggleTheme={toggleTheme} theme={theme} />}
                    {appState === 'auth' && <AuthModal users={users} onLogin={u => { setCurrentUser(u); setAppState('user'); }} onBack={() => setAppState('splash')} saveDoc={saveDoc} />}
                    {appState === 'adminAuth' && <AdminAuthModal onLogin={() => setAppState('admin')} onBack={() => setAppState('splash')} />}
                    
                    {appState === 'user' && currentUser && <UserLayout currentUser={users.find(u => u.id === currentUser.id) || currentUser} users={users} transactions={transactions} saveDoc={saveDoc} deleteDoc={deleteDocRef} onLogout={() => { setCurrentUser(null); setAppState('splash'); }} toggleTheme={toggleTheme} theme={theme} />}
                    
                    {appState === 'admin' && <AdminLayout users={users} transactions={transactions} saveDoc={saveDoc} deleteDoc={deleteDocRef} onLogout={() => setAppState('splash')} toggleTheme={toggleTheme} theme={theme} />}
                </div>
            );
        }

        // ==========================================
        // UI COMPONENTS
        // ==========================================

        function SplashScreen({ onLoginClick, onAdminClick, toggleTheme, theme }) {
            const quote = useMemo(() => quotes[Math.floor(Math.random() * quotes.length)], []);

            return (
                <div className="flex flex-col items-center justify-center min-h-screen relative p-4">
                    <div className="absolute top-4 right-4 flex gap-3">
                        <button onClick={toggleTheme} className="w-10 h-10 rounded-full bg-glass flex items-center justify-center text-xl hover:scale-110 transition">
                            <i className={`fas ${theme === 'dark' ? 'fa-sun text-yellow-400' : 'fa-moon text-gray-700'}`}></i>
                        </button>
                        <button onClick={onAdminClick} className="w-10 h-10 rounded-full bg-glass flex items-center justify-center text-sm opacity-50 hover:opacity-100 transition">
                            <i className="fas fa-lock"></i>
                        </button>
                    </div>
                    
                    <img src="https://iili.io/C9EsjQS.png" alt="Logo" className="w-24 h-24 md:w-48 md:h-48 object-contain mb-4 md:mb-6 animate-pulse-slow drop-shadow-2xl" />
                    <h1 className="text-3xl md:text-5xl bg-clip-text text-transparent bg-gradient-to-r from-fuchsia-500 via-blue-500 to-white mb-2 text-center drop-shadow-sm" style={{ fontFamily: "'Poppins', sans-serif", fontWeight: 900, lineHeight: 1.2 }}>Family Money</h1>
                    <p className="text-[10px] md:text-base italic opacity-70 mb-8 md:mb-10 text-center max-w-xs">"{quote}"</p>
                    
                    <button onClick={onLoginClick} className="px-10 py-3 rounded-full bg-gradient-to-r from-fuchsia-500 to-blue-500 text-white font-bold shadow-lg shadow-blue-500/30 hover:scale-105 active:scale-95 transition-all text-sm md:text-lg">
                        Masuk
                    </button>
                </div>
            );
        }

        function AuthModal({ users, onLogin, onBack, saveDoc }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [showPass, setShowPass] = useState(false);
            const [error, setError] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                if(!username || !password) return setError('Isi semua kolom!');

                const user = users.find(u => u.username === username && u.password === password);
                if (user) onLogin(user);
                else setError('Username atau password salah!');
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in">
                    <div className="bg-white/0 dark:bg-darkCard/0 w-full max-w-md rounded-3xl p-6 shadow-2xl relative border-2 border-brandGreen dark:border-brandGreen/50">
                        <button onClick={onBack} className="absolute top-4 left-4 text-gray-500 hover:text-gray-800 dark:hover:text-white">
                            <i className="fas fa-arrow-left text-xl"></i>
                        </button>
                        <h2 className="text-2xl font-bold text-center mb-6">Login Akun</h2>
                        
                        {error && <div className="bg-red-100 text-red-600 p-3 rounded-xl text-sm mb-4 text-center animate-shake">{error}</div>}
                        
                        <form onSubmit={handleSubmit} className="flex flex-col gap-4">
                            <div>
                                <label className="text-xs font-semibold text-gray-500 uppercase">Username</label>
                                <div className="relative mt-1">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <UserImageIcon />
                                    </div>
                                    <input type="text" value={username} onChange={e=>setUsername(e.target.value)} className="w-full p-3 pl-10 rounded-xl bg-gray-100 dark:bg-gray-800 border-none focus:ring-2 focus:ring-brandGreen outline-none text-sm md:text-base" placeholder="Username" />
                                </div>
                            </div>
                            <div>
                                <label className="text-xs font-semibold text-gray-500 uppercase">Password</label>
                                <div className="relative mt-1">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <PasswordImageIcon />
                                    </div>
                                    <input type={showPass ? 'text' : 'password'} value={password} onChange={e=>setPassword(e.target.value)} className="w-full p-3 pl-10 pr-10 rounded-xl bg-gray-100 dark:bg-gray-800 border-none focus:ring-2 focus:ring-brandGreen outline-none text-sm md:text-base" placeholder="Password" />
                                    <button type="button" onClick={()=>setShowPass(!showPass)} className="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition">
                                        <i className={`fas ${showPass ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                    </button>
                                </div>
                            </div>
                            <button type="submit" className="w-full py-3 mt-2 rounded-xl bg-brandGreen text-white font-bold shadow-md hover:bg-emerald-600 transition">
                                Masuk
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        function AdminAuthModal({ onLogin, onBack }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [showPass, setShowPass] = useState(false);
            const [error, setError] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                if(username === 'arnnon' && password === 'andri123') onLogin();
                else setError('Akses Ditolak!');
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
                    <div className="bg-white/0 dark:bg-darkCard/0 w-full max-w-sm rounded-3xl p-6 shadow-2xl relative border-t-4 border-brandRed">
                         <button onClick={onBack} className="absolute top-4 left-4 text-gray-500 hover:text-gray-800 dark:hover:text-white transition"><i className="fas fa-times"></i></button>
                        <h2 className="text-xl font-bold text-center mb-6 text-brandRed"><i className="fas fa-shield-alt mr-2"></i>Login Admin</h2>
                        {error && <div className="bg-red-100 text-red-600 p-2 rounded text-sm mb-4 text-center animate-shake">{error}</div>}
                        <form onSubmit={handleLogin} className="flex flex-col gap-4">
                            <div className="relative">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <UserImageIcon />
                                </div>
                                <input type="text" value={username} onChange={e=>setUsername(e.target.value)} className="w-full p-3 pl-10 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none focus:ring-2 focus:ring-brandRed border-none text-sm md:text-base" placeholder="Username" />
                            </div>
                            <div className="relative">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <PasswordImageIcon />
                                </div>
                                <input type={showPass ? 'text' : 'password'} value={password} onChange={e=>setPassword(e.target.value)} className="w-full p-3 pl-10 pr-10 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none focus:ring-2 focus:ring-brandRed border-none text-sm md:text-base" placeholder="Password" />
                                <button type="button" onClick={()=>setShowPass(!showPass)} className="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition">
                                    <i className={`fas ${showPass ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                </button>
                            </div>
                            <button className="py-3 mt-2 rounded-xl bg-brandRed text-white font-bold shadow-md hover:bg-red-600 transition">Akses Sistem</button>
                        </form>
                    </div>
                </div>
            );
        }

        // ==========================================
        // USER LAYOUT & VIEWS
        // ==========================================
        function UserLayout({ currentUser, users, transactions, saveDoc, deleteDoc, onLogout, toggleTheme, theme }) {
            const [activeTab, setActiveTab] = useState('beranda');
            const [showGlobalModal, setShowGlobalModal] = useState(false);
            const [globalTxType, setGlobalTxType] = useState('income');
            
            const isReadOnly = currentUser.role === 'anggota';
            const activeUserId = isReadOnly ? currentUser.parentId : currentUser.id;
            const activeUserDoc = users.find(u => u.id === activeUserId) || currentUser;

            const userTx = useMemo(() => transactions.filter(t => t.userId === activeUserId), [transactions, activeUserId]);

            const stats = useMemo(() => {
                let balance = 0, income = 0, expense = 0, tabungan = 0, pinjaman = 0, nonTabunganExpense = 0;
                userTx.forEach(tx => {
                    const amt = Number(tx.amount);
                    if(tx.type === 'income') {
                        income += amt; balance += amt;
                        if(tx.category === 'Tabungan') tabungan -= amt;
                        if(tx.category === 'Pinjaman') pinjaman += amt;
                    } else {
                        expense += amt; balance -= amt;
                        if(tx.category === 'Tabungan') tabungan += amt;
                        else if(tx.category === 'Pinjaman') pinjaman -= amt;
                        else nonTabunganExpense += amt;
                    }
                });
                return { balance, income, expense, tabungan, pinjaman, nonTabunganExpense };
            }, [userTx]);

            const tabs = [
                { id: 'beranda', icon: 'fa-home', label: 'Beranda' },
                { id: 'riwayat', icon: 'fa-receipt', label: 'Riwayat' },
                { id: 'target', icon: 'fa-bullseye', label: 'Target' },
                { id: 'brankas', icon: 'fa-vault', label: isReadOnly ? 'Tabungan' : 'Brankas' },
            ];
            if (!isReadOnly) {
                tabs.push({ id: 'pengaturan', icon: 'fa-cog', label: 'Pengaturan' });
            }

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Desktop Sidebar */}
                    <div className="hidden md:flex flex-col w-64 bg-white/0 dark:bg-darkCard/0 border-r border-gray-200 dark:border-gray-800 shadow-xl z-20">
                        <div className="p-6 flex flex-col items-center justify-center gap-2 border-b border-gray-100 dark:border-gray-800">
                            <img src="https://iili.io/C9EsjQS.png" className="w-16 h-16 object-contain" alt="logo"/>
                            <span className="font-black text-xl text-center text-transparent bg-clip-text bg-gradient-to-r from-brandGreen to-teal-400">Family Money</span>
                        </div>
                        <div className="flex-1 p-4 flex flex-col gap-2">
                            {tabs.map(t => (
                                <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex items-center gap-4 px-4 py-3 rounded-xl font-medium transition ${activeTab === t.id ? 'bg-brandGreen text-white shadow-lg' : 'text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800'}`}>
                                    <i className={`fas ${t.icon} w-5`}></i> {t.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col h-full overflow-hidden relative">
                        {/* Header */}
                        <header className="px-4 py-3 md:px-8 md:py-4 bg-white/0 dark:bg-darkCard/0 backdrop-blur-md sticky top-0 z-10 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <img src="https://iili.io/C9EsjQS.png" alt="Logo" className="w-10 h-10 object-contain drop-shadow-md" />
                                <div>
                                    <p className="text-xs text-gray-500 font-medium">Selamat Datang,</p>
                                    <h2 className="text-sm md:text-base font-bold capitalize flex flex-wrap items-center gap-2">
                                        {currentUser.username}
                                        {isReadOnly && (
                                            <span className="text-[10px] bg-blue-100 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 px-2 py-0.5 rounded-md align-middle shadow-sm">
                                                <i className="fas fa-eye mr-1"></i>Memantau: {activeUserDoc.username}
                                            </span>
                                        )}
                                    </h2>
                                </div>
                            </div>
                            <div className="flex items-center gap-2 md:gap-4">
                                {!isReadOnly && (
                                    <>
                                    <button onClick={() => { setGlobalTxType('income'); setShowGlobalModal(true); }} className="w-8 h-8 rounded-full bg-green-100 dark:bg-green-900/30 flex items-center justify-center text-sm text-brandGreen hover:scale-110 transition shadow-sm shrink-0" title="Tambah Pemasukan">
                                        <i className="fas fa-plus"></i>
                                    </button>
                                    <button onClick={() => { setGlobalTxType('expense'); setShowGlobalModal(true); }} className="w-8 h-8 rounded-full bg-red-100 dark:bg-red-900/30 flex items-center justify-center text-sm text-brandRed hover:scale-110 transition shadow-sm shrink-0" title="Tambah Pengeluaran">
                                        <i className="fas fa-minus"></i>
                                    </button>
                                    </>
                                )}
                                <button onClick={toggleTheme} className="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-sm transition hover:scale-110 shrink-0">
                                    <i className={`fas ${theme === 'dark' ? 'fa-sun text-yellow-400' : 'fa-moon text-gray-400'}`}></i>
                                </button>
                                <button onClick={onLogout} className="text-brandRed hover:bg-red-50 dark:hover:bg-red-900/20 p-2 rounded-lg text-sm font-semibold transition shrink-0">
                                    <i className="fas fa-sign-out-alt md:mr-2"></i><span className="hidden md:inline">Keluar</span>
                                </button>
                            </div>
                        </header>

                        {/* Scrollable Content Area */}
                        <main className="flex-1 overflow-y-auto p-4 md:p-8 pb-24 md:pb-8">
                            {activeTab === 'beranda' && <UserBeranda stats={stats} userTx={userTx} userData={activeUserDoc} saveDoc={saveDoc} isReadOnly={isReadOnly} onOpenGlobalModal={(type) => { setGlobalTxType(type); setShowGlobalModal(true); }} />}
                            {activeTab === 'riwayat' && <UserRiwayat userTx={userTx} deleteDoc={deleteDoc} saveDoc={saveDoc} userData={activeUserDoc} isReadOnly={isReadOnly} />}
                            {activeTab === 'target' && <UserTarget userData={activeUserDoc} stats={stats} saveDoc={saveDoc} isReadOnly={isReadOnly} />}
                            {activeTab === 'brankas' && <UserBrankas stats={stats} userTx={userTx} saveDoc={saveDoc} isReadOnly={isReadOnly} />}
                            {!isReadOnly && activeTab === 'pengaturan' && <UserPengaturan currentUser={currentUser} saveDoc={saveDoc} userTx={userTx} deleteDoc={deleteDoc} />}
                        </main>
                    </div>

                    {/* Mobile Bottom Nav */}
                    <div className="md:hidden fixed bottom-0 left-0 w-full bg-white/0 dark:bg-darkCard/0 border-t border-gray-200 dark:border-gray-800 flex justify-around p-2 pb-safe z-30 shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
                        {tabs.map(t => (
                            <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex flex-col items-center p-2 transition ${activeTab === t.id ? 'text-brandGreen scale-110' : 'text-gray-400'}`}>
                                <i className={`fas ${t.icon} text-lg mb-1`}></i>
                                <span className="text-[10px] font-medium">{t.label}</span>
                            </button>
                        ))}
                    </div>

                    {showGlobalModal && !isReadOnly && (
                        <TransactionModal type={globalTxType} onClose={() => setShowGlobalModal(false)} onSave={(data) => {
                            saveDoc('transactions', generateId(), { ...data, userId: currentUser.id, createdAt: Date.now() });
                            setShowGlobalModal(false);
                        }} />
                    )}
                </div>
            );
        }

        // ==========================================
        // SUB-VIEWS (USER)
        // ==========================================
        function UserBeranda({ stats, userTx, userData, isReadOnly, onOpenGlobalModal }) {
            const today = new Date().toISOString().slice(0, 10);
            
            const incomeToday = userTx.filter(t => t.type === 'income' && t.date === today).reduce((sum, t) => sum + Number(t.amount), 0);
            const expenseToday = userTx.filter(t => t.type === 'expense' && t.date === today).reduce((sum, t) => sum + Number(t.amount), 0);
            
            const currentMonth = new Date().toISOString().slice(0, 7);
            const incomeMonth = userTx.filter(t => t.type === 'income' && t.date.startsWith(currentMonth)).reduce((sum, t) => sum + Number(t.amount), 0);
            const expenseMonth = userTx.filter(t => t.type === 'expense' && t.date.startsWith(currentMonth)).reduce((sum, t) => sum + Number(t.amount), 0);

            const recentTx = userTx.sort((a,b) => b.createdAt - a.createdAt).slice(0, 5);

            return (
                <div className="space-y-6 md:space-y-8 animate-fade-in">
                    {/* Main Balance Card */}
                    <div className="bg-gradient-to-br from-brandGreen via-emerald-600 to-teal-700 rounded-3xl p-6 md:p-8 text-white shadow-xl relative overflow-hidden group">
                        <div className="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3 group-hover:scale-110 transition-transform duration-700"></div>
                        <div className="relative z-10">
                            <div className="flex justify-between items-start mb-6 md:mb-8">
                                <div>
                                    <p className="text-white/80 text-sm font-medium mb-1 drop-shadow"><i className="fas fa-wallet mr-2"></i>Total Saldo Anda</p>
                                    <h1 className="text-3xl md:text-5xl font-black tracking-tight drop-shadow-md">{formatRp(stats.balance)}</h1>
                                </div>
                                <div className="w-12 h-12 md:w-14 md:h-14 bg-white/20 rounded-2xl flex items-center justify-center backdrop-blur-md shadow-inner">
                                    <i className="fas fa-coins text-2xl md:text-3xl text-yellow-300 drop-shadow"></i>
                                </div>
                            </div>
                            <div className="flex items-center gap-6">
                                <div className="bg-white/10 rounded-2xl p-3 md:p-4 flex-1 backdrop-blur-sm border border-white/10">
                                    <p className="text-xs text-white/70 mb-1 flex items-center"><i className="fas fa-arrow-down mr-1 text-green-300"></i>Pemasukan Bulan Ini</p>
                                    <p className="font-bold text-sm md:text-lg">{formatRp(incomeMonth)}</p>
                                </div>
                                <div className="bg-white/10 rounded-2xl p-3 md:p-4 flex-1 backdrop-blur-sm border border-white/10">
                                    <p className="text-xs text-white/70 mb-1 flex items-center"><i className="fas fa-arrow-up mr-1 text-red-300"></i>Pengeluaran Bulan Ini</p>
                                    <p className="font-bold text-sm md:text-lg">{formatRp(expenseMonth)}</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Quick Stats Grid */}
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        <StatCard title="Pemasukan Hari Ini" amount={incomeToday} icon="fa-arrow-trend-up" color="text-brandGreen" bg="bg-green-100 dark:bg-green-900/20" />
                        <StatCard title="Pengeluaran Hari Ini" amount={expenseToday} icon="fa-arrow-trend-down" color="text-brandRed" bg="bg-red-100 dark:bg-red-900/20" />
                        <StatCard title="Tabungan" amount={stats.tabungan} icon="fa-piggy-bank" color="text-brandYellow" bg="bg-yellow-100 dark:bg-yellow-900/20" />
                        <StatCard title="Total Transaksi" amount={userTx.length} icon="fa-receipt" color="text-blue-500" bg="bg-blue-100 dark:bg-blue-900/20" isCount />
                    </div>

                    {/* Recent Transactions */}
                    <div className="bg-white/0 dark:bg-darkCard/0 rounded-3xl p-5 md:p-6 shadow-sm border border-gray-100 dark:border-gray-800">
                        <div className="flex justify-between items-center mb-6">
                            <h3 className="font-bold text-lg"><i className="fas fa-history mr-2 text-brandGreen"></i>Transaksi Terakhir</h3>
                            {!isReadOnly && (
                                <div className="flex gap-2">
                                    <button onClick={() => onOpenGlobalModal('income')} className="w-8 h-8 rounded-full bg-green-100 dark:bg-green-900/30 text-brandGreen hover:scale-110 transition"><i className="fas fa-plus"></i></button>
                                    <button onClick={() => onOpenGlobalModal('expense')} className="w-8 h-8 rounded-full bg-red-100 dark:bg-red-900/30 text-brandRed hover:scale-110 transition"><i className="fas fa-minus"></i></button>
                                </div>
                            )}
                        </div>
                        
                        {recentTx.length === 0 ? (
                            <div className="text-center py-10 text-gray-500 bg-gray-50 dark:bg-gray-800/50 rounded-2xl border border-dashed border-gray-200 dark:border-gray-700">
                                <i className="fas fa-receipt text-4xl mb-3 text-gray-300 dark:text-gray-600"></i>
                                <p>Belum ada transaksi</p>
                            </div>
                        ) : (
                            <div className="space-y-3">
                                {recentTx.map(tx => (
                                    <div key={tx.id} className="flex items-center justify-between p-4 rounded-2xl bg-gray-50 dark:bg-gray-800/50 hover:bg-gray-100 dark:hover:bg-gray-800 transition group border border-transparent hover:border-gray-200 dark:hover:border-gray-700">
                                        <div className="flex items-center gap-4">
                                            <div className={`w-12 h-12 rounded-xl flex items-center justify-center text-lg shadow-sm ${tx.type === 'income' ? 'bg-green-100 text-brandGreen dark:bg-green-900/30' : 'bg-red-100 text-brandRed dark:bg-red-900/30'}`}>
                                                <i className={`fas ${tx.type === 'income' ? 'fa-arrow-down' : 'fa-arrow-up'}`}></i>
                                            </div>
                                            <div>
                                                <p className="font-bold text-sm md:text-base capitalize group-hover:text-brandGreen transition-colors">{tx.name}</p>
                                                <p className="text-[10px] md:text-xs text-gray-500 mt-1"><i className="far fa-calendar-alt mr-1"></i>{tx.date} • {tx.category}</p>
                                            </div>
                                        </div>
                                        <p className={`font-bold text-sm md:text-base ${tx.type === 'income' ? 'text-brandGreen' : 'text-brandRed'}`}>
                                            {tx.type === 'income' ? '+' : '-'}{formatRp(tx.amount)}
                                        </p>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function StatCard({ title, amount, icon, color, bg, isCount }) {
            return (
                <div className="bg-white/0 dark:bg-darkCard/0 p-4 md:p-5 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-800 flex flex-col justify-between hover:-translate-y-1 transition-transform">
                    <div className="flex justify-between items-start mb-4">
                        <div className={`w-10 h-10 md:w-12 md:h-12 rounded-2xl flex items-center justify-center text-lg md:text-xl ${bg} ${color}`}>
                            <i className={`fas ${icon}`}></i>
                        </div>
                    </div>
                    <div>
                        <p className="text-xs text-gray-500 font-medium mb-1 line-clamp-1">{title}</p>
                        <h3 className="text-sm md:text-lg font-bold tracking-tight truncate">{isCount ? amount : formatRp(amount)}</h3>
                    </div>
                </div>
            );
        }

        // ... [Semua sisa komponen dari UserRiwayat, UserTarget, UserBrankas, dst disisipkan secara utuh di sini agar tidak mengubah fungsinya] ...
        
        function UserRiwayat({ userTx, deleteDoc, saveDoc, userData, isReadOnly }) {
            const [filterType, setFilterType] = useState('all');
            const [filterMonth, setFilterMonth] = useState('');
            const [searchQuery, setSearchQuery] = useState('');
            const [editingTx, setEditingTx] = useState(null);
            
            const filteredTx = useMemo(() => {
                return userTx.filter(tx => {
                    const matchType = filterType === 'all' || tx.type === filterType;
                    const matchMonth = filterMonth ? tx.date.startsWith(filterMonth) : true;
                    const matchSearch = tx.name.toLowerCase().includes(searchQuery.toLowerCase()) || tx.category.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchType && matchMonth && matchSearch;
                }).sort((a,b) => b.createdAt - a.createdAt);
            }, [userTx, filterType, filterMonth, searchQuery]);

            const handleDelete = (id) => {
                if(window.confirm('Hapus transaksi ini?')) deleteDoc('transactions', id);
            };

            const downloadPDF = () => {
                const doc = new window.jspdf.jsPDF();
                doc.setFont("helvetica", "bold");
                doc.setFontSize(16);
                doc.text("Laporan Transaksi - Family Money", 14, 20);
                
                doc.setFontSize(10);
                doc.setFont("helvetica", "normal");
                doc.text(`Nama: ${userData.username}`, 14, 28);
                doc.text(`Tanggal Cetak: ${new Date().toLocaleDateString('id-ID')}`, 14, 33);
                
                let filterText = "Filter: ";
                if(filterType !== 'all') filterText += `Tipe(${filterType}) `;
                if(filterMonth) filterText += `Bulan(${filterMonth}) `;
                if(searchQuery) filterText += `Pencarian(${searchQuery}) `;
                if(filterText === "Filter: ") filterText += "Semua Data";
                doc.text(filterText, 14, 38);

                const tableData = filteredTx.map((tx, index) => [
                    index + 1,
                    tx.date,
                    tx.name,
                    tx.category,
                    tx.type === 'income' ? 'Pemasukan' : 'Pengeluaran',
                    formatRp(tx.amount)
                ]);

                doc.autoTable({
                    startY: 45,
                    head: [['No', 'Tanggal', 'Nama Transaksi', 'Kategori', 'Tipe', 'Nominal']],
                    body: tableData,
                    theme: 'grid',
                    headStyles: { fillColor: [16, 185, 129], textColor: 255, fontStyle: 'bold' },
                    alternateRowStyles: { fillColor: [249, 250, 251] },
                    styles: { fontSize: 9, cellPadding: 3 }
                });

                let totalIn = 0, totalOut = 0;
                filteredTx.forEach(tx => {
                    if(tx.type === 'income') totalIn += Number(tx.amount);
                    else totalOut += Number(tx.amount);
                });

                const finalY = doc.lastAutoTable.finalY || 45;
                doc.setFont("helvetica", "bold");
                doc.text(`Total Pemasukan: ${formatRp(totalIn)}`, 14, finalY + 10);
                doc.text(`Total Pengeluaran: ${formatRp(totalOut)}`, 14, finalY + 16);
                doc.text(`Selisih: ${formatRp(totalIn - totalOut)}`, 14, finalY + 22);

                doc.save(`Laporan_Transaksi_${userData.username}_${Date.now()}.pdf`);
            };

            return (
                <div className="space-y-4 md:space-y-6 animate-fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <h2 className="text-xl md:text-2xl font-bold"><i className="fas fa-receipt mr-2 text-brandGreen"></i>Riwayat Transaksi</h2>
                        <button onClick={downloadPDF} className="w-full md:w-auto px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-xl text-sm font-bold shadow-md transition flex items-center justify-center gap-2">
                            <i className="fas fa-file-pdf"></i> Unduh PDF
                        </button>
                    </div>

                    <div className="bg-white/0 dark:bg-darkCard/0 p-4 md:p-5 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-800 space-y-4">
                        <div className="flex flex-col md:flex-row gap-3">
                            <div className="flex-1 relative">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <SearchImageIcon />
                                </div>
                                <input type="text" placeholder="Cari transaksi..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} className="w-full pl-10 pr-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-brandGreen outline-none text-sm" />
                            </div>
                            <div className="flex gap-2 w-full md:w-auto">
                                <select value={filterType} onChange={e=>setFilterType(e.target.value)} className="flex-1 md:w-auto px-3 py-3 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-brandGreen outline-none text-sm font-medium">
                                    <option value="all">Semua Tipe</option>
                                    <option value="income">Pemasukan</option>
                                    <option value="expense">Pengeluaran</option>
                                </select>
                                <input type="month" value={filterMonth} onChange={e=>setFilterMonth(e.target.value)} className="flex-1 md:w-auto px-3 py-3 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-brandGreen outline-none text-sm font-medium" />
                            </div>
                        </div>

                        {filteredTx.length === 0 ? (
                            <div className="text-center py-12 text-gray-500">
                                <i className="fas fa-search text-4xl mb-3 text-gray-300 dark:text-gray-600"></i>
                                <p>Tidak ada transaksi yang sesuai.</p>
                            </div>
                        ) : (
                            <div className="overflow-x-auto rounded-xl border border-gray-100 dark:border-gray-800">
                                <table className="w-full text-left text-sm whitespace-nowrap">
                                    <thead className="bg-gray-50 dark:bg-gray-800/50 text-gray-500">
                                        <tr>
                                            <th className="p-4 font-semibold">Tanggal</th>
                                            <th className="p-4 font-semibold">Nama & Kategori</th>
                                            <th className="p-4 font-semibold text-right">Nominal</th>
                                            {!isReadOnly && <th className="p-4 font-semibold text-center">Aksi</th>}
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100 dark:divide-gray-800">
                                        {filteredTx.map(tx => (
                                            <tr key={tx.id} className="hover:bg-gray-50 dark:hover:bg-gray-800/30 transition">
                                                <td className="p-4"><span className="bg-gray-100 dark:bg-gray-800 px-2 py-1 rounded-md text-xs font-medium"><i className="far fa-calendar mr-1"></i>{tx.date}</span></td>
                                                <td className="p-4">
                                                    <p className="font-bold capitalize">{tx.name}</p>
                                                    <p className="text-xs text-gray-500 mt-0.5">{tx.category}</p>
                                                </td>
                                                <td className="p-4 text-right">
                                                    <span className={`font-bold ${tx.type === 'income' ? 'text-brandGreen' : 'text-brandRed'}`}>
                                                        {tx.type === 'income' ? '+' : '-'}{formatRp(tx.amount)}
                                                    </span>
                                                </td>
                                                {!isReadOnly && (
                                                    <td className="p-4 text-center">
                                                        <div className="flex items-center justify-center gap-2">
                                                            <button onClick={()=>setEditingTx(tx)} className="w-8 h-8 rounded-lg bg-blue-50 text-blue-500 hover:bg-blue-500 hover:text-white dark:bg-blue-900/30 transition shadow-sm"><i className="fas fa-edit text-xs"></i></button>
                                                            <button onClick={()=>handleDelete(tx.id)} className="w-8 h-8 rounded-lg bg-red-50 text-red-500 hover:bg-red-500 hover:text-white dark:bg-red-900/30 transition shadow-sm"><i className="fas fa-trash text-xs"></i></button>
                                                        </div>
                                                    </td>
                                                )}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                    {editingTx && !isReadOnly && (
                        <TransactionModal type={editingTx.type} initialData={editingTx} onClose={() => setEditingTx(null)} onSave={(data) => {
                            saveDoc('transactions', editingTx.id, data);
                            setEditingTx(null);
                        }} />
                    )}
                </div>
            );
        }

        // [Sisa fungsi UserTarget, UserBrankas, UserPengaturan, AdminLayout, dan komponen lainnya tetap sama persis sesuai aslinya]
        
        function UserTarget({ userData, stats, saveDoc, isReadOnly }) {
            const targets = userData.targets || [];
            const [showModal, setShowModal] = useState(false);

            const totalTargetAmount = targets.reduce((acc, curr) => acc + Number(curr.amount), 0);
            const isBalanceSufficient = stats.tabungan >= totalTargetAmount;
            
            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="flex justify-between items-center">
                        <h2 className="text-xl md:text-2xl font-bold"><i className="fas fa-bullseye mr-2 text-brandYellow"></i>Target Impian</h2>
                        {!isReadOnly && (
                            <button onClick={()=>setShowModal(true)} className="px-4 py-2 rounded-xl bg-brandYellow text-white font-bold text-sm shadow-md hover:bg-yellow-600 transition">
                                <i className="fas fa-plus mr-1"></i> Tambah Target
                            </button>
                        )}
                    </div>

                    <div className="bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 p-4 rounded-2xl flex items-start gap-3">
                        <i className="fas fa-info-circle text-blue-500 mt-1"></i>
                        <p className="text-sm text-blue-800 dark:text-blue-300">Target impian akan tercapai menggunakan <strong className="font-bold">Total Tabungan</strong> Anda. Saat ini total tabungan Anda: <strong className="font-bold">{formatRp(stats.tabungan)}</strong>.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {targets.map(t => {
                            const progress = Math.min(100, (stats.tabungan / t.amount) * 100);
                            return (
                                <div key={t.id} className="bg-white/0 dark:bg-darkCard/0 p-5 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-800 hover:shadow-md transition">
                                    <div className="flex justify-between items-start mb-3">
                                        <h3 className="font-bold text-lg capitalize">{t.name}</h3>
                                        {!isReadOnly && (
                                            <button onClick={() => {
                                                if(window.confirm('Hapus target ini?')) {
                                                    saveDoc('users', userData.id, { targets: targets.filter(x => x.id !== t.id) });
                                                }
                                            }} className="text-gray-400 hover:text-brandRed transition"><i className="fas fa-trash"></i></button>
                                        )}
                                    </div>
                                    <p className="text-xs text-gray-500 font-medium mb-1">Target Dana:</p>
                                    <p className="font-bold text-lg text-brandYellow mb-4">{formatRp(t.amount)}</p>
                                    
                                    <div className="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-3 mb-2 overflow-hidden">
                                        <div className="bg-gradient-to-r from-brandYellow to-orange-500 h-3 rounded-full transition-all duration-1000" style={{ width: `${progress}%` }}></div>
                                    </div>
                                    <div className="flex justify-between text-xs font-bold">
                                        <span className="text-gray-500">{progress.toFixed(1)}% Terkumpul</span>
                                        {progress >= 100 && <span className="text-brandGreen animate-pulse"><i className="fas fa-check-circle mr-1"></i>Tercapai!</span>}
                                    </div>
                                </div>
                            );
                        })}
                        {targets.length === 0 && (
                             <div className="col-span-full text-center py-12 bg-white/0 dark:bg-darkCard/0 rounded-3xl border border-dashed border-gray-200 dark:border-gray-800">
                                <i className="fas fa-bullseye text-4xl mb-3 text-gray-300 dark:text-gray-600"></i>
                                <p className="text-gray-500">Belum ada target. Yuk buat target impianmu!</p>
                            </div>
                        )}
                    </div>

                    {showModal && !isReadOnly && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white dark:bg-darkCard w-full max-w-md rounded-3xl p-6 shadow-2xl relative border-t-4 border-brandYellow">
                                <button onClick={()=>setShowModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i className="fas fa-times"></i></button>
                                <h3 className="text-xl font-bold mb-6"><i className="fas fa-plus-circle text-brandYellow mr-2"></i>Tambah Target</h3>
                                <form onSubmit={e => {
                                    e.preventDefault();
                                    const fd = new FormData(e.target);
                                    const newTarget = { id: generateId(), name: fd.get('name'), amount: Number(fd.get('amount')) };
                                    saveDoc('users', userData.id, { targets: [...targets, newTarget] });
                                    setShowModal(false);
                                }} className="space-y-4">
                                    <div>
                                        <label className="text-xs font-semibold text-gray-500 uppercase">Nama Impian</label>
                                        <div className="relative mt-1">
                                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><TargetNameImageIcon/></div>
                                            <input name="name" required className="w-full p-3 pl-10 rounded-xl bg-gray-50 dark:bg-gray-800 outline-none focus:ring-2 focus:ring-brandYellow border border-gray-200 dark:border-gray-700 text-sm" placeholder="Contoh: Beli Laptop Baru" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-gray-500 uppercase">Nominal Target (Rp)</label>
                                        <div className="relative mt-1">
                                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><NominalImageIcon/></div>
                                            <input name="amount" type="number" required className="w-full p-3 pl-10 rounded-xl bg-gray-50 dark:bg-gray-800 outline-none focus:ring-2 focus:ring-brandYellow border border-gray-200 dark:border-gray-700 text-sm" placeholder="5000000" />
                                        </div>
                                    </div>
                                    <button className="w-full py-3 rounded-xl bg-brandYellow text-white font-bold shadow-md hover:bg-yellow-600 transition">Simpan Target</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function UserBrankas({ stats, userTx, saveDoc, isReadOnly }) {
            const savings = userTx.filter(t => t.category === 'Tabungan').sort((a,b) => b.createdAt - a.createdAt);
            const totalMasuk = savings.filter(t => t.type === 'expense').reduce((s,t) => s + Number(t.amount), 0); // Pengeluaran (nabung)
            const totalKeluar = savings.filter(t => t.type === 'income').reduce((s,t) => s + Number(t.amount), 0); // Pemasukan (tarik tabungan)

            return (
                <div className="space-y-6 animate-fade-in">
                    <h2 className="text-xl md:text-2xl font-bold"><i className="fas fa-vault mr-2 text-indigo-500"></i>Catatan Tabungan</h2>
                    
                    <div className="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-3xl p-6 md:p-8 text-white shadow-xl flex items-center justify-between">
                        <div>
                            <p className="text-white/80 text-sm mb-1">Total Uang di Tabungan</p>
                            <h1 className="text-3xl md:text-4xl font-black">{formatRp(stats.tabungan)}</h1>
                        </div>
                        <i className="fas fa-piggy-bank text-5xl md:text-6xl text-white/20"></i>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                        <div className="bg-white/0 dark:bg-darkCard/0 p-4 rounded-2xl border border-gray-100 dark:border-gray-800 text-center">
                            <p className="text-xs text-gray-500 mb-1">Total Ditabung</p>
                            <p className="font-bold text-brandGreen">{formatRp(totalMasuk)}</p>
                        </div>
                        <div className="bg-white/0 dark:bg-darkCard/0 p-4 rounded-2xl border border-gray-100 dark:border-gray-800 text-center">
                            <p className="text-xs text-gray-500 mb-1">Total Ditarik</p>
                            <p className="font-bold text-brandRed">{formatRp(totalKeluar)}</p>
                        </div>
                    </div>

                    <div className="bg-white/0 dark:bg-darkCard/0 rounded-3xl p-4 md:p-6 shadow-sm border border-gray-100 dark:border-gray-800">
                        <h3 className="font-bold mb-4 border-b border-gray-100 dark:border-gray-800 pb-3">Riwayat Mutasi Tabungan</h3>
                        {savings.length === 0 ? (
                            <p className="text-center text-gray-500 py-6">Belum ada riwayat tabungan.</p>
                        ) : (
                            <div className="space-y-3">
                                {savings.map(tx => (
                                    <div key={tx.id} className="flex justify-between items-center p-3 rounded-xl bg-gray-50 dark:bg-gray-800/50">
                                        <div>
                                            <p className="font-bold text-sm capitalize">{tx.name}</p>
                                            <p className="text-xs text-gray-500">{tx.date}</p>
                                        </div>
                                        {/* Jika type expense (nabung), saldo tabungan bertambah (hijau). Jika income (tarik), saldo berkurang (merah) */}
                                        <p className={`font-bold text-sm ${tx.type === 'expense' ? 'text-brandGreen' : 'text-brandRed'}`}>
                                            {tx.type === 'expense' ? '+' : '-'}{formatRp(tx.amount)}
                                        </p>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function UserPengaturan({ currentUser, saveDoc, userTx, deleteDoc }) {
            const [bgFile, setBgFile] = useState(null);
            
            const handleBgChange = async (e) => {
                if(e.target.files[0]) {
                    const compressed = await compressImageFile(e.target.files[0]);
                    saveDoc('users', currentUser.id, { customBg: compressed });
                }
            };

            const resetDataUser = () => {
                if(window.confirm('Yakin ingin mereset seluruh data transaksi Anda? Saldo akan kembali 0.')) {
                    userTx.forEach(tx => deleteDoc('transactions', tx.id));
                }
            };

            return (
                <div className="space-y-6 max-w-2xl mx-auto animate-fade-in">
                    <h2 className="text-xl md:text-2xl font-bold"><i className="fas fa-cog mr-2 text-gray-500"></i>Pengaturan Akun</h2>
                    
                    <div className="bg-white/0 dark:bg-darkCard/0 p-5 md:p-6 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-800 space-y-6">
                        <div>
                            <h3 className="font-bold mb-2 flex items-center"><i className="fas fa-image text-blue-500 w-6"></i> Wallpaper Latar Belakang</h3>
                            <p className="text-xs text-gray-500 mb-3">Ubah gambar latar belakang khusus untuk akun Anda.</p>
                            <label className="inline-flex items-center gap-2 px-4 py-2 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-xl cursor-pointer text-sm font-medium transition">
                                <i className="fas fa-upload"></i> Pilih Gambar
                                <input type="file" accept="image/*" className="hidden" onChange={handleBgChange} />
                            </label>
                            {currentUser.customBg && (
                                <button onClick={() => saveDoc('users', currentUser.id, { customBg: '' })} className="ml-3 text-sm text-red-500 hover:underline">Hapus Wallpaper</button>
                            )}
                        </div>

                        <div className="pt-4 border-t border-gray-100 dark:border-gray-800">
                            <h3 className="font-bold mb-2 flex items-center"><i className="fas fa-shield-alt text-gray-500 w-6"></i> Ganti Password</h3>
                            <form onSubmit={e => {
                                e.preventDefault();
                                const p = e.target.password.value;
                                if(p.length < 4) return alert('Password minimal 4 karakter');
                                saveDoc('users', currentUser.id, { password: p });
                                alert('Password berhasil diubah!');
                                e.target.reset();
                            }} className="flex gap-2">
                                <input name="password" type="text" placeholder="Password baru..." className="flex-1 px-3 py-2 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 outline-none focus:ring-2 focus:ring-brandGreen text-sm" required />
                                <button className="px-4 py-2 bg-brandGreen text-white font-bold rounded-xl text-sm hover:bg-emerald-600 transition">Simpan</button>
                            </form>
                        </div>

                        <div className="pt-4 border-t border-gray-100 dark:border-gray-800">
                             <h3 className="font-bold text-brandRed mb-2 flex items-center"><i className="fas fa-exclamation-triangle w-6"></i> Zona Berbahaya</h3>
                             <p className="text-xs text-gray-500 mb-3">Tindakan ini tidak dapat dibatalkan.</p>
                             <button onClick={resetDataUser} className="px-4 py-2 bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400 font-bold rounded-xl text-sm hover:bg-red-200 dark:hover:bg-red-900/50 transition">
                                <i className="fas fa-trash-alt mr-2"></i>Reset Semua Transaksi Saya
                             </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // TRANSACTION MODAL (ADD / EDIT)
        // ==========================================
        function TransactionModal({ type, initialData, onClose, onSave }) {
            const isIncome = type === 'income';
            
            // Kategori Default
            const incomeCategories = ['Gaji', 'Bonus', 'Pemberian', 'Pinjaman', 'Hasil Usaha', 'Lainnya'];
            const expenseCategories = ['Makanan', 'Transportasi', 'Tagihan', 'Belanja', 'Hiburan', 'Kesehatan', 'Pendidikan', 'Tabungan', 'Cicilan', 'Lainnya'];
            
            const defaultCats = isIncome ? incomeCategories : expenseCategories;
            
            const [name, setName] = useState(initialData?.name || '');
            const [amount, setAmount] = useState(initialData?.amount || '');
            const [date, setDate] = useState(initialData?.date || getTodayDate());
            const [category, setCategory] = useState(initialData?.category || defaultCats[0]);

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave({
                    type,
                    name: name.trim(),
                    amount: Number(amount),
                    date: normalizeDateValue(date),
                    category
                });
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-end md:items-center justify-center bg-black/60 backdrop-blur-sm animate-fade-in">
                    <div className="bg-white dark:bg-darkCard w-full max-w-md md:rounded-3xl rounded-t-3xl p-6 shadow-2xl relative animate-fadeIn">
                        <div className="w-12 h-1.5 bg-gray-300 dark:bg-gray-700 rounded-full mx-auto mb-6 md:hidden"></div>
                        <button onClick={onClose} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-white transition w-8 h-8 flex items-center justify-center bg-gray-100 dark:bg-gray-800 rounded-full"><i className="fas fa-times"></i></button>
                        
                        <div className="flex items-center gap-3 mb-6">
                            <div className={`w-12 h-12 rounded-2xl flex items-center justify-center text-xl shadow-inner ${isIncome ? 'bg-green-100 text-brandGreen dark:bg-green-900/30' : 'bg-red-100 text-brandRed dark:bg-red-900/30'}`}>
                                <i className={`fas ${isIncome ? 'fa-arrow-down' : 'fa-arrow-up'}`}></i>
                            </div>
                            <div>
                                <h2 className="text-xl font-bold">{initialData ? 'Edit' : 'Tambah'} Transaksi</h2>
                                <p className={`text-xs font-semibold ${isIncome ? 'text-brandGreen' : 'text-brandRed'}`}>{isIncome ? 'Pemasukan Baru' : 'Pengeluaran Baru'}</p>
                            </div>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="text-xs font-semibold text-gray-500 uppercase">Nama Transaksi</label>
                                <div className="relative mt-1">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><TransactionNameImageIcon/></div>
                                    <input required value={name} onChange={e=>setName(e.target.value)} className="w-full p-3 pl-10 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-brandGreen outline-none text-sm" placeholder="Cth: Beli Baju" />
                                </div>
                            </div>
                            
                            <div>
                                <label className="text-xs font-semibold text-gray-500 uppercase">Nominal (Rp)</label>
                                <div className="relative mt-1">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><NominalImageIcon/></div>
