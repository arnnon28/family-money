<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Money</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        darkCard: '#1e1e1e',
                        brandGreen: '#10b981',
                        brandRed: '#ef4444',
                        brandYellow: '#f59e0b',
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'shake': 'shake 0.82s cubic-bezier(.36,.07,.19,.97) both',
                        'fade-in': 'fadeIn 0.5s ease-out forwards'
                    },
                    keyframes: {
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- jsPDF & AutoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&display=swap');

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; transition: background-color 0.3s, color 0.3s; }
        .bg-glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .dark .bg-glass { background: rgba(30, 30, 30, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        .global-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            z-index: -1; opacity: 0.15; pointer-events: none;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-darkBg dark:text-gray-100 antialiased overflow-x-hidden selection:bg-brandGreen selection:text-white">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- Utils ---
        const formatRp = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num || 0);
        const generateId = () => crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).substr(2);
        const quotes = ["Hemat pangkal kaya.", "Kelola uangmu, atau uang yang mengelolamu.", "Investasi terbaik adalah pada dirimu sendiri.", "Sedikit demi sedikit, lama-lama menjadi bukit."];

        // --- Main App Component ---
        function App() {
            // State: System
            const [fb, setFb] = useState(null);
            const [appState, setAppState] = useState('splash'); // splash, auth, user, admin
            const [theme, setTheme] = useState('dark');
            const [bgImage, setBgImage] = useState('');
            const [loadingStr, setLoadingStr] = useState('Memuat Sistem...');

            // State: Data
            const [users, setUsers] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [currentUser, setCurrentUser] = useState(null);

            // --- Initialize Firebase dynamically ---
            useEffect(() => {
                const initFirebase = async () => {
                    try {
                        const appModule = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js');
                        const authModule = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js');
                        const firestoreModule = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');

                        // Prioritize injected config (Canvas env), fallback to requested config (GitHub)
                        let config;
                        if (typeof __firebase_config !== 'undefined') {
                            config = JSON.parse(__firebase_config);
                        } else {
                            config = {
                                apiKey: "AIzaSyDthArIAK750A5QCZqhQHhkFqyex9thfAE",
                                authDomain: "family-money-39f70.firebaseapp.com",
                                projectId: "family-money-39f70",
                                storageBucket: "family-money-39f70.firebasestorage.app",
                                messagingSenderId: "599306599652",
                                appId: "1:599306599652:web:9177b4597708226ae2c0f1"
                            };
                        }

                        const app = appModule.initializeApp(config);
                        const auth = authModule.getAuth(app);
                        const db = firestoreModule.getFirestore(app);

                        // Auth setup required for Firestore rules (Canvas strict rules)
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await authModule.signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await authModule.signInAnonymously(auth);
                        }

                        setFb({ db, firestoreModule, authModule, auth });
                    } catch (error) {
                        console.error("Firebase Init Error:", error);
                        setLoadingStr('Gagal memuat database.');
                    }
                };
                initFirebase();
            }, []);

            // --- Theme Manager ---
            useEffect(() => {
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [theme]);

            const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

            // --- Data Listeners ---
            useEffect(() => {
                if (!fb?.db) return;
                const { collection, onSnapshot, doc } = fb.firestoreModule;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-money';
                
                // Read all data from public namespace to satisfy Admin needs and Canvas rules
                const usersRef = collection(fb.db, 'artifacts', appId, 'public', 'data', 'users');
                const txRef = collection(fb.db, 'artifacts', appId, 'public', 'data', 'transactions');
                const settingsRef = doc(fb.db, 'artifacts', appId, 'public', 'data', 'settings', 'global');

                const unsubUsers = onSnapshot(usersRef, snap => {
                    setUsers(snap.docs.map(d => ({ docId: d.id, ...d.data() })));
                }, err => console.error(err));

                const unsubTx = onSnapshot(txRef, snap => {
                    setTransactions(snap.docs.map(d => ({ docId: d.id, ...d.data() })));
                }, err => console.error(err));

                const unsubSettings = onSnapshot(settingsRef, snap => {
                    if(snap.exists()) setBgImage(snap.data().bgImage || '');
                });

                return () => { unsubUsers(); unsubTx(); unsubSettings(); };
            }, [fb]);

            // --- Database Helpers ---
            const saveDoc = async (collectionName, id, data) => {
                if(!fb) return;
                const { doc, setDoc } = fb.firestoreModule;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-money';
                const ref = doc(fb.db, 'artifacts', appId, 'public', 'data', collectionName, id);
                await setDoc(ref, data, { merge: true });
            };

            const deleteDocRef = async (collectionName, id) => {
                if(!fb) return;
                const { doc, deleteDoc } = fb.firestoreModule;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-money';
                const ref = doc(fb.db, 'artifacts', appId, 'public', 'data', collectionName, id);
                await deleteDoc(ref);
            };

            // --- Render Logic ---
            if (!fb) {
                return <div className="min-h-screen flex items-center justify-center font-bold text-xl animate-pulse">{loadingStr}</div>;
            }

            return (
                <div className="min-h-screen relative">
                    {bgImage && <div className="global-bg" style={{ backgroundImage: `url(${bgImage})` }}></div>}
                    
                    {appState === 'splash' && <SplashScreen onLoginClick={() => setAppState('auth')} onAdminClick={() => setAppState('adminAuth')} toggleTheme={toggleTheme} theme={theme} />}
                    {appState === 'auth' && <AuthModal users={users} onLogin={u => { setCurrentUser(u); setAppState('user'); }} onBack={() => setAppState('splash')} saveDoc={saveDoc} />}
                    {appState === 'adminAuth' && <AdminAuthModal onLogin={() => setAppState('admin')} onBack={() => setAppState('splash')} />}
                    
                    {appState === 'user' && currentUser && <UserLayout currentUser={users.find(u => u.id === currentUser.id) || currentUser} transactions={transactions} saveDoc={saveDoc} deleteDoc={deleteDocRef} onLogout={() => { setCurrentUser(null); setAppState('splash'); }} toggleTheme={toggleTheme} theme={theme} />}
                    
                    {appState === 'admin' && <AdminLayout users={users} transactions={transactions} saveDoc={saveDoc} deleteDoc={deleteDocRef} onLogout={() => setAppState('splash')} toggleTheme={toggleTheme} theme={theme} />}
                </div>
            );
        }

        // ==========================================
        // UI COMPONENTS
        // ==========================================

        function SplashScreen({ onLoginClick, onAdminClick, toggleTheme, theme }) {
            const quote = useMemo(() => quotes[Math.floor(Math.random() * quotes.length)], []);
            return (
                <div className="flex flex-col items-center justify-center min-h-screen relative p-4">
                    <div className="absolute top-4 right-4 flex gap-3">
                        <button onClick={toggleTheme} className="w-10 h-10 rounded-full bg-glass flex items-center justify-center text-xl hover:scale-110 transition">
                            <i className={`fas ${theme === 'dark' ? 'fa-sun text-yellow-400' : 'fa-moon text-gray-700'}`}></i>
                        </button>
                        <button onClick={onAdminClick} className="w-10 h-10 rounded-full bg-glass flex items-center justify-center text-sm opacity-50 hover:opacity-100 transition">
                            <i className="fas fa-lock"></i>
                        </button>
                    </div>
                    
                    <img src="https://iili.io/C9EsjQS.png" alt="Logo" className="w-24 h-24 md:w-48 md:h-48 object-contain mb-4 md:mb-6 animate-pulse-slow drop-shadow-2xl" />
                    <h1 className="text-3xl md:text-5xl bg-clip-text text-transparent bg-gradient-to-r from-brandGreen to-teal-400 mb-2 text-center" style={{ fontFamily: "'Poppins', sans-serif", fontWeight: 900, lineHeight: 1.2 }}>Family Money</h1>
                    <p className="text-[10px] md:text-base italic opacity-70 mb-8 md:mb-10 text-center max-w-xs">"{quote}"</p>
                    
                    <button onClick={onLoginClick} className="px-6 py-2.5 md:px-8 md:py-3 rounded-full bg-brandGreen text-white font-bold shadow-lg shadow-brandGreen/30 hover:scale-105 active:scale-95 transition-all text-sm md:text-lg w-full max-w-xs">
                        Masuk
                    </button>
                </div>
            );
        }

        function AuthModal({ users, onLogin, onBack, saveDoc }) {
            const [isRegister, setIsRegister] = useState(false);
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [showPass, setShowPass] = useState(false);
            const [error, setError] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                if(!username || !password) return setError('Isi semua kolom!');

                if (isRegister) {
                    if (users.find(u => u.username === username)) return setError('Username sudah ada!');
                    const newUser = { id: generateId(), username, password, targetName: 'Beli Rumah', targetPrice: 500000000 };
                    await saveDoc('users', newUser.id, newUser);
                    onLogin(newUser);
                } else {
                    const user = users.find(u => u.username === username && u.password === password);
                    if (user) onLogin(user);
                    else setError('Username atau password salah!');
                }
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in">
                    <div className="bg-white dark:bg-darkCard w-full max-w-md rounded-3xl p-6 shadow-2xl relative">
                        <button onClick={onBack} className="absolute top-4 left-4 text-gray-500 hover:text-gray-800 dark:hover:text-white">
                            <i className="fas fa-arrow-left text-xl"></i>
                        </button>
                        <h2 className="text-2xl font-bold text-center mb-6">{isRegister ? 'Daftar Akun Baru' : 'Login Akun'}</h2>
                        
                        {error && <div className="bg-red-100 text-red-600 p-3 rounded-xl text-sm mb-4 text-center animate-shake">{error}</div>}
                        
                        <form onSubmit={handleSubmit} className="flex flex-col gap-4">
                            <div>
                                <label className="text-xs font-semibold text-gray-500 uppercase">Username</label>
                                <input type="text" value={username} onChange={e=>setUsername(e.target.value)} className="w-full mt-1 p-3 rounded-xl bg-gray-100 dark:bg-gray-800 border-none focus:ring-2 focus:ring-brandGreen outline-none" placeholder="Masukkan username" />
                            </div>
                            <div className="relative">
                                <label className="text-xs font-semibold text-gray-500 uppercase">Password</label>
                                <input type={showPass ? 'text' : 'password'} value={password} onChange={e=>setPassword(e.target.value)} className="w-full mt-1 p-3 rounded-xl bg-gray-100 dark:bg-gray-800 border-none focus:ring-2 focus:ring-brandGreen outline-none" placeholder="Masukkan password" />
                                <button type="button" onClick={()=>setShowPass(!showPass)} className="absolute right-3 top-9 text-gray-400">
                                    <i className={`fas ${showPass ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                </button>
                            </div>
                            <button type="submit" className="w-full py-3 mt-2 rounded-xl bg-brandGreen text-white font-bold shadow-md hover:bg-emerald-600 transition">
                                {isRegister ? 'Daftar Sekarang' : 'Masuk'}
                            </button>
                        </form>
                        <p className="text-center text-sm mt-4 text-gray-500">
                            {isRegister ? 'Sudah punya akun? ' : 'Belum punya akun? '}
                            <span onClick={()=>setIsRegister(!isRegister)} className="text-brandGreen font-bold cursor-pointer">{isRegister ? 'Login' : 'Daftar'}</span>
                        </p>
                    </div>
                </div>
            );
        }

        function AdminAuthModal({ onLogin, onBack }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                if(username === 'arnnon' && password === 'andri123') onLogin();
                else setError('Akses Ditolak!');
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
                    <div className="bg-white dark:bg-darkCard w-full max-w-sm rounded-3xl p-6 shadow-2xl relative border-t-4 border-brandRed">
                         <button onClick={onBack} className="absolute top-4 left-4 text-gray-500"><i className="fas fa-times"></i></button>
                        <h2 className="text-xl font-bold text-center mb-6 text-brandRed"><i className="fas fa-shield-alt mr-2"></i>Login Admin</h2>
                        {error && <div className="bg-red-100 text-red-600 p-2 rounded text-sm mb-4 text-center">{error}</div>}
                        <form onSubmit={handleLogin} className="flex flex-col gap-3">
                            <input type="text" value={username} onChange={e=>setUsername(e.target.value)} className="p-3 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none" placeholder="Admin Username" />
                            <input type="password" value={password} onChange={e=>setPassword(e.target.value)} className="p-3 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none" placeholder="Admin Password" />
                            <button className="py-3 rounded-xl bg-brandRed text-white font-bold">Akses Sistem</button>
                        </form>
                    </div>
                </div>
            );
        }

        // ==========================================
        // USER LAYOUT & VIEWS
        // ==========================================
        function UserLayout({ currentUser, transactions, saveDoc, deleteDoc, onLogout, toggleTheme, theme }) {
            const [activeTab, setActiveTab] = useState('beranda');
            
            const userTx = useMemo(() => transactions.filter(t => t.userId === currentUser.id), [transactions, currentUser.id]);

            const stats = useMemo(() => {
                let balance = 0, income = 0, expense = 0, tabungan = 0, pinjaman = 0, nonTabunganExpense = 0;
                userTx.forEach(tx => {
                    const amt = Number(tx.amount);
                    if(tx.type === 'income') {
                        income += amt; balance += amt;
                        if(tx.category === 'Tabungan') tabungan -= amt;
                        if(tx.category === 'Pinjaman') pinjaman += amt;
                    } else {
                        expense += amt; balance -= amt;
                        if(tx.category === 'Tabungan') tabungan += amt;
                        else if(tx.category === 'Pinjaman') pinjaman -= amt;
                        else nonTabunganExpense += amt;
                    }
                });
                return { balance, income, expense, tabungan, pinjaman, nonTabunganExpense };
            }, [userTx]);

            const tabs = [
                { id: 'beranda', icon: 'fa-home', label: 'Beranda' },
                { id: 'riwayat', icon: 'fa-receipt', label: 'Riwayat' },
                { id: 'target', icon: 'fa-bullseye', label: 'Target' },
                { id: 'brankas', icon: 'fa-vault', label: 'Brankas' },
                { id: 'pengaturan', icon: 'fa-cog', label: 'Pengaturan' },
            ];

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Desktop Sidebar */}
                    <div className="hidden md:flex flex-col w-64 bg-white dark:bg-darkCard border-r border-gray-200 dark:border-gray-800 shadow-xl z-20">
                        <div className="p-6 flex items-center justify-center gap-3 border-b border-gray-100 dark:border-gray-800">
                            <img src="https://iili.io/C9EsjQS.png" className="w-10 h-10" alt="logo"/>
                            <span className="font-black text-xl text-transparent bg-clip-text bg-gradient-to-r from-brandGreen to-teal-400">Family Money</span>
                        </div>
                        <div className="flex-1 p-4 flex flex-col gap-2">
                            {tabs.map(t => (
                                <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex items-center gap-4 px-4 py-3 rounded-xl font-medium transition ${activeTab === t.id ? 'bg-brandGreen text-white shadow-lg' : 'text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800'}`}>
                                    <i className={`fas ${t.icon} w-5`}></i> {t.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col h-full overflow-hidden relative">
                        {/* Header */}
                        <header className="px-4 py-3 md:px-8 md:py-4 bg-white/80 dark:bg-darkCard/80 backdrop-blur-md sticky top-0 z-10 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-full bg-gradient-to-br from-brandGreen to-teal-500 text-white flex items-center justify-center font-bold text-lg shadow-inner">
                                    {currentUser.username.charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <p className="text-xs text-gray-500 font-medium">Selamat Datang,</p>
                                    <h2 className="text-sm md:text-base font-bold capitalize">{currentUser.username}</h2>
                                </div>
                            </div>
                            <div className="flex items-center gap-2 md:gap-4">
                                <button onClick={toggleTheme} className="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-sm">
                                    <i className={`fas ${theme === 'dark' ? 'fa-sun text-yellow-400' : 'fa-moon text-gray-400'}`}></i>
                                </button>
                                <button onClick={onLogout} className="text-brandRed hover:bg-red-50 dark:hover:bg-red-900/20 p-2 rounded-lg text-sm font-semibold transition">
                                    <i className="fas fa-sign-out-alt md:mr-2"></i><span className="hidden md:inline">Keluar</span>
                                </button>
                            </div>
                        </header>

                        {/* Scrollable Content Area */}
                        <main className="flex-1 overflow-y-auto p-4 md:p-8 pb-24 md:pb-8">
                            {activeTab === 'beranda' && <UserBeranda stats={stats} userTx={userTx} currentUser={currentUser} saveDoc={saveDoc} />}
                            {activeTab === 'riwayat' && <UserRiwayat userTx={userTx} />}
                            {activeTab === 'target' && <UserTarget currentUser={currentUser} stats={stats} saveDoc={saveDoc} />}
                            {activeTab === 'brankas' && <UserBrankas stats={stats} userTx={userTx} saveDoc={saveDoc} />}
                            {activeTab === 'pengaturan' && <UserPengaturan currentUser={currentUser} saveDoc={saveDoc} userTx={userTx} deleteDoc={deleteDoc} />}
                        </main>
                    </div>

                    {/* Mobile Bottom Nav */}
                    <div className="md:hidden fixed bottom-0 left-0 w-full bg-white dark:bg-darkCard border-t border-gray-200 dark:border-gray-800 flex justify-around p-2 pb-safe z-30 shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
                        {tabs.map(t => (
                            <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex flex-col items-center p-2 rounded-xl transition ${activeTab === t.id ? 'text-brandGreen' : 'text-gray-400'}`}>
                                <i className={`fas ${t.icon} text-lg mb-1`}></i>
                                <span className="text-[10px] font-medium">{t.label}</span>
                            </button>
                        ))}
                    </div>
                </div>
            );
        }

        // --- Beranda ---
        function UserBeranda({ stats, userTx, currentUser, saveDoc }) {
            const [showModal, setShowModal] = useState(false);
            const [txType, setTxType] = useState('income');

            // Hitung pemasukan & pengeluaran khusus bulan ini secara dinamis
            const monthlyStats = useMemo(() => {
                const now = new Date();
                const currentYear = now.getFullYear();
                const currentMonth = now.getMonth(); // 0-11
                
                let income = 0;
                let expense = 0;
                
                userTx.forEach(tx => {
                    if (!tx.date) return;
                    const parts = tx.date.split('-');
                    if (parts.length === 3) {
                        const year = parseInt(parts[0], 10);
                        const month = parseInt(parts[1], 10) - 1; // 0-based
                        if (year === currentYear && month === currentMonth) {
                            const amt = Number(tx.amount);
                            if (tx.type === 'income') {
                                income += amt;
                            } else {
                                expense += amt;
                            }
                        }
                    }
                });
                return { income, expense };
            }, [userTx]);

            // Deteksi Pintar AI Financial Coach: Pengeluaran bulan ini > 80% dari pemasukan bulan ini
            const isAlert = monthlyStats.income > 0 && monthlyStats.expense > (0.8 * monthlyStats.income);

            // Warna saldo dinamis (Hijau jika positif, Glow merah jika negatif)
            const balanceColor = stats.balance >= 0 
                ? 'text-brandGreen' 
                : 'text-brandRed drop-shadow-[0_0_12px_rgba(239,68,68,0.9)]';

            const cardBorderClass = stats.balance >= 0 
                ? 'border-gray-100 dark:border-gray-800' 
                : 'border-brandRed/50 shadow-[0_0_20px_rgba(239,68,68,0.25)]';

            const recentTx = useMemo(() => [...userTx].sort((a,b) => b.timestamp - a.timestamp).slice(0,5), [userTx]);
            
            // Progress tracker logic
            const targetPrice = Number(currentUser.targetPrice) || 1;
            const progress = Math.min(100, Math.max(0, (stats.tabungan / targetPrice) * 100));
            const sisaDanaKekurangan = Math.max(0, targetPrice - stats.tabungan);

            return (
                <div className="space-y-6 animate-fade-in max-w-4xl mx-auto">
                    {/* Balance Card Dinamis (Glow jika negatif, Getar/Shake jika Alert AI aktif) */}
                    <div className={`relative bg-white dark:bg-darkCard rounded-3xl p-6 md:p-8 shadow-xl overflow-hidden border transition-all duration-300 ${cardBorderClass} ${isAlert ? 'animate-shake' : ''}`}>
                        <div className="absolute top-0 right-0 w-32 h-32 bg-brandGreen/10 rounded-full blur-3xl -mr-10 -mt-10"></div>
                        <p className="text-gray-500 text-xs md:text-base font-semibold mb-1">Total Saldo Aktif</p>
                        <h1 className={`text-3xl md:text-5xl font-black mb-1 transition-all ${balanceColor} tracking-tight`}>{formatRp(stats.balance)}</h1>
                        
                        {/* Garis Pembatas */}
                        <div className="border-t border-gray-200 dark:border-gray-800 my-4"></div>
                        
                        <div className="flex justify-between items-end">
                            <div>
                                <p className="text-[10px] md:text-xs text-gray-500 mb-1"><i className="fas fa-arrow-down mr-1"></i>Pemasukan</p>
                                <p className="text-xs md:text-lg font-bold text-brandGreen">{formatRp(stats.income)}</p>
                            </div>
                            <div className="text-right">
                                <p className="text-[10px] md:text-xs text-gray-500 mb-1"><i className="fas fa-arrow-up mr-1"></i>Pengeluaran</p>
                                <p className="text-xs md:text-lg font-bold text-brandRed">{formatRp(stats.expense)}</p>
                            </div>
                        </div>
                    </div>

                    {/* AI Financial Coach (Deteksi Pintar) */}
                    <div className={`p-4 rounded-xl flex items-start gap-3 border transition-all duration-300 ${isAlert ? 'bg-red-100 dark:bg-red-950/30 border-brandRed/40 text-brandRed animate-shake' : 'bg-green-100 dark:bg-emerald-950/20 border-brandGreen/30 text-brandGreen'}`}>
                        <i className={`fas fa-robot text-xl mt-1 shrink-0 ${isAlert ? 'text-brandRed' : 'text-brandGreen'}`}></i>
                        <div>
                            <h4 className="font-bold text-sm uppercase tracking-wide mb-1">AI Financial Coach</h4>
                            {isAlert ? (
                                <p className="text-xs text-red-700 dark:text-red-300 leading-relaxed">
                                    <span className="font-extrabold block mb-1">⚠️ Peringatan Overlimit Pengeluaran!</span>
                                    Pengeluaran bulan ini sudah melebihi <span className="font-bold">80% dari pemasukan</span> bulan ini. Jika terus begini, pencapaian target impianmu <span className="underline font-bold">"{currentUser.targetName}"</span> akan tertunda lebih lama! Pikirkan kembali sebelum membeli barang non-esensial, ingat masa depan finansial keluargamu lebih utama.
                                </p>
                            ) : (
                                <p className="text-xs text-green-700 dark:text-emerald-300 leading-relaxed">
                                    <span className="font-bold block mb-1">🟢 Kondisi Keuangan Sehat!</span>
                                    Hebat! Pengeluaran bulan ini masih terjaga dengan aman di bawah batas 80% pemasukan. Pertahankan disiplin keuangan ini agar target impianmu <span className="underline font-bold">"{currentUser.targetName}"</span> dapat segera terwujud sesuai rencana!
                                </p>
                            )}
                        </div>
                    </div>

                    {/* Target Tracker (Progress bar dengan Sisa Dana) */}
                    <div className="bg-white dark:bg-darkCard rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-gray-800">
                        <div className="flex justify-between items-center mb-2">
                            <p className="text-xs font-bold text-gray-500 uppercase">Target: {currentUser.targetName}</p>
                            <p className="text-xs font-bold text-brandGreen">{progress.toFixed(1)}%</p>
                        </div>
                        <div className="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5 overflow-hidden mb-2">
                            <div className="bg-gradient-to-r from-brandGreen to-teal-400 h-2.5 rounded-full transition-all duration-500" style={{ width: `${progress}%` }}></div>
                        </div>
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center text-[10px] md:text-xs text-gray-400 gap-1 sm:gap-0 border-t border-gray-100 dark:border-gray-800/50 pt-2 mt-2">
                            <span>Terkumpul: <strong className="text-gray-700 dark:text-gray-200">{formatRp(stats.tabungan)}</strong> dari <strong className="text-gray-700 dark:text-gray-200">{formatRp(currentUser.targetPrice)}</strong></span>
                            <span className="font-bold text-brandRed bg-red-100 dark:bg-red-950/40 px-2 py-0.5 rounded-md">Sisa dana dibutuhkan: {formatRp(sisaDanaKekurangan)}</span>
                        </div>
                    </div>

                    {/* Actions */}
                    <div className="grid grid-cols-2 gap-3 md:gap-4">
                        <button onClick={() => {setTxType('income'); setShowModal(true)}} className="bg-brandGreen text-white py-2.5 md:py-3 rounded-xl md:rounded-2xl font-bold shadow-lg shadow-brandGreen/20 hover:bg-emerald-600 active:scale-95 transition flex items-center justify-center gap-2 text-xs md:text-base">
                            <i className="fas fa-plus-circle"></i> Pemasukan
                        </button>
                        <button onClick={() => {setTxType('expense'); setShowModal(true)}} className="bg-brandRed text-white py-2.5 md:py-3 rounded-xl md:rounded-2xl font-bold shadow-lg shadow-brandRed/20 hover:bg-red-600 active:scale-95 transition flex items-center justify-center gap-2 text-xs md:text-base">
                            <i className="fas fa-minus-circle"></i> Pengeluaran
                        </button>
                    </div>

                    {/* Recent History */}
                    <div>
                        <h3 className="text-sm font-bold text-gray-500 uppercase mb-3 px-1">Transaksi Terakhir</h3>
                        <div className="space-y-2">
                            {recentTx.length === 0 ? <p className="text-center text-gray-400 text-sm py-4">Belum ada transaksi</p> : 
                            recentTx.map(tx => (
                                <div key={tx.id} className="bg-white dark:bg-darkCard p-3 md:p-4 rounded-xl flex items-center justify-between shadow-sm border border-gray-100 dark:border-gray-800">
                                    <div className="flex items-center gap-3">
                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center ${tx.type === 'income' ? 'bg-green-100 text-brandGreen' : 'bg-red-100 text-brandRed'}`}>
                                            <i className={`fas ${tx.category === 'Tabungan' ? 'fa-piggy-bank' : tx.category === 'Pinjaman' ? 'fa-hand-holding-usd' : 'fa-wallet'}`}></i>
                                        </div>
                                        <div>
                                            <p className="font-bold text-sm md:text-base capitalize leading-tight">{tx.name}</p>
                                            <p className="text-[10px] md:text-xs text-gray-400">{tx.date} • {tx.category}</p>
                                        </div>
                                    </div>
                                    <p className={`font-bold text-sm md:text-base ${tx.type === 'income' ? 'text-brandGreen' : 'text-brandRed'}`}>
                                        {tx.type === 'income' ? '+' : '-'}{formatRp(tx.amount)}
                                    </p>
                                </div>
                            ))}
                        </div>
                    </div>

                    {showModal && <TransactionModal type={txType} onClose={() => setShowModal(false)} currentUser={currentUser} saveDoc={saveDoc} />}
                </div>
            );
        }

        function TransactionModal({ type, onClose, currentUser, saveDoc }) {
            const [amount, setAmount] = useState('');
            const [name, setName] = useState('');
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [category, setCategory] = useState('Umum');
            
            // Format input as Rupiah automatically
            const handleAmountChange = (e) => {
                const val = e.target.value.replace(/\D/g, '');
                setAmount(val);
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if(!amount || !name) return;
                
                const tx = {
                    id: generateId(),
                    userId: currentUser.id,
                    type,
                    category,
                    name,
                    amount: Number(amount),
                    date,
                    timestamp: Date.now(),
                    hiddenInLoan: false
                };
                
                await saveDoc('transactions', tx.id, tx);
                onClose();
            };

            return (
                <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center p-0 md:p-4 bg-black/60 backdrop-blur-sm">
                    <div className={`bg-white dark:bg-darkCard w-full md:max-w-md rounded-t-3xl md:rounded-3xl p-6 shadow-2xl animate-fade-in border-t-4 ${type === 'income' ? 'border-brandGreen' : 'border-brandRed'}`}>
                        <div className="flex justify-between items-center mb-6">
                            <h2 className={`text-lg md:text-xl font-bold ${type === 'income' ? 'text-brandGreen' : 'text-brandRed'}`}>
                                Input {type === 'income' ? 'Pemasukan' : 'Pengeluaran'}
                            </h2>
                            <button onClick={onClose} className="text-gray-400 hover:text-gray-800"><i className="fas fa-times text-lg md:text-xl"></i></button>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="text-[10px] md:text-xs text-gray-500 font-bold uppercase block mb-1">Nominal (Rp)</label>
                                <input type="text" inputMode="numeric" value={amount ? formatRp(amount).replace('Rp', '').trim() : ''} onChange={handleAmountChange} className="w-full p-3 md:p-4 rounded-xl bg-gray-100 dark:bg-gray-800 text-xl md:text-2xl font-bold text-right outline-none focus:ring-2 focus:ring-brandGreen" placeholder="0" required />
                            </div>
                            <div>
                                <label className="text-[10px] md:text-xs text-gray-500 font-bold uppercase block mb-1">Nama Transaksi</label>
                                <input type="text" value={name} onChange={e=>setName(e.target.value)} className="w-full p-2.5 md:p-3 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none text-xs md:text-sm" placeholder="Misal: Gaji, Makan, dll" required />
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="text-[10px] md:text-xs text-gray-500 font-bold uppercase block mb-1">Tanggal</label>
                                    <input type="date" value={date} onChange={e=>setDate(e.target.value)} className="w-full p-2.5 md:p-3 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none text-xs md:text-sm" required />
                                </div>
                                <div>
                                    <label className="text-[10px] md:text-xs text-gray-500 font-bold uppercase block mb-1">Kategori</label>
                                    <select value={category} onChange={e=>setCategory(e.target.value)} className="w-full p-2.5 md:p-3 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none text-xs md:text-sm appearance-none">
                                        <option>Umum</option>
                                        <option>Tabungan</option>
                                        <option>Pinjaman</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit" className={`w-full py-3 md:py-4 mt-2 rounded-xl text-white font-bold text-sm md:text-lg shadow-lg transition ${type === 'income' ? 'bg-brandGreen hover:bg-emerald-600' : 'bg-brandRed hover:bg-red-600'}`}>
                                Simpan Data
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // --- Riwayat ---
        function UserRiwayat({ userTx }) {
            const [filterTab, setFilterTab] = useState('semua');
            const [searchDate, setSearchDate] = useState('');
            const [searchName, setSearchName] = useState('');

            const filteredTx = useMemo(() => {
                let res = [...userTx].sort((a,b) => b.timestamp - a.timestamp);
                if(filterTab === 'pemasukan') res = res.filter(t => t.type === 'income');
                if(filterTab === 'pengeluaran') res = res.filter(t => t.type === 'expense');
                if(searchDate) res = res.filter(t => t.date === searchDate);
                if(searchName) res = res.filter(t => t.name.toLowerCase().includes(searchName.toLowerCase()));
                return res;
            }, [userTx, filterTab, searchDate, searchName]);

            const totalAmount = useMemo(() => filteredTx.reduce((acc, curr) => acc + (curr.type === 'income' ? curr.amount : -curr.amount), 0), [filteredTx]);

            // Download PDF dengan tambahan Kolom Saldo Berjalan & Jumlah Total di baris akhir (Table Footer)
            const downloadPDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                // Urutkan transaksi secara kronologis (dari terlama ke terbaru) untuk menghitung saldo berjalan dengan benar
                const chronological = [...filteredTx].reverse();
                let runningBalance = 0;
                const balanceMap = {};
                
                chronological.forEach(t => {
                    if (t.type === 'income') {
                        runningBalance += t.amount;
                    } else {
                        runningBalance -= t.amount;
                    }
                    balanceMap[t.id] = runningBalance;
                });

                doc.setFont("helvetica", "bold");
                doc.text("Laporan Riwayat Transaksi - Family Money", 14, 15);
                
                // Menyusun baris data untuk PDF (menambahkan nilai saldo berjalan)
                const tableData = filteredTx.map((t, i) => [
                    i+1, 
                    t.date, 
                    t.name, 
                    t.type === 'income' ? formatRp(t.amount) : '-', 
                    t.type === 'expense' ? formatRp(t.amount) : '-',
                    formatRp(balanceMap[t.id])
                ]);
                
                doc.autoTable({
                    startY: 20,
                    head: [['No', 'Tanggal', 'Nama', 'Pemasukan', 'Pengeluaran', 'Saldo']],
                    body: tableData,
                    // Penambahan Jumlah Total pada Baris Kaki (Footer) PDF
                    foot: [['', 'Jumlah Total', '', '', '', formatRp(totalAmount)]],
                    theme: 'striped',
                    headStyles: { fillColor: [16, 185, 129] }, // Brand Green
                    footStyles: { fillColor: [243, 244, 246], textColor: [17, 24, 39], fontStyle: 'bold' } // Gray footer styling
                });
                
                doc.save(`Riwayat_Family_Money_${new Date().getTime()}.pdf`);
            };

            return (
                <div className="space-y-4 animate-fade-in max-w-4xl mx-auto">
                    <div className="flex gap-2 items-center justify-between">
                        {/* Tabs Filter Riwayat dengan Pewarnaan Dinamis Menyesuaikan */}
                        <div className="flex bg-gray-200 dark:bg-gray-800 p-1 rounded-xl flex-1 max-w-xs md:max-w-md">
                            {['semua', 'pemasukan', 'pengeluaran'].map(tab => {
                                const isActive = filterTab === tab;
                                let themeClass = "text-gray-500 hover:text-gray-700 dark:hover:text-gray-300";
                                if (isActive) {
                                    if (tab === 'semua') themeClass = "bg-white dark:bg-gray-700 text-blue-500 dark:text-blue-400 shadow";
                                    else if (tab === 'pemasukan') themeClass = "bg-white dark:bg-gray-700 text-brandGreen shadow";
                                    else if (tab === 'pengeluaran') themeClass = "bg-white dark:bg-gray-700 text-brandRed shadow";
                                }
                                return (
                                    <button key={tab} onClick={() => setFilterTab(tab)} className={`flex-1 md:px-6 py-2 rounded-lg text-xs font-bold capitalize transition-all duration-200 ${themeClass}`}>
                                        {tab}
                                    </button>
                                );
                            })}
                        </div>
                        {/* Tombol PDF Berwarna Merah Kustom Responsif: Ikon saja di Mobile, Teks di Desktop */}
                        <button onClick={downloadPDF} className="bg-brandRed hover:bg-red-600 text-white w-10 h-10 md:w-auto md:px-5 md:py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2 shadow-md hover:scale-[1.02] active:scale-95 transition-all shrink-0">
                            <i className="fas fa-file-pdf text-base"></i> 
                            <span className="hidden md:inline">Download PDF</span>
                        </button>
                    </div>

                    <div className="flex gap-2">
                        <input type="date" value={searchDate} onChange={e=>setSearchDate(e.target.value)} className="p-2 md:p-3 rounded-xl bg-white dark:bg-darkCard border border-gray-200 dark:border-gray-800 text-xs md:text-sm outline-none w-1/3" />
                        <input type="text" placeholder="Cari nama..." value={searchName} onChange={e=>setSearchName(e.target.value)} className="p-2 md:p-3 rounded-xl bg-white dark:bg-darkCard border border-gray-200 dark:border-gray-800 text-xs md:text-sm outline-none flex-1" />
                    </div>

                    <div className="bg-white dark:bg-darkCard rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 overflow-hidden">
                        <div className="max-h-[60vh] overflow-y-auto">
                            {filteredTx.length === 0 ? <p className="text-center p-8 text-gray-400">Tidak ada data</p> : 
                                <ul className="divide-y divide-gray-100 dark:divide-gray-800">
                                    {filteredTx.map(tx => (
                                        <li key={tx.id} className="p-3 md:p-4 flex items-center justify-between hover:bg-gray-50 dark:hover:bg-gray-800/50 transition">
                                            <div className="flex items-center gap-3">
                                                <i className={`fas ${tx.type==='income' ? 'fa-arrow-down text-brandGreen bg-green-100' : 'fa-arrow-up text-brandRed bg-red-100'} w-8 h-8 rounded-full flex items-center justify-center text-xs`}></i>
                                                <div>
                                                    <p className="font-bold text-sm md:text-base">{tx.name}</p>
                                                    <p className="text-[10px] md:text-xs text-gray-400">{tx.date} • {tx.category}</p>
                                                </div>
                                            </div>
                                            <p className={`font-bold text-sm md:text-base ${tx.type === 'income' ? 'text-brandGreen' : 'text-brandRed'}`}>
                                                {formatRp(tx.amount)}
                                            </p>
                                        </li>
                                    ))}
                                </ul>
                            }
                        </div>
                        <div className="bg-gray-50 dark:bg-gray-900 p-4 border-t border-gray-200 dark:border-gray-800 flex justify-between items-center">
                            <span className="font-bold text-gray-500">Jumlah Total:</span>
                            <span className={`font-black text-lg ${totalAmount >= 0 ? 'text-brandGreen' : 'text-brandRed'}`}>{formatRp(totalAmount)}</span>
                        </div>
                    </div>
                </div>
            );
        }

        // --- Target ---
        function UserTarget({ currentUser, stats, saveDoc }) {
            const [isEditing, setIsEditing] = useState(false);
            const [name, setName] = useState(currentUser.targetName);
            const [price, setPrice] = useState(currentUser.targetPrice);

            const handleEditClick = () => {
                setName(currentUser.targetName);
                setPrice(currentUser.targetPrice);
                setIsEditing(true);
            };

            const handlePriceChange = (e) => {
                const val = e.target.value.replace(/\D/g, '');
                setPrice(val);
            };

            const handleSave = async () => {
                await saveDoc('users', currentUser.id, { targetName: name, targetPrice: Number(price) });
                setIsEditing(false);
            };

            const targetVal = Number(currentUser.targetPrice) || 1;
            const tabungan = stats.tabungan;
            const kurang = Math.max(0, targetVal - tabungan);
            const percent = Math.min(100, Math.max(0, (tabungan / targetVal) * 100));

            const radius = 60;
            const circumference = 2 * Math.PI * radius;
            const strokeDashoffset = circumference - (percent / 100) * circumference;

            return (
                <div className="animate-fade-in max-w-md mx-auto space-y-6 pt-4">
                    <div className="bg-white dark:bg-darkCard rounded-3xl p-8 shadow-xl text-center border border-gray-100 dark:border-gray-800 relative overflow-hidden">
                        <div className="absolute -top-10 -right-10 w-32 h-32 bg-blue-500/10 rounded-full blur-3xl"></div>
                        <h2 className="text-xl font-black mb-6">Target Impian</h2>
                        
                        {/* Circular Progress */}
                        <div className="relative w-40 h-40 mx-auto mb-6">
                            <svg className="w-full h-full transform -rotate-90" viewBox="0 0 140 140">
                                <circle cx="70" cy="70" r={radius} className="stroke-gray-200 dark:stroke-gray-700" strokeWidth="12" fill="none" />
                                <circle cx="70" cy="70" r={radius} className="stroke-brandGreen transition-all duration-1000 ease-out" strokeWidth="12" fill="none" strokeDasharray={circumference} strokeDashoffset={strokeDashoffset} strokeLinecap="round" />
                            </svg>
                            <div className="absolute inset-0 flex flex-col items-center justify-center">
                                <span className="text-3xl font-black text-brandGreen">{percent.toFixed(0)}%</span>
                            </div>
                        </div>

                        {isEditing ? (
                            <div className="space-y-3 mb-4 text-left">
                                <input type="text" value={name} onChange={e=>setName(e.target.value)} className="w-full p-2 rounded-lg bg-gray-100 dark:bg-gray-800 text-sm outline-none" placeholder="Nama Target" />
                                <input type="text" inputMode="numeric" value={price ? formatRp(price).replace('Rp', '').trim() : ''} onChange={handlePriceChange} className="w-full p-2 rounded-lg bg-gray-100 dark:bg-gray-800 text-sm outline-none" placeholder="Harga Target" />
                                <button onClick={handleSave} className="w-full bg-brandGreen text-white py-2 rounded-lg font-bold text-sm">Simpan</button>
                            </div>
                        ) : (
                            <div className="mb-4">
                                <h3 className="text-2xl font-bold uppercase tracking-wider">{currentUser.targetName}</h3>
                                <p className="text-gray-500 font-medium">{formatRp(currentUser.targetPrice)}</p>
                            </div>
                        )}

                        <div className="bg-gray-50 dark:bg-gray-900 rounded-xl p-4 grid grid-cols-2 gap-4 text-left">
                            <div>
                                <p className="text-[10px] text-gray-500 uppercase font-bold">Terkumpul (Tabungan)</p>
                                <p className="text-sm font-bold text-brandGreen">{formatRp(tabungan)}</p>
                            </div>
                            <div>
                                <p className="text-[10px] text-gray-500 uppercase font-bold">Kekurangan</p>
                                <p className="text-sm font-bold text-brandRed">{formatRp(kurang)}</p>
                            </div>
                        </div>

                        {!isEditing && (
                            <button onClick={handleEditClick} className="mt-4 text-xs text-blue-500 underline"><i className="fas fa-edit"></i> Edit Target</button>
                        )}
                    </div>
                </div>
            );
        }

        // --- Brankas ---
        function UserBrankas({ stats, userTx, saveDoc }) {
            const [tab, setTab] = useState('tabungan'); // tabungan, pinjaman
            const [deleteTxConfirm, setDeleteTxConfirm] = useState(null); // Modal Konfirmasi Pinjaman
            
            const listData = useMemo(() => {
                let raw = userTx.filter(t => t.category.toLowerCase() === tab);
                // For pinjaman, hide deleted items from UI
                if(tab === 'pinjaman') raw = raw.filter(t => !t.hiddenInLoan);
                return raw.sort((a,b) => b.timestamp - a.timestamp);
            }, [userTx, tab]);

            const handleDeletePinjaman = async () => {
                if (!deleteTxConfirm) return;
                await saveDoc('transactions', deleteTxConfirm.id, { hiddenInLoan: true });
                setDeleteTxConfirm(null);
            };

            const isTabungan = tab === 'tabungan';
            const themeColor = isTabungan ? 'brandGreen' : 'brandYellow';
            const themeBg = isTabungan ? 'bg-brandGreen' : 'bg-brandYellow';
            const themeText = isTabungan ? 'text-brandGreen' : 'text-brandYellow';
            
            return (
                <div className="animate-fade-in max-w-4xl mx-auto space-y-6">
                    {/* Tabs */}
                    <div className="flex bg-gray-200 dark:bg-gray-800 p-1 rounded-2xl w-full max-w-sm mx-auto">
                        <button onClick={() => setTab('tabungan')} className={`flex-1 py-3 rounded-xl text-sm font-bold transition ${isTabungan ? 'bg-white dark:bg-gray-600 shadow text-brandGreen' : 'text-gray-500'}`}>Tabungan</button>
                        <button onClick={() => setTab('pinjaman')} className={`flex-1 py-3 rounded-xl text-sm font-bold transition ${!isTabungan ? 'bg-white dark:bg-gray-600 shadow text-brandYellow' : 'text-gray-500'}`}>Pinjaman</button>
                    </div>

                    {/* Summary Card */}
                    <div className={`relative ${isTabungan ? 'bg-emerald-900' : 'bg-yellow-900'} rounded-3xl p-6 md:p-8 shadow-xl overflow-hidden text-white`}>
                        <i className={`fas ${isTabungan ? 'fa-piggy-bank' : 'fa-hand-holding-usd'} absolute -right-4 -bottom-4 text-9xl opacity-20`}></i>
                        <p className="text-xs md:text-sm font-medium opacity-80 mb-1">Sisa Saldo {isTabungan ? 'Tabungan' : 'Pinjaman'}</p>
                        <h1 className="text-3xl md:text-5xl font-black mb-2">{formatRp(isTabungan ? stats.tabungan : stats.pinjaman)}</h1>
                        <p className="text-[10px] md:text-xs opacity-70 italic">*Dihitung otomatis berdasarkan transaksi kategori {isTabungan ? 'Tabungan' : 'Pinjaman'} di Beranda.</p>
                    </div>

                    {/* History List */}
                    <div className="bg-white dark:bg-darkCard rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 overflow-hidden">
                        <div className="p-3 md:p-4 border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-900/50">
                            <h3 className="font-bold text-xs md:text-sm uppercase">Riwayat Permanen {isTabungan ? 'Tabungan' : 'Pinjaman'}</h3>
                        </div>
                        <div className="max-h-[60vh] overflow-y-auto p-2 md:p-4 space-y-2 bg-gray-50/30 dark:bg-darkBg/30">
                            {listData.length === 0 ? <p className="p-6 text-center text-gray-400 text-xs">Belum ada data riwayat.</p> : 
                            listData.map((tx, idx) => {
                                const isVaultIncome = isTabungan ? tx.type === 'expense' : tx.type === 'income';
                                return (
                                <div key={tx.id} className="bg-white dark:bg-darkCard p-3 md:p-4 rounded-xl border border-gray-100 dark:border-gray-800 shadow-sm flex items-center justify-between gap-2 hover:bg-gray-50 dark:hover:bg-gray-800/50 transition">
                                    <div className="flex items-center gap-3 overflow-hidden">
                                        <div className="w-6 h-6 md:w-8 md:h-8 shrink-0 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-[10px] md:text-xs font-bold text-gray-500">{idx+1}</div>
                                        <div className="min-w-0">
                                            <p className="font-bold text-xs md:text-sm truncate">{tx.name}</p>
                                            <p className="text-[10px] text-gray-400">{tx.date}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2 md:gap-4 shrink-0">
                                        <span className={`font-bold text-xs md:text-base ${isVaultIncome ? 'text-brandGreen' : 'text-brandRed'}`}>
                                            {isVaultIncome ? '+' : '-'}{formatRp(tx.amount)}
                                        </span>
                                        {!isTabungan && (
                                            <button onClick={() => setDeleteTxConfirm(tx)} className="w-7 h-7 md:w-8 md:h-8 rounded-full bg-red-100 text-brandRed hover:bg-red-200 transition flex items-center justify-center">
                                                <i className="fas fa-trash-alt text-[10px] md:text-xs"></i>
                                            </button>
                                        )}
                                    </div>
                                </div>
                                )
                            })}
                        </div>
                    </div>

                    {/* Modal Konfirmasi Sembunyikan Pinjaman */}
                    {deleteTxConfirm && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/65 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white dark:bg-darkCard w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-brandRed/20 text-center">
                                <div className="w-16 h-16 rounded-full bg-red-100 dark:bg-red-900/30 text-brandRed flex items-center justify-center text-2xl mx-auto mb-4">
                                    <i className="fas fa-eye-slash"></i>
                                </div>
                                <h3 className="text-lg font-bold mb-2">Sembunyikan Riwayat?</h3>
                                <p className="text-sm text-gray-500 mb-6">Yakin ingin menyembunyikan riwayat transaksi <span className="font-bold text-gray-800 dark:text-white">"{deleteTxConfirm.name}"</span>? Tindakan ini tidak mengubah nominal ringkasan saldo Anda.</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setDeleteTxConfirm(null)} className="flex-1 py-3 rounded-xl bg-gray-100 dark:bg-gray-800 font-bold text-sm hover:bg-gray-200 transition">Batal</button>
                                    <button onClick={handleDeletePinjaman} className="flex-1 py-3 rounded-xl bg-brandRed text-white font-bold text-sm hover:bg-red-600 transition">Sembunyikan</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- Pengaturan ---
        function UserPengaturan({ currentUser, saveDoc, userTx, deleteDoc }) {
            const [name, setName] = useState(currentUser.username);
            const [pass, setPass] = useState(currentUser.password);
            const [msg, setMsg] = useState('');
            const [showDeleteConfirm, setShowDeleteConfirm] = useState(false); // Modal Konfirmasi hapus riwayat

            const handleSave = async () => {
                await saveDoc('users', currentUser.id, { username: name, password: pass });
                setMsg('Profil berhasil diperbarui!');
                setTimeout(()=>setMsg(''), 3000);
            };

            const handleDeleteHistory = async () => {
                for(let tx of userTx) {
                    await deleteDoc('transactions', tx.id);
                }
                setMsg('Semua riwayat berhasil dihapus.');
                setShowDeleteConfirm(false);
                setTimeout(()=>setMsg(''), 3000);
            };

            return (
                <div className="animate-fade-in max-w-md mx-auto space-y-6 pt-4">
                    <h2 className="text-2xl font-black mb-4">Pengaturan Akun</h2>
                    
                    {msg && <div className="bg-green-100 text-green-700 p-3 rounded-xl text-sm font-bold text-center animate-fade-in">{msg}</div>}

                    <div className="bg-white dark:bg-darkCard p-6 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-800 space-y-4">
                        <div>
                            <label className="text-xs font-bold text-gray-500 uppercase block mb-1">Ubah Nama</label>
                            <input type="text" value={name} onChange={e=>setName(e.target.value)} className="w-full p-3 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none" />
                        </div>
                        <div>
                            <label className="text-xs font-bold text-gray-500 uppercase block mb-1">Ubah Password</label>
                            <input type="text" value={pass} onChange={e=>setPass(e.target.value)} className="w-full p-3 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none" />
                        </div>
                        <button onClick={handleSave} className="w-full py-3 bg-brandGreen text-white rounded-xl font-bold shadow-md hover:bg-emerald-600 transition">Simpan Perubahan</button>
                    </div>

                    <div className="bg-red-50 dark:bg-red-900/10 p-6 rounded-3xl border border-red-100 dark:border-red-900/30">
                        <h3 className="font-bold text-brandRed mb-2"><i className="fas fa-exclamation-triangle mr-2"></i>Zona Berbahaya</h3>
                        <p className="text-xs text-gray-500 mb-4">Menghapus semua riwayat akan mereset saldo Anda menjadi 0. Tindakan ini tidak dapat dibatalkan.</p>
                        <button onClick={() => setShowDeleteConfirm(true)} className="w-full py-3 bg-brandRed text-white rounded-xl font-bold shadow-md hover:bg-red-600 transition">Hapus Semua Riwayat</button>
                    </div>

                    {/* Modal Konfirmasi Hapus Semua Riwayat */}
                    {showDeleteConfirm && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/65 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white dark:bg-darkCard w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-brandRed/20 text-center">
                                <div className="w-16 h-16 rounded-full bg-red-100 dark:bg-red-900/30 text-brandRed flex items-center justify-center text-2xl mx-auto mb-4">
                                    <i className="fas fa-trash-alt"></i>
                                </div>
                                <h3 className="text-lg font-bold mb-2">Hapus Semua Riwayat?</h3>
                                <p className="text-sm text-gray-500 mb-6">Yakin ingin menghapus semua riwayat transaksi Anda? Data di Cloud akan hilang permanen dan saldo Anda di-reset ke Rp 0.</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowDeleteConfirm(false)} className="flex-1 py-3 rounded-xl bg-gray-100 dark:bg-gray-800 font-bold text-sm hover:bg-gray-200 transition">Batal</button>
                                    <button onClick={handleDeleteHistory} className="flex-1 py-3 rounded-xl bg-brandRed text-white font-bold text-sm hover:bg-red-600 transition">Hapus Semua</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // ADMIN LAYOUT & VIEWS
        // ==========================================
        function AdminLayout({ users, transactions, saveDoc, deleteDoc, onLogout, toggleTheme, theme }) {
            const [activeTab, setActiveTab] = useState('dashboard');
            
            const tabs = [
                { id: 'dashboard', icon: 'fa-chart-pie', label: 'Dashboard' },
                { id: 'datauser', icon: 'fa-users', label: 'Data User' },
                { id: 'brankas', icon: 'fa-vault', label: 'Brankas Global' },
                { id: 'pengaturan', icon: 'fa-cog', label: 'Pengaturan' },
            ];

            return (
                <div className="flex h-screen overflow-hidden bg-gray-100 dark:bg-[#0a0a0a]">
                    {/* Desktop Sidebar Admin */}
                    <div className="hidden md:flex flex-col w-64 bg-white dark:bg-darkCard border-r border-gray-200 dark:border-gray-800 shadow-xl z-20">
                        <div className="p-6 flex items-center justify-center gap-3 border-b border-gray-100 dark:border-gray-800">
                            <img src="https://iili.io/C9EsjQS.png" className="w-10 h-10 object-contain" alt="logo"/>
                            <span className="font-black text-xl text-transparent bg-clip-text bg-gradient-to-r from-brandGreen to-teal-400">Family Money</span>
                        </div>
                        <div className="flex-1 p-4 flex flex-col gap-2">
                            {tabs.map(t => (
                                <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex items-center gap-4 px-4 py-3 rounded-xl font-medium transition ${activeTab === t.id ? 'bg-brandRed text-white shadow-lg' : 'text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800'}`}>
                                    <i className={`fas ${t.icon} w-5`}></i> {t.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col h-full overflow-hidden relative">
                        {/* Admin Content Header */}
                        <header className="px-4 py-3 md:px-8 md:py-4 bg-white/80 dark:bg-darkCard/80 backdrop-blur-md sticky top-0 z-10 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-full bg-gradient-to-br from-brandRed to-orange-500 text-white flex items-center justify-center font-bold text-lg shadow-inner uppercase">
                                    a
                                </div>
                                <div>
                                    <p className="text-xs text-gray-500 font-medium">Selamat Datang,</p>
                                    <h2 className="text-sm md:text-base font-bold capitalize">arnnon</h2>
                                </div>
                            </div>
                            <div className="flex items-center gap-2 md:gap-4">
                                <button onClick={toggleTheme} className="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-sm">
                                    <i className={`fas ${theme === 'dark' ? 'fa-sun text-yellow-400' : 'fa-moon text-gray-400'}`}></i>
                                </button>
                                <button onClick={onLogout} className="text-brandRed hover:bg-red-50 dark:hover:bg-red-900/20 p-2 rounded-lg text-sm font-semibold transition">
                                    <i className="fas fa-sign-out-alt md:mr-2"></i><span className="hidden md:inline">Keluar</span>
                                </button>
                            </div>
                        </header>

                        <main className="flex-1 overflow-y-auto p-4 md:p-8 pb-24 md:pb-8">
                            {activeTab === 'dashboard' && <AdminDashboard users={users} transactions={transactions} />}
                            {activeTab === 'datauser' && <AdminDataUser users={users} saveDoc={saveDoc} deleteDoc={deleteDoc} transactions={transactions} />}
                            {activeTab === 'brankas' && <AdminBrankas transactions={transactions} users={users} />}
                            {activeTab === 'pengaturan' && <AdminPengaturan saveDoc={saveDoc} deleteDoc={deleteDoc} users={users} transactions={transactions} />}
                        </main>
                    </div>

                    <div className="md:hidden fixed bottom-0 left-0 w-full bg-white dark:bg-darkCard border-t border-brandRed/20 flex justify-around p-2 pb-safe z-30 shadow-[0_-10px_20px_rgba(0,0,0,0.2)]">
                        {tabs.map(t => (
                            <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex flex-col items-center p-2 rounded-xl transition ${activeTab === t.id ? 'text-brandRed' : 'text-gray-400'}`}>
                                <i className={`fas ${t.icon} text-lg mb-1`}></i>
                                <span className="text-[10px] font-bold uppercase">{t.label}</span>
                            </button>
                        ))}
                    </div>
                </div>
            );
        }

        // --- Admin Views ---
        function AdminDashboard({ users, transactions }) {
            const [filterDate, setFilterDate] = useState('');
            const [filterUser, setFilterUser] = useState('');

            const stats = useMemo(() => {
                let bal = 0, tab = 0, pin = 0;
                transactions.forEach(tx => {
                    const amt = Number(tx.amount);
                    if(tx.type === 'income') {
                        bal += amt;
                        if(tx.category === 'Tabungan') tab -= amt;
                        if(tx.category === 'Pinjaman') pin += amt;
                    } else {
                        bal -= amt;
                        if(tx.category === 'Tabungan') tab += amt;
                        if(tx.category === 'Pinjaman') pin -= amt;
                    }
                });
                return { users: users.length, bal, tab, pin };
            }, [transactions, users.length]);

            const listFiltered = useMemo(() => {
                let res = [...transactions].sort((a,b) => b.timestamp - a.timestamp);
                if(filterDate) res = res.filter(t => t.date === filterDate);
                if(filterUser) {
                    const term = filterUser.toLowerCase();
                    res = res.filter(t => {
                        const u = users.find(usr => usr.id === t.userId);
                        return u && u.username.toLowerCase().includes(term);
                    });
                }
                return res;
            }, [transactions, filterDate, filterUser, users]);

            const listTotal = useMemo(() => listFiltered.reduce((acc, curr) => acc + (curr.type==='income'?curr.amount:-curr.amount), 0), [listFiltered]);

            return (
                <div className="space-y-6 animate-fade-in max-w-6xl mx-auto">
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div className="bg-white dark:bg-darkCard p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800">
                            <p className="text-xs text-gray-500 font-bold uppercase mb-1">Total User</p>
                            <h3 className="text-2xl font-black text-blue-500">{stats.users}</h3>
                        </div>
                        <div className="bg-white dark:bg-darkCard p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800">
                            <p className="text-xs text-gray-500 font-bold uppercase mb-1">Saldo Global</p>
                            <h3 className={`text-xl font-black ${stats.bal >= 0 ? 'text-brandGreen' : 'text-brandRed'}`}>{formatRp(stats.bal)}</h3>
                        </div>
                        <div className="bg-white dark:bg-darkCard p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800">
                            <p className="text-xs text-gray-500 font-bold uppercase mb-1">Tabungan Global</p>
                            <h3 className="text-xl font-black text-brandGreen">{formatRp(stats.tab)}</h3>
                        </div>
                        <div className="bg-white dark:bg-darkCard p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800">
                            <p className="text-xs text-gray-500 font-bold uppercase mb-1">Pinjaman Global</p>
                            <h3 className="text-xl font-black text-brandYellow">{formatRp(stats.pin)}</h3>
                        </div>
                    </div>

                    <div className="bg-white dark:bg-darkCard rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 overflow-hidden">
                        <div className="p-3 md:p-4 border-b border-gray-100 dark:border-gray-800 flex flex-col md:flex-row justify-between md:items-center gap-3">
                            <h3 className="font-bold uppercase text-xs md:text-sm">Semua Transaksi</h3>
                            <div className="flex gap-2">
                                <input type="date" value={filterDate} onChange={e=>setFilterDate(e.target.value)} className="p-2 text-[10px] md:text-xs rounded-lg bg-gray-100 dark:bg-gray-800 outline-none w-full md:w-auto" />
                                <input type="text" placeholder="Cari nama user..." value={filterUser} onChange={e=>setFilterUser(e.target.value)} className="p-2 text-[10px] md:text-xs rounded-lg bg-gray-100 dark:bg-gray-800 outline-none w-full md:w-auto" />
                            </div>
                        </div>
                        <div className="max-h-[50vh] overflow-y-auto p-2 md:p-4 space-y-2 bg-gray-50/30 dark:bg-darkBg/30">
                            {listFiltered.length === 0 ? <p className="p-4 text-center text-gray-400 text-xs">Tidak ada transaksi</p> :
                            listFiltered.map(tx => {
                                const u = users.find(usr => usr.id === tx.userId);
                                return (
                                <div key={tx.id} className="bg-white dark:bg-darkCard p-3 rounded-xl border border-gray-100 dark:border-gray-800 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-2 md:gap-4 hover:bg-gray-50 dark:hover:bg-gray-800/30">
                                    <div className="flex items-start md:items-center gap-3 min-w-0">
