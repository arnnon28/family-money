<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Money</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        darkCard: '#1e1e1e',
                        brandGreen: '#10b981',
                        brandRed: '#ef4444',
                        brandYellow: '#f59e0b',
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'shake': 'shake 0.82s cubic-bezier(.36,.07,.19,.97) both',
                        'shake-infinite': 'shake 1s cubic-bezier(.36,.07,.19,.97) infinite',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'blink': 'blink 1.5s infinite'
                    },
                    keyframes: {
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        blink: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0' }
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- jsPDF & AutoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&display=swap');

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; transition: background-color 0.3s, color 0.3s; }
        .bg-glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .dark .bg-glass { background: rgba(30, 30, 30, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        .global-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            z-index: -1; opacity: 0.15; pointer-events: none;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-darkBg dark:text-gray-100 antialiased overflow-x-hidden selection:bg-brandGreen selection:text-white">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo } = React;

        const formatRp = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num || 0);
        const generateId = () => crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).substr(2);
        const quotes = ["Hemat pangkal kaya.", "Kelola uangmu, atau uang yang mengelolamu.", "Investasi terbaik adalah pada dirimu sendiri.", "Sedikit demi sedikit, lama-lama menjadi bukit."];

        // --- Ikon Gambar Vektor Premium (Reusable Inline SVGs) ---
        const UserImageIcon = () => (
            <svg className="w-5 h-5 drop-shadow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" fill="url(#userGrad)" />
                <path d="M12 11C13.6569 11 15 9.65685 15 8C15 6.34315 13.6569 5 12 5C10.3431 5 9 6.34315 9 8C9 9.65685 10.3431 11 12 11Z" fill="white"/>
                <path d="M12 13C9.33 13 4 14.33 4 17V19H20V17C20 14.33 14.67 13 12 13Z" fill="white"/>
                <defs>
                    <linearGradient id="userGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                        <stop stopColor="#3b82f6"/>
                        <stop offset="1" stopColor="#8b5cf6"/>
                    </linearGradient>
                </defs>
            </svg>
        );

        const PasswordImageIcon = () => (
            <svg className="w-5 h-5 drop-shadow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="24" height="24" rx="12" fill="url(#lockGrad)" />
                <path d="M12 11C11.1716 11 10.5 11.6716 10.5 12.5C10.5 13.1116 10.8654 13.6377 11.3875 13.8712L11 17H13L12.6125 13.8712C13.1346 13.6377 13.5 13.1116 13.5 12.5C13.5 11.6716 12.8284 11 12 11Z" fill="white"/>
                <path d="M17 10H16V8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8V10H7C6.45 10 6 10.45 6 11V18C6 18.55 6.45 19 7 19H17C17.55 19 18 18.55 18 18V11C18 10.45 17.55 10 17 10ZM10 8C10 6.9 10.9 6 12 6C13.1 6 14 6.9 14 8V10H10V8Z" fill="white" fillRule="evenodd" clipRule="evenodd"/>
                <defs>
                    <linearGradient id="lockGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                        <stop stopColor="#ef4444"/>
                        <stop offset="1" stopColor="#ec4899"/>
                    </linearGradient>
                </defs>
            </svg>
        );

        const TransactionNameImageIcon = () => (
            <svg className="w-5 h-5 drop-shadow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="24" height="24" rx="12" fill="url(#noteGrad)" />
                <path d="M16 12H8V14H16V12Z" fill="white"/>
                <path d="M16 8H8V10H16V8Z" fill="white"/>
                <path d="M6 18V6C6 4.9 6.9 4 8 4H16C17.1 4 18 4.9 18 6V18L12 15L6 18Z" fill="white" fillRule="evenodd" clipRule="evenodd"/>
                <defs>
                    <linearGradient id="noteGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                        <stop stopColor="#10b981"/>
                        <stop offset="1" stopColor="#059669"/>
                    </linearGradient>
                </defs>
            </svg>
        );

        const NominalImageIcon = () => (
            <svg className="w-5 h-5 drop-shadow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="24" height="24" rx="12" fill="url(#walletGrad)" />
                <path d="M19 10V14C19 14.55 18.55 15 18 15H17V17C17 17.55 16.55 18 16 18H7C6.45 18 6 17.55 6 17V7C6 6.45 6.45 6 7 6H16C16.55 6 17 6.45 17 7V9H18C18.55 9 19 9.45 19 10ZM15 14H8V16H15V14ZM15 8H8V10H15V8ZM18 11H16V13H18V11Z" fill="white" fillRule="evenodd" clipRule="evenodd"/>
                <defs>
                    <linearGradient id="walletGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                        <stop stopColor="#f59e0b"/>
                        <stop offset="1" stopColor="#d97706"/>
                    </linearGradient>
                </defs>
            </svg>
        );

        const TanggalImageIcon = () => (
            <svg className="w-5 h-5 drop-shadow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="24" height="24" rx="12" fill="url(#calGrad)" />
                <path d="M17 12H7V14H17V12ZM14 15H10V17H14V15ZM16 5V7H8V5H6V19H18V5H16ZM16 9H8V11H16V9Z" fill="white" fillRule="evenodd" clipRule="evenodd"/>
                <defs>
                    <linearGradient id="calGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                        <stop stopColor="#3b82f6"/>
                        <stop offset="1" stopColor="#1d4ed8"/>
                    </linearGradient>
                </defs>
            </svg>
        );

        const KategoriImageIcon = () => (
            <svg className="w-5 h-5 drop-shadow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="24" height="24" rx="12" fill="url(#catGrad)" />
                <path d="M12 7H17V9H12V7ZM12 11H17V13H12V11ZM12 15H17V17H12V15ZM7 7H9V9H7V7ZM7 11H9V13H7V11ZM7 15H9V17H7V15Z" fill="white" fillRule="evenodd" clipRule="evenodd"/>
                <defs>
                    <linearGradient id="catGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                        <stop stopColor="#8b5cf6"/>
                        <stop offset="1" stopColor="#6d28d9"/>
                    </linearGradient>
                </defs>
            </svg>
        );

        const SearchImageIcon = () => (
            <svg className="w-5 h-5 drop-shadow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="24" height="24" rx="12" fill="url(#searchGrad)" />
                <path d="M15.5 14H14.71L14.43 13.73C15.41 12.59 16 11.11 16 9.5C16 5.91 13.09 3 9.5 3C5.91 3 3 5.91 3 9.5C3 13.09 5.91 16 9.5 16C11.11 16 12.59 15.41 13.73 14.43L14 14.71V15.5L19 20.49L20.49 19L15.5 14ZM9.5 14C7.01 14 5 11.99 5 9.5C5 7.01 7.01 5 9.5 5C11.99 5 14 7.01 14 9.5C14 11.99 11.99 14 9.5 14Z" fill="white"/>
                <defs>
                    <linearGradient id="searchGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                        <stop stopColor="#4b5563"/>
                        <stop offset="1" stopColor="#1f2937"/>
                    </linearGradient>
                </defs>
            </svg>
        );

        const TargetNameImageIcon = () => (
            <svg className="w-5 h-5 drop-shadow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="24" height="24" rx="12" fill="url(#targetGrad)" />
                <circle cx="12" cy="12" r="5" stroke="white" strokeWidth="2" />
                <circle cx="12" cy="12" r="2" fill="white" />
                <path d="M12 2V5" stroke="white" strokeWidth="2" strokeLinecap="round"/>
                <path d="M12 19V22" stroke="white" strokeWidth="2" strokeLinecap="round"/>
                <path d="M2 12H5" stroke="white" strokeWidth="2" strokeLinecap="round"/>
                <path d="M19 12H22" stroke="white" strokeWidth="2" strokeLinecap="round"/>
                <defs>
                    <linearGradient id="targetGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                        <stop stopColor="#f59e0b"/>
                        <stop offset="1" stopColor="#ef4444"/>
                    </linearGradient>
                </defs>
            </svg>
        );

        // --- Main App Component ---
        function App() {
            // State: System
            const [fb, setFb] = useState(null);
            const [appState, setAppState] = useState('splash'); // splash, auth, user, admin
            const [theme, setTheme] = useState('dark');
            const [bgImage, setBgImage] = useState('');
            const [loadingStr, setLoadingStr] = useState('Memuat Sistem...');

            // State: Data
            const [users, setUsers] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [currentUser, setCurrentUser] = useState(null);

            // --- Initialize Firebase dynamically ---
            useEffect(() => {
                const initFirebase = async () => {
                    try {
                        const appModule = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js');
                        const authModule = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js');
                        const firestoreModule = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');

                        let config;
                        if (typeof __firebase_config !== 'undefined') {
                            config = JSON.parse(__firebase_config);
                        } else {
                            config = {
                                apiKey: "AIzaSyDthArIAK750A5QCZqhQHhkFqyex9thfAE",
                                authDomain: "family-money-39f70.firebaseapp.com",
                                projectId: "family-money-39f70",
                                storageBucket: "family-money-39f70.firebasestorage.app",
                                messagingSenderId: "599306599652",
                                appId: "1:599306599652:web:9177b4597708226ae2c0f1"
                            };
                        }

                        const app = appModule.initializeApp(config);
                        const auth = authModule.getAuth(app);
                        const db = firestoreModule.getFirestore(app);

                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await authModule.signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await authModule.signInAnonymously(auth);
                        }

                        setFb({ db, firestoreModule, authModule, auth });
                    } catch (error) {
                        console.error("Firebase Init Error:", error);
                        setLoadingStr('Gagal memuat database.');
                    }
                };
                initFirebase();
            }, []);

            // --- Theme Manager ---
            useEffect(() => {
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [theme]);

            const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

            // --- Data Listeners ---
            useEffect(() => {
                if (!fb?.db) return;
                const { collection, onSnapshot, doc } = fb.firestoreModule;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-money';
                
                const usersRef = collection(fb.db, 'artifacts', appId, 'public', 'data', 'users');
                const txRef = collection(fb.db, 'artifacts', appId, 'public', 'data', 'transactions');
                const settingsRef = doc(fb.db, 'artifacts', appId, 'public', 'data', 'settings', 'global');

                const unsubUsers = onSnapshot(usersRef, snap => {
                    setUsers(snap.docs.map(d => ({ docId: d.id, ...d.data() })));
                }, err => console.error(err));

                const unsubTx = onSnapshot(txRef, snap => {
                    setTransactions(snap.docs.map(d => ({ docId: d.id, ...d.data() })));
                }, err => console.error(err));

                const unsubSettings = onSnapshot(settingsRef, snap => {
                    if(snap.exists()) setBgImage(snap.data().bgImage || '');
                });

                return () => { unsubUsers(); unsubTx(); unsubSettings(); };
            }, [fb]);

            // --- Database Helpers ---
            const saveDoc = async (collectionName, id, data) => {
                if(!fb) return;
                const { doc, setDoc } = fb.firestoreModule;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-money';
                const ref = doc(fb.db, 'artifacts', appId, 'public', 'data', collectionName, id);
                await setDoc(ref, data, { merge: true });
            };

            const deleteDocRef = async (collectionName, id) => {
                if(!fb) return;
                const { doc, deleteDoc } = fb.firestoreModule;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-money';
                const ref = doc(fb.db, 'artifacts', appId, 'public', 'data', collectionName, id);
                await deleteDoc(ref);
            };

            // --- Render Logic ---
            if (!fb) {
                return <div className="min-h-screen flex items-center justify-center font-bold text-xl animate-pulse">{loadingStr}</div>;
            }

            return (
                <div className="min-h-screen relative">
                    {bgImage && <div className="global-bg" style={{ backgroundImage: `url(${bgImage})` }}></div>}
                    
                    {appState === 'splash' && <SplashScreen onLoginClick={() => setAppState('auth')} onAdminClick={() => setAppState('adminAuth')} toggleTheme={toggleTheme} theme={theme} />}
                    {appState === 'auth' && <AuthModal users={users} onLogin={u => { setCurrentUser(u); setAppState('user'); }} onBack={() => setAppState('splash')} saveDoc={saveDoc} />}
                    {appState === 'adminAuth' && <AdminAuthModal onLogin={() => setAppState('admin')} onBack={() => setAppState('splash')} />}
                    
                    {appState === 'user' && currentUser && <UserLayout currentUser={users.find(u => u.id === currentUser.id) || currentUser} users={users} transactions={transactions} saveDoc={saveDoc} deleteDoc={deleteDocRef} onLogout={() => { setCurrentUser(null); setAppState('splash'); }} toggleTheme={toggleTheme} theme={theme} />}
                    
                    {appState === 'admin' && <AdminLayout users={users} transactions={transactions} saveDoc={saveDoc} deleteDoc={deleteDocRef} onLogout={() => setAppState('splash')} toggleTheme={toggleTheme} theme={theme} />}
                </div>
            );
        }

        // ==========================================
        // UI COMPONENTS
        // ==========================================

        function SplashScreen({ onLoginClick, onAdminClick, toggleTheme, theme }) {
            const quote = useMemo(() => quotes[Math.floor(Math.random() * quotes.length)], []);

            return (
                <div className="flex flex-col items-center justify-center min-h-screen relative p-4">
                    <div className="absolute top-4 right-4 flex gap-3">
                        <button onClick={toggleTheme} className="w-10 h-10 rounded-full bg-glass flex items-center justify-center text-xl hover:scale-110 transition">
                            <i className={`fas ${theme === 'dark' ? 'fa-sun text-yellow-400' : 'fa-moon text-gray-700'}`}></i>
                        </button>
                        <button onClick={onAdminClick} className="w-10 h-10 rounded-full bg-glass flex items-center justify-center text-sm opacity-50 hover:opacity-100 transition">
                            <i className="fas fa-lock"></i>
                        </button>
                    </div>
                    
                    <img src="https://iili.io/C9EsjQS.png" alt="Logo" className="w-24 h-24 md:w-48 md:h-48 object-contain mb-4 md:mb-6 animate-pulse-slow drop-shadow-2xl" />
                    <h1 className="text-3xl md:text-5xl bg-clip-text text-transparent bg-gradient-to-r from-fuchsia-500 via-blue-500 to-white mb-2 text-center drop-shadow-sm" style={{ fontFamily: "'Poppins', sans-serif", fontWeight: 900, lineHeight: 1.2 }}>Family Money</h1>
                    <p className="text-[10px] md:text-base italic opacity-70 mb-8 md:mb-10 text-center max-w-xs">"{quote}"</p>
                    
                    <button onClick={onLoginClick} className="px-10 py-3 rounded-full bg-gradient-to-r from-fuchsia-500 to-blue-500 text-white font-bold shadow-lg shadow-blue-500/30 hover:scale-105 active:scale-95 transition-all text-sm md:text-lg">
                        Masuk
                    </button>
                </div>
            );
        }

        function AuthModal({ users, onLogin, onBack, saveDoc }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [showPass, setShowPass] = useState(false);
            const [error, setError] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                if(!username || !password) return setError('Isi semua kolom!');

                const user = users.find(u => u.username === username && u.password === password);
                if (user) onLogin(user);
                else setError('Username atau password salah!');
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in">
                    <div className="bg-white dark:bg-darkCard w-full max-w-md rounded-3xl p-6 shadow-2xl relative border-2 border-brandGreen dark:border-brandGreen/50">
                        <button onClick={onBack} className="absolute top-4 left-4 text-gray-500 hover:text-gray-800 dark:hover:text-white">
                            <i className="fas fa-arrow-left text-xl"></i>
                        </button>
                        <h2 className="text-2xl font-bold text-center mb-6">Login Akun</h2>
                        
                        {error && <div className="bg-red-100 text-red-600 p-3 rounded-xl text-sm mb-4 text-center animate-shake">{error}</div>}
                        
                        <form onSubmit={handleSubmit} className="flex flex-col gap-4">
                            <div>
                                <label className="text-xs font-semibold text-gray-500 uppercase">Username</label>
                                <div className="relative mt-1">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <UserImageIcon />
                                    </div>
                                    <input type="text" value={username} onChange={e=>setUsername(e.target.value)} className="w-full p-3 pl-10 rounded-xl bg-gray-100 dark:bg-gray-800 border-none focus:ring-2 focus:ring-brandGreen outline-none text-sm md:text-base" placeholder="Masukkan username" />
                                </div>
                            </div>
                            <div>
                                <label className="text-xs font-semibold text-gray-500 uppercase">Password</label>
                                <div className="relative mt-1">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <PasswordImageIcon />
                                    </div>
                                    <input type={showPass ? 'text' : 'password'} value={password} onChange={e=>setPassword(e.target.value)} className="w-full p-3 pl-10 pr-10 rounded-xl bg-gray-100 dark:bg-gray-800 border-none focus:ring-2 focus:ring-brandGreen outline-none text-sm md:text-base" placeholder="Masukkan password" />
                                    <button type="button" onClick={()=>setShowPass(!showPass)} className="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition">
                                        <i className={`fas ${showPass ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                    </button>
                                </div>
                            </div>
                            <button type="submit" className="w-full py-3 mt-2 rounded-xl bg-brandGreen text-white font-bold shadow-md hover:bg-emerald-600 transition">
                                Masuk
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        function AdminAuthModal({ onLogin, onBack }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [showPass, setShowPass] = useState(false);
            const [error, setError] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                if(username === 'arnnon' && password === 'andri123') onLogin();
                else setError('Akses Ditolak!');
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
                    <div className="bg-white dark:bg-darkCard w-full max-w-sm rounded-3xl p-6 shadow-2xl relative border-t-4 border-brandRed">
                         <button onClick={onBack} className="absolute top-4 left-4 text-gray-500 hover:text-gray-800 dark:hover:text-white transition"><i className="fas fa-times"></i></button>
                        <h2 className="text-xl font-bold text-center mb-6 text-brandRed"><i className="fas fa-shield-alt mr-2"></i>Login Admin</h2>
                        {error && <div className="bg-red-100 text-red-600 p-2 rounded text-sm mb-4 text-center animate-shake">{error}</div>}
                        <form onSubmit={handleLogin} className="flex flex-col gap-4">
                            <div className="relative">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <UserImageIcon />
                                </div>
                                <input type="text" value={username} onChange={e=>setUsername(e.target.value)} className="w-full p-3 pl-10 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none focus:ring-2 focus:ring-brandRed border-none text-sm md:text-base" placeholder="Admin Username" />
                            </div>
                            <div className="relative">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <PasswordImageIcon />
                                </div>
                                <input type={showPass ? 'text' : 'password'} value={password} onChange={e=>setPassword(e.target.value)} className="w-full p-3 pl-10 pr-10 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none focus:ring-2 focus:ring-brandRed border-none text-sm md:text-base" placeholder="Admin Password" />
                                <button type="button" onClick={()=>setShowPass(!showPass)} className="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition">
                                    <i className={`fas ${showPass ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                </button>
                            </div>
                            <button className="py-3 mt-2 rounded-xl bg-brandRed text-white font-bold shadow-md hover:bg-red-600 transition">Akses Sistem</button>
                        </form>
                    </div>
                </div>
            );
        }

        // ==========================================
        // USER LAYOUT & VIEWS
        // ==========================================
        function UserLayout({ currentUser, users, transactions, saveDoc, deleteDoc, onLogout, toggleTheme, theme }) {
            const [activeTab, setActiveTab] = useState('beranda');
            const [showGlobalModal, setShowGlobalModal] = useState(false);
            const [globalTxType, setGlobalTxType] = useState('income');
            
            const isReadOnly = currentUser.role === 'anggota';
            const activeUserId = isReadOnly ? currentUser.parentId : currentUser.id;
            const activeUserDoc = users.find(u => u.id === activeUserId) || currentUser;

            const userTx = useMemo(() => transactions.filter(t => t.userId === activeUserId), [transactions, activeUserId]);

            const stats = useMemo(() => {
                let balance = 0, income = 0, expense = 0, tabungan = 0, pinjaman = 0, nonTabunganExpense = 0;
                userTx.forEach(tx => {
                    const amt = Number(tx.amount);
                    if(tx.type === 'income') {
                        income += amt; balance += amt;
                        if(tx.category === 'Tabungan') tabungan -= amt;
                        if(tx.category === 'Pinjaman') pinjaman += amt;
                    } else {
                        expense += amt; balance -= amt;
                        if(tx.category === 'Tabungan') tabungan += amt;
                        else if(tx.category === 'Pinjaman') pinjaman -= amt;
                        else nonTabunganExpense += amt;
                    }
                });
                return { balance, income, expense, tabungan, pinjaman, nonTabunganExpense };
            }, [userTx]);

            const tabs = [
                { id: 'beranda', icon: 'fa-home', label: 'Beranda' },
                { id: 'riwayat', icon: 'fa-receipt', label: 'Riwayat' },
                { id: 'target', icon: 'fa-bullseye', label: 'Target' },
                { id: 'brankas', icon: 'fa-vault', label: isReadOnly ? 'Tabungan' : 'Brankas' },
            ];
            
            if (!isReadOnly) {
                tabs.push({ id: 'pengaturan', icon: 'fa-cog', label: 'Pengaturan' });
            }

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Desktop Sidebar */}
                    <div className="hidden md:flex flex-col w-64 bg-white dark:bg-darkCard border-r border-gray-200 dark:border-gray-800 shadow-xl z-20">
                        <div className="p-6 flex flex-col items-center justify-center gap-2 border-b border-gray-100 dark:border-gray-800">
                            <img src="https://iili.io/C9EsjQS.png" className="w-16 h-16 object-contain" alt="logo"/>
                            <span className="font-black text-xl text-center text-transparent bg-clip-text bg-gradient-to-r from-brandGreen to-teal-400">Family Money</span>
                        </div>
                        <div className="flex-1 p-4 flex flex-col gap-2">
                            {tabs.map(t => (
                                <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex items-center gap-4 px-4 py-3 rounded-xl font-medium transition ${activeTab === t.id ? 'bg-brandGreen text-white shadow-lg' : 'text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800'}`}>
                                    <i className={`fas ${t.icon} w-5`}></i> {t.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col h-full overflow-hidden relative">
                        {/* Header */}
                        <header className="px-4 py-3 md:px-8 md:py-4 bg-white/80 dark:bg-darkCard/80 backdrop-blur-md sticky top-0 z-10 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <img src="https://iili.io/C9EsjQS.png" alt="Logo" className="w-10 h-10 object-contain drop-shadow-md" />
                                <div>
                                    <p className="text-xs text-gray-500 font-medium">Selamat Datang,</p>
                                    <h2 className="text-sm md:text-base font-bold capitalize flex flex-wrap items-center gap-2">
                                        {currentUser.username}
                                        {isReadOnly && (
                                            <span className="text-[10px] bg-blue-100 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 px-2 py-0.5 rounded-md align-middle shadow-sm">
                                                <i className="fas fa-eye mr-1"></i>Memantau: {activeUserDoc.username}
                                            </span>
                                        )}
                                    </h2>
                                </div>
                            </div>
                            <div className="flex items-center gap-2 md:gap-4">
                                {!isReadOnly && (
                                    <>
                                        <button onClick={() => { setGlobalTxType('income'); setShowGlobalModal(true); }} className="w-8 h-8 rounded-full bg-green-100 dark:bg-green-900/30 flex items-center justify-center text-sm text-brandGreen hover:scale-110 transition shadow-sm shrink-0" title="Tambah Pemasukan">
                                            <i className="fas fa-plus"></i>
                                        </button>
                                        <button onClick={() => { setGlobalTxType('expense'); setShowGlobalModal(true); }} className="w-8 h-8 rounded-full bg-red-100 dark:bg-red-900/30 flex items-center justify-center text-sm text-brandRed hover:scale-110 transition shadow-sm shrink-0" title="Tambah Pengeluaran">
                                            <i className="fas fa-minus"></i>
                                        </button>
                                    </>
                                )}
                                <button onClick={toggleTheme} className="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-sm transition hover:scale-110 shrink-0">
                                    <i className={`fas ${theme === 'dark' ? 'fa-sun text-yellow-400' : 'fa-moon text-gray-400'}`}></i>
                                </button>
                                <button onClick={onLogout} className="text-brandRed hover:bg-red-50 dark:hover:bg-red-900/20 p-2 rounded-lg text-sm font-semibold transition shrink-0">
                                    <i className="fas fa-sign-out-alt md:mr-2"></i><span className="hidden md:inline">Keluar</span>
                                </button>
                            </div>
                        </header>

                        {/* Scrollable Content Area */}
                        <main className="flex-1 overflow-y-auto p-4 md:p-8 pb-24 md:pb-8">
                            {activeTab === 'beranda' && <UserBeranda stats={stats} userTx={userTx} userData={activeUserDoc} saveDoc={saveDoc} isReadOnly={isReadOnly} />}
                            {activeTab === 'riwayat' && <UserRiwayat userTx={userTx} deleteDoc={deleteDoc} saveDoc={saveDoc} userData={activeUserDoc} isReadOnly={isReadOnly} />}
                            {activeTab === 'target' && <UserTarget userData={activeUserDoc} stats={stats} saveDoc={saveDoc} isReadOnly={isReadOnly} />}
                            {activeTab === 'brankas' && <UserBrankas stats={stats} userTx={userTx} saveDoc={saveDoc} isReadOnly={isReadOnly} />}
                            {!isReadOnly && activeTab === 'pengaturan' && <UserPengaturan currentUser={currentUser} saveDoc={saveDoc} userTx={userTx} deleteDoc={deleteDoc} />}
                        </main>
                    </div>

                    {/* Mobile Bottom Nav */}
                    <div className="md:hidden fixed bottom-0 left-0 w-full bg-white dark:bg-darkCard border-t border-gray-200 dark:border-gray-800 flex justify-around p-2 pb-safe z-30 shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
                        {tabs.map(t => (
                            <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex flex-col items-center p-2 rounded-xl transition ${activeTab === t.id ? 'text-brandGreen' : 'text-gray-400'}`}>
                                <i className={`fas ${t.icon} text-lg mb-1`}></i>
                                <span className="text-[10px] font-medium">{t.label}</span>
                            </button>
                        ))}
                    </div>
                </div>
            );
        }

        // --- Beranda ---
        function UserBeranda({ stats, userTx, userData, saveDoc, isReadOnly }) {
            const [showModal, setShowModal] = useState(false);
            const [txType, setTxType] = useState('income');

            const monthlyStats = useMemo(() => {
                const now = new Date();
                const currentYear = now.getFullYear();
                const currentMonth = now.getMonth();
                
                let income = 0;
                let expense = 0;
                
                userTx.forEach(tx => {
                    if (!tx.date) return;
                    const parts = tx.date.split('-');
                    if (parts.length === 3) {
                        const year = parseInt(parts[0], 10);
                        const month = parseInt(parts[1], 10) - 1;
                        if (year === currentYear && month === currentMonth) {
                            const amt = Number(tx.amount);
                            if (tx.type === 'income') income += amt;
                            else expense += amt;
                        }
                    }
                });
                return { income, expense };
            }, [userTx]);

            const isAlert = monthlyStats.income > 0 && monthlyStats.expense > (0.8 * monthlyStats.income);

            const isPositive = stats.balance >= 0;
            const isNegative = stats.balance < 0;
            const cardStyleClass = isPositive 
                ? 'bg-black text-white border-brandGreen/40 shadow-[0_0_25px_rgba(16,185,129,0.35)]' 
                : 'bg-black text-white border-brandRed/60 shadow-[0_0_25px_rgba(239,68,68,0.7)]';

            const balanceNominalColor = 'text-yellow-300 drop-shadow-md';
            const labelColor = 'text-gray-400';
            const dividerColor = 'border-gray-800';

            const recentTx = useMemo(() => [...userTx].sort((a,b) => b.timestamp - a.timestamp).slice(0,5), [userTx]);
            
            const targetPrice = Number(userData.targetPrice) || 1;
            const progress = Math.min(100, Math.max(0, (stats.tabungan / targetPrice) * 100));

            return (
                <div className="space-y-6 animate-fade-in max-w-4xl mx-auto">
                    <div className={`relative rounded-3xl p-6 md:p-8 overflow-hidden border transition-all duration-300 ${cardStyleClass} ${isNegative ? 'animate-shake-infinite' : (isAlert ? 'animate-shake' : '')}`}>
                        <div className="absolute top-0 right-0 w-32 h-32 bg-white/5 rounded-full blur-3xl -mr-10 -mt-10"></div>
                        
                        <p className={`${labelColor} text-xs md:text-base font-semibold mb-1`}>Total Saldo Aktif</p>
                        <h1 className={`text-3xl md:text-5xl font-black mb-1 transition-all ${balanceNominalColor} tracking-tight`}>
                            {formatRp(stats.balance)}
                        </h1>
                        
                        <div className={`border-t my-4 ${dividerColor}`}></div>
                        
                        <div className="flex justify-between items-end">
                            <div>
                                <p className={`text-[10px] md:text-xs mb-1 ${labelColor}`}><i className="fas fa-arrow-down mr-1"></i>Pemasukan</p>
                                <p className="text-xs md:text-lg font-bold text-brandGreen">{formatRp(stats.income)}</p>
                            </div>
                            <div className="text-right">
                                <p className={`text-[10px] md:text-xs mb-1 ${labelColor}`}><i className="fas fa-arrow-up mr-1"></i>Pengeluaran</p>
                                <p className="text-xs md:text-lg font-bold text-brandRed">{formatRp(stats.expense)}</p>
                            </div>
                        </div>
                    </div>

                    {isAlert && (
                        <div className="bg-red-100 dark:bg-red-950/40 border-2 border-brandRed p-4 rounded-xl flex items-start gap-3 shadow-lg text-brandRed animate-shake">
                            <i className="fas fa-exclamation-triangle text-2xl mt-1 shrink-0 animate-blink"></i>
                            <div>
                                <h4 className="font-bold text-sm uppercase tracking-wide mb-1 animate-blink text-brandRed">Peringatan Kritis!</h4>
                                <p className="text-xs text-red-800 dark:text-red-200 leading-relaxed">
                                    Halo <span className="font-black uppercase">{userData.username}</span>! Pengeluaran bulan ini sudah menembus <span className="font-bold bg-brandRed text-white px-1 rounded">80% dari pemasukan</span> bulan ini. Jika tidak direm sekarang, target impian <span className="underline font-bold">"{userData.targetName}"</span> kamu bisa tertunda sangat lama! Yuk tahan nafsu belanjamu.
                                </p>
                            </div>
                        </div>
                    )}

                    <div className="bg-white dark:bg-darkCard rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-gray-800">
                        <div className="flex justify-between items-center mb-2">
                            <p className="text-xs font-bold text-gray-500 uppercase">Target: {userData.targetName}</p>
                            <p className="text-xs font-bold text-brandGreen">{progress.toFixed(1)}%</p>
                        </div>
                        <div className="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5 overflow-hidden">
                            <div className="bg-gradient-to-r from-brandGreen to-teal-400 h-2.5 rounded-full transition-all duration-500" style={{ width: `${progress}%` }}></div>
                        </div>
                    </div>

                    {!isReadOnly && (
                        <div className="grid grid-cols-2 gap-3 md:gap-4">
                            <button onClick={() => {setTxType('income'); setShowModal(true)}} className="bg-brandGreen text-white py-2.5 md:py-3 rounded-xl md:rounded-2xl font-bold shadow-lg shadow-brandGreen/20 hover:bg-emerald-600 active:scale-95 transition flex items-center justify-center gap-2 text-xs md:text-base">
                                <i className="fas fa-plus-circle"></i> Pemasukan
                            </button>
                            <button onClick={() => {setTxType('expense'); setShowModal(true)}} className="bg-brandRed text-white py-2.5 md:py-3 rounded-xl md:rounded-2xl font-bold shadow-lg shadow-brandRed/20 hover:bg-red-600 active:scale-95 transition flex items-center justify-center gap-2 text-xs md:text-base">
                                <i className="fas fa-minus-circle"></i> Pengeluaran
                            </button>
                        </div>
                    )}

                    <div>
                        <h3 className="text-sm font-bold text-gray-500 uppercase mb-3 px-1">Transaksi Terakhir</h3>
                        <div className="space-y-2">
                            {recentTx.length === 0 ? <p className="text-center text-gray-400 text-sm py-4">Belum ada transaksi</p> : 
                            recentTx.map(tx => (
                                <div key={tx.id} className="bg-white dark:bg-darkCard p-3 md:p-4 rounded-xl flex items-center justify-between shadow-sm border border-gray-100 dark:border-gray-800">
                                    <div className="flex items-center gap-3">
                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center ${tx.type === 'income' ? 'bg-green-100 text-brandGreen' : 'bg-red-100 text-brandRed'}`}>
                                            <i className={`fas ${tx.category === 'Tabungan' ? 'fa-piggy-bank' : tx.category === 'Pinjaman' ? 'fa-hand-holding-usd' : 'fa-wallet'}`}></i>
                                        </div>
                                        <div>
                                            <p className="font-bold text-sm md:text-base capitalize leading-tight">{tx.name}</p>
                                            <p className="text-[10px] md:text-xs text-gray-400">{tx.date} • {tx.category}</p>
                                        </div>
                                    </div>
                                    <p className={`font-bold text-sm md:text-base ${tx.type === 'income' ? 'text-brandGreen' : 'text-brandRed'}`}>
                                        {tx.type === 'income' ? '+' : '-'}{formatRp(tx.amount)}
                                    </p>
                                </div>
                            ))}
                        </div>
                    </div>

                    {showModal && !isReadOnly && <TransactionModal type={txType} onClose={() => setShowModal(false)} userData={userData} saveDoc={saveDoc} />}
                </div>
            );
        }

        function TransactionModal({ type, onClose, userData, saveDoc, initialData }) {
            const [amount, setAmount] = useState(initialData ? initialData.amount.toString() : '');
            const [name, setName] = useState(initialData ? initialData.name : '');
            const [date, setDate] = useState(initialData ? initialData.date : new Date().toISOString().split('T')[0]);
            const [category, setCategory] = useState(initialData ? initialData.category : 'Umum');
            
            const activeType = initialData ? initialData.type : type;
            const isEditing = !!initialData;

            const handleAmountChange = (e) => {
                const val = e.target.value.replace(/\D/g, '');
                setAmount(val);
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if(!amount || !name) return;
                
                const tx = {
                    id: isEditing ? initialData.id : generateId(),
                    userId: userData.id,
                    type: activeType,
                    category,
                    name,
                    amount: Number(amount),
                    date,
                    timestamp: isEditing ? initialData.timestamp : Date.now(),
                    hiddenInLoan: isEditing ? initialData.hiddenInLoan : false
                };
                
                await saveDoc('transactions', tx.id, tx);
                onClose();
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm overflow-hidden">
                    <div className={`bg-white dark:bg-darkCard w-full md:max-w-md rounded-2xl md:rounded-3xl p-5 md:p-6 shadow-2xl animate-fade-in border-t-4 ${activeType === 'income' ? 'border-brandGreen' : 'border-brandRed'}`}>
                        <div className="flex justify-between items-center mb-6">
                            <h2 className={`text-lg md:text-xl font-bold ${activeType === 'income' ? 'text-brandGreen' : 'text-brandRed'}`}>
                                {isEditing ? 'Edit Transaksi' : `Input ${activeType === 'income' ? 'Pemasukan' : 'Pengeluaran'}`}
                            </h2>
                            <button type="button" onClick={onClose} className="text-gray-400 hover:text-gray-800"><i className="fas fa-times text-lg md:text-xl"></i></button>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="text-[10px] md:text-xs text-gray-500 font-bold uppercase block mb-1">Nama Transaksi</label>
                                <div className="relative mt-1">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <TransactionNameImageIcon />
                                    </div>
                                    <input type="text" value={name} onChange={e=>setName(e.target.value)} className={`w-full p-3 pl-10 rounded-xl bg-gray-100 dark:bg-gray-800 text-sm md:text-base font-bold outline-none focus:ring-2 ${activeType === 'income' ? 'focus:ring-brandGreen' : 'focus:ring-brandRed'}`} placeholder="Misal: Gaji, Makan, dll" required />
                                </div>
                            </div>
                            <div>
                                <label className="text-[10px] md:text-xs text-gray-500 font-bold uppercase block mb-1">Nominal (Rp)</label>
                                <div className="relative mt-1">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <NominalImageIcon />
                                    </div>
                                    <input type="text" inputMode="numeric" value={amount ? formatRp(amount).replace('Rp', '').trim() : ''} onChange={handleAmountChange} className={`w-full p-2.5 pl-10 md:p-3 md:pl-10 rounded-xl bg-gray-100 dark:bg-gray-800 text-lg md:text-xl font-bold text-right outline-none text-gray-700 dark:text-gray-200 focus:ring-2 ${activeType === 'income' ? 'focus:ring-brandGreen' : 'focus:ring-brandRed'}`} placeholder="0" required />
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="text-[10px] md:text-xs text-gray-500 font-bold uppercase block mb-1">Tanggal</label>
                                    <div className="relative mt-1">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <TanggalImageIcon />
                                        </div>
                                        <input type="date" value={date} onChange={e=>setDate(e.target.value)} className="w-full p-2.5 pl-10 md:p-3 md:pl-10 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none text-xs md:text-sm" required />
                                    </div>
                                </div>
                                <div>
                                    <label className="text-[10px] md:text-xs text-gray-500 font-bold uppercase block mb-1">Kategori</label>
                                    <div className="relative mt-1">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <KategoriImageIcon />
                                        </div>
                                        <select value={category} onChange={e=>setCategory(e.target.value)} className="w-full p-2.5 pl-10 md:p-3 md:pl-10 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none text-xs md:text-sm appearance-none cursor-pointer">
                                            <option>Umum</option>
                                            <option>Tabungan</option>
                                            <option>Pinjaman</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" className={`w-full py-3 md:py-4 mt-2 rounded-xl text-white font-bold text-sm md:text-lg shadow-lg transition ${activeType === 'income' ? 'bg-brandGreen hover:bg-emerald-600' : 'bg-brandRed hover:bg-red-600'}`}>
                                Simpan Data
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // --- Riwayat (Menggunakan Ikon Cari Nama & Tanggal Berupa Gambar Vektor Baru) ---
        function UserRiwayat({ userTx, deleteDoc, saveDoc, userData, isReadOnly }) {
            const [filterTab, setFilterTab] = useState('semua');
            const [searchDate, setSearchDate] = useState('');
            const [searchName, setSearchName] = useState('');
            const [deleteTxConfirm, setDeleteTxConfirm] = useState(null);
            const [editTx, setEditTx] = useState(null);

            const filteredTx = useMemo(() => {
                let res = [...userTx].sort((a,b) => b.timestamp - a.timestamp);
                if(filterTab === 'pemasukan') res = res.filter(t => t.type === 'income');
                if(filterTab === 'pengeluaran') res = res.filter(t => t.type === 'expense');
                if(searchDate) res = res.filter(t => t.date === searchDate);
                if(searchName) res = res.filter(t => t.name.toLowerCase().includes(searchName.toLowerCase()));
                return res;
            }, [userTx, filterTab, searchDate, searchName]);

            const totalAmount = useMemo(() => filteredTx.reduce((acc, curr) => acc + (curr.type === 'income' ? curr.amount : -curr.amount), 0), [filteredTx]);

            const handleDeleteTransaction = async () => {
                if (!deleteTxConfirm) return;
                await deleteDoc('transactions', deleteTxConfirm.id);
                setDeleteTxConfirm(null);
            };

            const downloadPDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                const chronological = [...filteredTx].reverse();
                let runningBalance = 0;
                const balanceMap = {};
                
                chronological.forEach(t => {
                    if (t.type === 'income') runningBalance += t.amount;
                    else runningBalance -= t.amount;
                    balanceMap[t.id] = runningBalance;
                });

                doc.setFont("helvetica", "bold");
                doc.text(`Laporan Riwayat Transaksi - ${userData.username}`, 14, 15);
                
                const tableData = filteredTx.map((t, i) => [
                    i+1, 
                    t.date, 
                    t.name, 
                    t.type === 'income' ? formatRp(t.amount) : '-', 
                    t.type === 'expense' ? formatRp(t.amount) : '-',
                    formatRp(balanceMap[t.id])
                ]);
                
                doc.autoTable({
                    startY: 20,
                    head: [['No', 'Tanggal', 'Nama', 'Pemasukan', 'Pengeluaran', 'Saldo']],
                    body: tableData,
                    foot: [['', 'Jumlah Total', '', '', '', formatRp(totalAmount)]],
                    theme: 'striped',
                    headStyles: { fillColor: [16, 185, 129] },
                    footStyles: { fillColor: [243, 244, 246], textColor: [17, 24, 39], fontStyle: 'bold' }
                });
                
                doc.save(`Riwayat_${userData.username}_${new Date().getTime()}.pdf`);
            };

            return (
                <div className="space-y-4 animate-fade-in max-w-4xl mx-auto">
                    <div className="flex gap-2 items-center justify-between">
                        <div className="flex bg-gray-200 dark:bg-gray-800 p-1 rounded-xl flex-1 max-w-xs md:max-w-md">
                            {['semua', 'pemasukan', 'pengeluaran'].map(tab => {
                                const isActive = filterTab === tab;
                                let themeClass = "text-gray-500 hover:text-gray-700 dark:hover:text-gray-300";
                                if (isActive) {
                                    if (tab === 'semua') themeClass = "bg-white dark:bg-gray-700 text-blue-500 dark:text-blue-400 shadow";
                                    else if (tab === 'pemasukan') themeClass = "bg-white dark:bg-gray-700 text-brandGreen shadow";
                                    else if (tab === 'pengeluaran') themeClass = "bg-white dark:bg-gray-700 text-brandRed shadow";
                                }
                                return (
                                    <button key={tab} onClick={() => setFilterTab(tab)} className={`flex-1 md:px-6 py-2 rounded-lg text-xs md:text-sm font-bold capitalize transition-all duration-200 ${themeClass}`}>
                                        {tab}
                                    </button>
                                );
                            })}
                        </div>
                        <button onClick={downloadPDF} className="bg-brandRed hover:bg-red-600 text-white w-10 h-10 md:w-auto md:px-5 md:py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2 shadow-md hover:scale-[1.02] active:scale-95 transition-all shrink-0">
                            <i className="fas fa-file-pdf text-base"></i> 
                            <span className="hidden md:inline">Download PDF</span>
                        </button>
                    </div>

                    <div className="flex gap-2">
                        {/* Input Tanggal dengan Ikon Gambar Vektor */}
                        <div className="relative w-1/3">
                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <TanggalImageIcon />
                            </div>
                            <input type="date" value={searchDate} onChange={e=>setSearchDate(e.target.value)} className="w-full p-2 md:p-3 pl-10 md:pl-10 rounded-xl bg-white dark:bg-darkCard border border-gray-200 dark:border-gray-800 text-xs md:text-sm outline-none" />
                        </div>
                        
                        {/* Input Cari Nama dengan Ikon Gambar Vektor */}
                        <div className="relative flex-1">
                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <SearchImageIcon />
                            </div>
                            <input type="text" placeholder="Cari nama..." value={searchName} onChange={e=>setSearchName(e.target.value)} className="w-full p-2 md:p-3 pl-10 md:pl-10 rounded-xl bg-white dark:bg-darkCard border border-gray-200 dark:border-gray-800 text-xs md:text-sm outline-none" />
                        </div>
                    </div>

                    <div className="bg-white dark:bg-darkCard rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 overflow-hidden">
                        <div className="max-h-[60vh] overflow-y-auto">
                            {filteredTx.length === 0 ? <p className="text-center p-8 text-gray-400">Tidak ada data</p> : 
                                <ul className="divide-y divide-gray-100 dark:divide-gray-800">
                                    {filteredTx.map(tx => (
                                        <li key={tx.id} className="p-3 md:p-4 flex items-center justify-between hover:bg-gray-50 dark:hover:bg-gray-800/50 transition">
                                            <div className="flex items-center gap-3 min-w-0">
                                                <i className={`fas ${tx.type==='income' ? 'fa-arrow-down text-brandGreen bg-green-100' : 'fa-arrow-up text-brandRed bg-red-100'} w-8 h-8 shrink-0 rounded-full flex items-center justify-center text-xs`}></i>
                                                <div className="min-w-0">
                                                    <p className="font-bold text-sm md:text-base truncate">{tx.name}</p>
                                                    <p className="text-[10px] md:text-xs text-gray-400">{tx.date} • {tx.category}</p>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-2 shrink-0">
                                                <span className={`font-bold text-sm md:text-base ${tx.type === 'income' ? 'text-brandGreen' : 'text-brandRed'} mr-2`}>
                                                    {tx.type === 'income' ? '+' : '-'}{formatRp(tx.amount)}
                                                </span>
                                                {!isReadOnly && (
                                                    <div className="flex items-center gap-0.5">
                                                        <button onClick={() => setEditTx(tx)} className="text-blue-500 hover:text-blue-600 transition p-1 flex items-center justify-center" title="Edit">
                                                            <i className="fas fa-edit text-lg"></i>
                                                        </button>
                                                        <button onClick={() => setDeleteTxConfirm(tx)} className="text-brandRed hover:text-red-600 transition p-1 flex items-center justify-center" title="Hapus">
                                                            <i className="fas fa-trash-alt text-lg"></i>
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        </li>
                                    ))}
                                </ul>
                            }
                        </div>
                        <div className="bg-gray-50 dark:bg-gray-900 p-4 border-t border-gray-200 dark:border-gray-800 flex justify-between items-center">
                            <span className="font-bold text-gray-500">Jumlah Total:</span>
                            <span className={`font-black text-lg ${totalAmount >= 0 ? 'text-brandGreen' : 'text-brandRed'}`}>{formatRp(totalAmount)}</span>
                        </div>
                    </div>

                    {deleteTxConfirm && !isReadOnly && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/65 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white dark:bg-darkCard w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-brandRed/20 text-center">
                                <div className="w-16 h-16 rounded-full bg-red-100 dark:bg-red-900/30 text-brandRed flex items-center justify-center text-2xl mx-auto mb-4">
                                    <i className="fas fa-trash-alt"></i>
                                </div>
                                <h3 className="text-lg font-bold mb-2">Hapus Transaksi?</h3>
                                <p className="text-sm text-gray-500 mb-6">Yakin ingin membatalkan transaksi <span className="font-bold text-gray-800 dark:text-white">"{deleteTxConfirm.name}"</span>? Kalkulasi saldo Anda akan dikembalikan secara otomatis.</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setDeleteTxConfirm(null)} className="flex-1 py-3 rounded-xl bg-gray-100 dark:bg-gray-800 font-bold text-sm hover:bg-gray-200 transition">Batal</button>
                                    <button onClick={handleDeleteTransaction} className="flex-1 py-3 rounded-xl bg-brandRed text-white font-bold text-sm hover:bg-red-600 transition">Hapus</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {editTx && !isReadOnly && (
                        <TransactionModal type={editTx.type} initialData={editTx} onClose={() => setEditTx(null)} userData={userData} saveDoc={saveDoc} />
                    )}
                </div>
            );
        }

        // --- Target (Menggunakan Ikon Target & Harga Nominal Berupa Gambar Vektor Baru) ---
        function UserTarget({ userData, stats, saveDoc, isReadOnly }) {
            const [isEditing, setIsEditing] = useState(false);
            const [name, setName] = useState(userData.targetName);
            const [price, setPrice] = useState(userData.targetPrice);

            const handleEditClick = () => {
                setName(userData.targetName);
                setPrice(userData.targetPrice);
                setIsEditing(true);
            };

            const handlePriceChange = (e) => {
                const val = e.target.value.replace(/\D/g, '');
                setPrice(val);
            };

            const handleSave = async () => {
                await saveDoc('users', userData.id, { targetName: name, targetPrice: Number(price) });
                setIsEditing(false);
            };

            const targetVal = Number(userData.targetPrice) || 1;
            const tabungan = stats.tabungan;
            const kurang = Math.max(0, targetVal - tabungan);
            const percent = Math.min(100, Math.max(0, (tabungan / targetVal) * 100));

            const radius = 60;
            const circumference = 2 * Math.PI * radius;
            const strokeDashoffset = circumference - (percent / 100) * circumference;

            return (
                <div className="animate-fade-in max-w-md mx-auto space-y-6 pt-4">
                    <div className="bg-white dark:bg-darkCard rounded-3xl p-8 shadow-xl text-center border border-gray-100 dark:border-gray-800 relative overflow-hidden">
                        <div className="absolute -top-10 -right-10 w-32 h-32 bg-blue-500/10 rounded-full blur-3xl"></div>
                        <h2 className="text-xl font-black mb-6 text-brandYellow">Target Tabungan</h2>
                        
                        {/* Circular Progress */}
                        <div className="relative w-40 h-40 mx-auto mb-6">
                            <svg className="w-full h-full transform -rotate-90" viewBox="0 0 140 140">
                                <circle cx="70" cy="70" r={radius} className="stroke-gray-200 dark:stroke-gray-700" strokeWidth="12" fill="none" />
                                <circle cx="70" cy="70" r={radius} className="stroke-brandGreen transition-all duration-1000 ease-out" strokeWidth="12" fill="none" strokeDasharray={circumference} strokeDashoffset={strokeDashoffset} strokeLinecap="round" />
                            </svg>
                            <div className="absolute inset-0 flex flex-col items-center justify-center">
                                <span className="text-3xl font-black text-brandGreen">{percent.toFixed(0)}%</span>
                            </div>
                        </div>

                        {isEditing && !isReadOnly ? (
                            <div className="space-y-3 mb-4 text-left">
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <TargetNameImageIcon />
                                    </div>
                                    <input type="text" value={name} onChange={e=>setName(e.target.value)} className="w-full p-2.5 pl-10 rounded-lg bg-gray-100 dark:bg-gray-800 text-sm outline-none border border-transparent focus:border-brandGreen" placeholder="Nama Target" />
                                </div>
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <NominalImageIcon />
                                    </div>
                                    <input type="text" inputMode="numeric" value={price ? formatRp(price).replace('Rp', '').trim() : ''} onChange={handlePriceChange} className="w-full p-2.5 pl-10 rounded-lg bg-gray-100 dark:bg-gray-800 text-sm outline-none border border-transparent focus:border-brandGreen" placeholder="Harga Target" />
                                </div>
                                <button type="button" onClick={handleSave} className="w-full bg-brandGreen text-white py-2.5 rounded-lg font-bold text-sm shadow-md hover:bg-emerald-600 transition">Simpan</button>
                            </div>
                        ) : (
                            <div className="mb-4">
                                <h3 className="text-2xl font-bold uppercase tracking-wider">{userData.targetName}</h3>
                                <p className="text-gray-500 font-medium">{formatRp(userData.targetPrice)}</p>
                            </div>
                        )}

                        <div className="bg-gray-50 dark:bg-gray-900 rounded-xl p-4 grid grid-cols-2 gap-4 text-left">
                            <div>
                                <p className="text-[10px] text-gray-500 uppercase font-bold">Terkumpul (Tabungan)</p>
                                <p className="text-sm font-bold text-brandGreen">{formatRp(tabungan)}</p>
                            </div>
                            <div>
                                <p className="text-[10px] text-gray-500 uppercase font-bold">Kekurangan</p>
                                <p className="text-sm font-bold text-brandRed">{formatRp(kurang)}</p>
                            </div>
                        </div>

                        {!isEditing && !isReadOnly && (
                            <button type="button" onClick={handleEditClick} className="mt-4 text-xs text-blue-500 underline"><i className="fas fa-edit"></i> Edit Target</button>
                        )}
                    </div>
                </div>
            );
        }

        // --- Brankas / Tabungan ---
        function UserBrankas({ stats, userTx, saveDoc, isReadOnly }) {
            const [tab, setTab] = useState('tabungan');
            const [deleteTxConfirm, setDeleteTxConfirm] = useState(null);
            
            useEffect(() => {
                if (isReadOnly) setTab('tabungan');
            }, [isReadOnly]);
            
            const listData = useMemo(() => {
                let raw = userTx.filter(t => t.category.toLowerCase() === tab);
                if(tab === 'pinjaman') raw = raw.filter(t => !t.hiddenInLoan);
                return raw.sort((a,b) => b.timestamp - a.timestamp);
            }, [userTx, tab]);

            const handleDeletePinjaman = async () => {
                if (!deleteTxConfirm) return;
                await saveDoc('transactions', deleteTxConfirm.id, { hiddenInLoan: true });
                setDeleteTxConfirm(null);
            };

            const isTabungan = tab === 'tabungan';
            
            return (
                <div className="animate-fade-in max-w-4xl mx-auto space-y-6">
                    {!isReadOnly && (
                        <div className="flex bg-gray-200 dark:bg-gray-800 p-1 rounded-2xl w-full max-w-sm mx-auto">
                            <button onClick={() => setTab('tabungan')} className={`flex-1 py-3 rounded-xl text-sm font-bold transition ${isTabungan ? 'bg-white dark:bg-gray-600 shadow text-brandGreen' : 'text-gray-500'}`}>Tabungan</button>
                            <button onClick={() => setTab('pinjaman')} className={`flex-1 py-3 rounded-xl text-sm font-bold transition ${!isTabungan ? 'bg-white dark:bg-gray-600 shadow text-brandYellow' : 'text-gray-500'}`}>Pinjaman</button>
                        </div>
                    )}

                    <div className={`relative ${isTabungan ? 'bg-emerald-900' : 'bg-yellow-900'} rounded-3xl p-6 md:p-8 shadow-xl overflow-hidden text-white`}>
                        <i className={`fas ${isTabungan ? 'fa-piggy-bank' : 'fa-hand-holding-usd'} absolute -right-4 -bottom-4 text-9xl opacity-20`}></i>
                        <p className="text-xs md:text-sm font-medium opacity-80 mb-1">Sisa Saldo {isReadOnly ? 'Tabungan' : (isTabungan ? 'Tabungan' : 'Pinjaman')}</p>
                        <h1 className="text-3xl md:text-5xl font-black mb-2">{formatRp(isTabungan ? stats.tabungan : stats.pinjaman)}</h1>
                        <p className="text-[10px] md:text-xs opacity-70 italic">*Dihitung otomatis berdasarkan transaksi kategori {isReadOnly ? 'Tabungan' : (isTabungan ? 'Tabungan' : 'Pinjaman')} di Beranda.</p>
                    </div>

                    <div className="bg-white dark:bg-darkCard rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 overflow-hidden">
                        <div className="p-3 md:p-4 border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-900/50">
                            <h3 className="font-bold text-xs md:text-sm uppercase">Riwayat Permanen {isReadOnly ? 'Tabungan' : (isTabungan ? 'Tabungan' : 'Pinjaman')}</h3>
                        </div>
                        <div className="max-h-[60vh] overflow-y-auto p-2 md:p-4 space-y-2 bg-gray-50/30 dark:bg-darkBg/30">
                            {listData.length === 0 ? <p className="p-6 text-center text-gray-400 text-xs">Belum ada data riwayat.</p> : 
                            listData.map((tx, idx) => {
                                const isVaultIncome = isTabungan ? tx.type === 'expense' : tx.type === 'income';
                                return (
                                <div key={tx.id} className="bg-white dark:bg-darkCard p-3 md:p-4 rounded-xl border border-gray-100 dark:border-gray-800 shadow-sm flex items-center justify-between gap-2 hover:bg-gray-50 dark:hover:bg-gray-800/50 transition">
                                    <div className="flex items-center gap-3 overflow-hidden">
                                        <div className="w-6 h-6 md:w-8 md:h-8 shrink-0 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-[10px] md:text-xs font-bold text-gray-500">{idx+1}</div>
                                        <div className="min-w-0">
                                            <p className="font-bold text-xs md:text-sm truncate">{tx.name}</p>
                                            <p className="text-[10px] text-gray-400">{tx.date}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2 shrink-0">
                                        <span className={`font-bold text-xs md:text-base ${isVaultIncome ? 'text-brandGreen' : 'text-brandRed'} mr-1`}>
                                            {isVaultIncome ? '+' : '-'}{formatRp(tx.amount)}
                                        </span>
                                        {!isTabungan && !isReadOnly && (
                                            <div className="flex items-center gap-0.5">
                                                <button type="button" onClick={() => setDeleteTxConfirm(tx)} className="text-brandRed hover:text-red-600 transition p-1 flex items-center justify-center" title="Hapus">
                                                    <i className="fas fa-trash-alt text-lg"></i>
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                </div>
                                )
                            })}
                        </div>
                    </div>

                    {deleteTxConfirm && !isReadOnly && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/65 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white dark:bg-darkCard w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-brandRed/20 text-center">
                                <div className="w-16 h-16 rounded-full bg-red-100 dark:bg-red-900/30 text-brandRed flex items-center justify-center text-2xl mx-auto mb-4">
                                    <i className="fas fa-eye-slash"></i>
                                </div>
                                <h3 className="text-lg font-bold mb-2">Sembunyikan Riwayat?</h3>
                                <p className="text-sm text-gray-500 mb-6">Yakin ingin menyembunyikan riwayat transaksi <span className="font-bold text-gray-800 dark:text-white">"{deleteTxConfirm.name}"</span>? Tindakan ini tidak mengubah nominal ringkasan saldo Anda.</p>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setDeleteTxConfirm(null)} className="flex-1 py-3 rounded-xl bg-gray-100 dark:bg-gray-800 font-bold text-sm hover:bg-gray-200 transition">Batal</button>
                                    <button type="button" onClick={handleDeletePinjaman} className="flex-1 py-3 rounded-xl bg-brandRed text-white font-bold text-sm hover:bg-red-600 transition">Sembunyikan</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- Pengaturan (Menggunakan Ikon Nama & Password Berupa Gambar Vektor Baru) ---
        function UserPengaturan({ currentUser, saveDoc, userTx, deleteDoc }) {
            const [name, setName] = useState(currentUser.username);
            const [pass, setPass] = useState(currentUser.password);
