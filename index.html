                                        )
                                    })}
                                </tbody>
                                <tfoot>
                                    <tr className="bg-gray-50 dark:bg-gray-800 font-bold border-t-2 border-gray-300 dark:border-gray-600">
                                        <td colSpan="4" className="p-3 text-right">Jumlah Total:</td>
                                        <td className={`p-3 text-right ${totalFiltered >= 0 ? 'text-green-500' : 'text-red-500'}`}>
                                            {formatRp(totalFiltered)}
                                        </td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminTabDataUser = ({ cloudData, saveToCloud, deleteFromCloud }) => {
            const [showPwd, setShowPwd] = useState({});
            const [newUser, setNewUser] = useState({ username: '', password: '' });

            const togglePwd = (id) => setShowPwd(prev => ({...prev, [id]: !prev[id]}));

            const handleAdd = async (e) => {
                e.preventDefault();
                if(!newUser.username || !newUser.password) return;
                if(cloudData.users.find(u => u.username === newUser.username)) return alert("Username sudah ada!");
                await saveToCloud('users', generateId(), { username: newUser.username, password: newUser.password });
                setNewUser({ username: '', password: '' });
            };

            const handleDelete = async (id) => {
                await deleteFromCloud('users', id);
            };

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold border-l-4 border-red-500 pl-3">Kelola Data User</h2>

                    <form onSubmit={handleAdd} className="glass p-4 rounded-xl flex flex-col md:flex-row gap-3 items-end shadow-sm">
                        <div className="flex-1 w-full">
                            <label className="block text-xs mb-1 text-gray-500 font-bold">Username Baru</label>
                            <input required type="text" value={newUser.username} onChange={e=>setNewUser({...newUser, username: e.target.value})} className="w-full p-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-dark text-sm" />
                        </div>
                        <div className="flex-1 w-full">
                            <label className="block text-xs mb-1 text-gray-500 font-bold">Password Baru</label>
                            <input required type="text" value={newUser.password} onChange={e=>setNewUser({...newUser, password: e.target.value})} className="w-full p-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-dark text-sm" />
                        </div>
                        <button type="submit" className="w-full md:w-auto px-6 py-2 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg shadow transition">
                            <i className="fas fa-plus mr-2"></i>Tambah User
                        </button>
                    </form>

                    <div className="glass rounded-xl shadow-sm overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm whitespace-nowrap">
                                <thead>
                                    <tr className="bg-gray-100 dark:bg-gray-800 text-gray-500 uppercase text-xs">
                                        <th className="p-4 w-16">No</th>
                                        <th className="p-4">Nama User</th>
                                        <th className="p-4">Password</th>
                                        <th className="p-4 text-center w-24">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {cloudData.users.map((u, i) => (
                                        <tr key={u.id} className="border-b dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800/30">
                                            <td className="p-4">{i + 1}</td>
                                            <td className="p-4 font-bold">{u.username}</td>
                                            <td className="p-4">
                                                <div className="flex items-center gap-2">
                                                    <span className="font-mono bg-gray-200 dark:bg-gray-700 px-2 py-1 rounded text-xs select-all">
                                                        {showPwd[u.id] ? u.password : '••••••••'}
                                                    </span>
                                                    <button onClick={() => togglePwd(u.id)} className="text-gray-400 hover:text-gray-600 dark:hover:text-white">
                                                        <i className={`fas ${showPwd[u.id] ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                                    </button>
                                                </div>
                                            </td>
                                            <td className="p-4 text-center">
                                                <button onClick={() => {if(confirm("Hapus user?")) handleDelete(u.id)}} className="text-red-500 hover:text-red-700 hover:bg-red-100 dark:hover:bg-red-900/30 p-2 rounded transition" title="Hapus User">
                                                    <i className="fas fa-trash"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                    {cloudData.users.length === 0 && <tr><td colSpan="4" className="p-4 text-center">Belum ada user.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminTabBrankas = ({ cloudData }) => {
            const [bTab, setBTab] = useState('Tabungan');
            const [filterDate, setFilterDate] = useState('');
            const [filterUser, setFilterUser] = useState('');

            const allCategoryTxs = useMemo(() => cloudData.transactions.filter(t => t.category === bTab && !t.deleted && !t.hiddenFromHistory), [cloudData.transactions, bTab]);
            
            const totalKeseluruhan = useMemo(() => {
                let sum = 0;
                allCategoryTxs.forEach(t => {
                    if (t.type === 'out') sum += t.amount;
                    if (t.type === 'in') sum -= t.amount;
                });
                return sum;
            }, [allCategoryTxs]);

            const filteredTxs = useMemo(() => {
                return allCategoryTxs.filter(t => {
                    const u = cloudData.users.find(u => u.id === t.userId)?.username || 'Unknown';
                    const matchUser = u.toLowerCase().includes(filterUser.toLowerCase());
                    const matchDate = filterDate ? t.date === filterDate : true;
                    return matchUser && matchDate;
                }).sort((a,b) => new Date(b.date) - new Date(a.date));
            }, [allCategoryTxs, cloudData.users, filterDate, filterUser]);

            const sumFiltered = useMemo(() => {
                let sum = 0;
                filteredTxs.forEach(t => {
                    if (t.type === 'out') sum += t.amount;
                    if (t.type === 'in') sum -= t.amount;
                });
                return sum;
            }, [filteredTxs]);

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold border-l-4 border-red-500 pl-3">Brankas Global</h2>

                    <div className="flex bg-gray-200 dark:bg-gray-800 rounded-full p-1 max-w-sm shadow-inner">
                        <button onClick={() => setBTab('Tabungan')} className={`flex-1 py-2 rounded-full text-sm font-bold transition ${bTab === 'Tabungan' ? 'bg-white dark:bg-gray-600 text-emerald-600 shadow' : 'text-gray-500'}`}>
                            <i className="fas fa-piggy-bank mr-2"></i>Tabungan
                        </button>
                        <button onClick={() => setBTab('Pinjaman')} className={`flex-1 py-2 rounded-full text-sm font-bold transition ${bTab === 'Pinjaman' ? 'bg-white dark:bg-gray-600 text-yellow-600 shadow' : 'text-gray-500'}`}>
                            <i className="fas fa-hand-holding-dollar mr-2"></i>Pinjaman
                        </button>
                    </div>

                    <div className={`p-6 rounded-2xl text-white shadow-lg ${bTab === 'Tabungan' ? 'bg-gradient-to-r from-emerald-500 to-green-600' : 'bg-gradient-to-r from-yellow-500 to-orange-600'}`}>
                        <h3 className="text-sm opacity-90">Total {bTab} Keseluruhan (Semua User)</h3>
                        <div className="text-4xl font-black">{formatRp(totalKeseluruhan)}</div>
                    </div>

                    <div className="glass p-4 rounded-xl flex gap-3">
                        <input type="text" placeholder="Filter Nama User..." value={filterUser} onChange={e=>setFilterUser(e.target.value)} 
                            className="flex-1 p-2 rounded-lg bg-white dark:bg-dark border border-gray-300 dark:border-gray-600 text-sm" />
                        <input type="date" value={filterDate} onChange={e=>setFilterDate(e.target.value)} 
                            className="p-2 rounded-lg bg-white dark:bg-dark border border-gray-300 dark:border-gray-600 text-sm dark:[color-scheme:dark]" />
                    </div>

                    <div className="glass rounded-xl shadow-sm overflow-hidden">
                        <div className="p-4 border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50">
                            <h3 className="font-bold text-sm text-gray-600 dark:text-gray-300">Riwayat {bTab} Global</h3>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm whitespace-nowrap">
                                <thead>
                                    <tr className="text-gray-500 border-b dark:border-gray-700 text-xs uppercase">
                                        <th className="p-3">No</th>
                                        <th className="p-3">User</th>
                                        <th className="p-3">Transaksi</th>
                                        <th className="p-3">Tanggal</th>
                                        <th className="p-3 text-right">Perubahan Saldo Brankas</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredTxs.length === 0 && <tr><td colSpan="5" className="p-4 text-center text-gray-500">Belum ada riwayat.</td></tr>}
                                    {filteredTxs.map((t, i) => {
                                        const username = cloudData.users.find(u => u.id === t.userId)?.username || 'Deleted User';
                                        const isMasukKeBrankas = t.type === 'out'; 
                                        return (
                                            <tr key={t.id} className="border-b dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800/30">
                                                <td className="p-3">{i + 1}</td>
                                                <td className="p-3 font-bold text-blue-500">{username}</td>
                                                <td className="p-3">{t.name}</td>
                                                <td className="p-3 text-gray-500 text-xs">{t.date}</td>
                                                <td className={`p-3 font-bold text-right ${isMasukKeBrankas ? 'text-green-500' : 'text-red-500'}`}>
                                                    {isMasukKeBrankas ? '+' : '-'}{formatRp(t.amount)}
                                                </td>
                                            </tr>
                                        )
                                    })}
                                </tbody>
                                <tfoot>
                                    <tr className="bg-gray-50 dark:bg-gray-800 font-bold border-t border-gray-300 dark:border-gray-600">
                                        <td colSpan="4" className="p-3 text-right">Akumulasi Filter:</td>
                                        <td className={`p-3 text-right ${sumFiltered >= 0 ? 'text-green-500' : 'text-red-500'}`}>
                                            {formatRp(sumFiltered)}
                                        </td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminTabPengaturan = ({ cloudData, saveToCloud, deleteFromCloud }) => {
            const preview = cloudData.settings.find(s => s.id === 'global')?.bgImage || '';

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = async () => {
                        const base64String = reader.result;
                        await saveToCloud('settings', 'global', { bgImage: base64String });
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleClearBg = async () => {
                await deleteFromCloud('settings', 'global');
            };

            return (
                <div className="max-w-md space-y-6">
                    <h2 className="text-2xl font-bold border-l-4 border-red-500 pl-3">Pengaturan Aplikasi</h2>
                    
                    <div className="glass p-6 rounded-2xl shadow-sm space-y-4">
                        <h3 className="font-bold text-gray-700 dark:text-gray-300"><i className="fas fa-image mr-2 text-blue-500"></i>Background Aplikasi Global</h3>
                        <p className="text-xs text-gray-500 mb-4">Upload gambar transparan atau responsif untuk mengubah tampilan latar belakang halaman User dan Admin.</p>
                        
                        <div className="border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl p-4 text-center relative overflow-hidden h-40 flex items-center justify-center bg-gray-50 dark:bg-gray-800">
                            {preview ? (
                                <img src={preview} alt="Bg Preview" className="absolute inset-0 w-full h-full object-cover opacity-50" />
                            ) : (
                                <div className="text-gray-400">
                                    <i className="fas fa-upload text-3xl mb-2"></i>
                                    <p className="text-sm font-bold">Pilih Gambar</p>
                                </div>
                            )}
                            <input type="file" accept="image/*" onChange={handleImageUpload} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                        </div>

                        {preview && (
                            <button onClick={handleClearBg} className="w-full py-2 bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400 font-bold rounded-lg hover:bg-red-500 hover:text-white transition">
                                <i className="fas fa-trash mr-2"></i>Hapus Latar Belakang
                            </button>
                        )}
                        <p className="text-[10px] text-gray-400 text-center italic">*Disarankan menggunakan gambar ukuran di bawah 2MB.</p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
