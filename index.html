                                    <input required type="number" min="1" value={amount} onChange={e=>setAmount(e.target.value)} className="w-full p-3 pl-10 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-brandGreen outline-none text-sm font-bold" placeholder="50000" />
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="text-xs font-semibold text-gray-500 uppercase">Tanggal</label>
                                    <div className="relative mt-1">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><TanggalImageIcon/></div>
                                        <input required type="date" value={date} onChange={e=>setDate(e.target.value)} className="w-full p-3 pl-10 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-brandGreen outline-none text-xs" />
                                    </div>
                                </div>
                                <div>
                                    <label className="text-xs font-semibold text-gray-500 uppercase">Kategori</label>
                                    <div className="relative mt-1">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><KategoriImageIcon/></div>
                                        <select required value={category} onChange={e=>setCategory(e.target.value)} className="w-full p-3 pl-10 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-brandGreen outline-none text-xs font-medium">
                                            {defaultCats.map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <button type="submit" className={`w-full py-4 mt-2 rounded-xl text-white font-bold shadow-lg transition text-sm ${isIncome ? 'bg-brandGreen hover:bg-emerald-600 shadow-green-500/30' : 'bg-brandRed hover:bg-red-600 shadow-red-500/30'}`}>
                                Simpan Data
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // ==========================================
        // ADMIN LAYOUT
        // ==========================================
        function AdminLayout({ users, transactions, saveDoc, deleteDoc, onLogout, toggleTheme, theme }) {
            const [showUserModal, setShowUserModal] = useState(false);
            const [showConfirmReset, setShowConfirmReset] = useState(false);

            const systemBalance = transactions.reduce((sum, tx) => sum + (tx.type === 'income' ? Number(tx.amount) : -Number(tx.amount)), 0);

            const handleGlobalBg = async (e) => {
                if(e.target.files[0]) {
                    const compressed = await compressImageFile(e.target.files[0]);
                    saveDoc('settings', 'global', { bgImage: compressed });
                    alert('Background global diperbarui!');
                }
            };

            const handleResetCloud = () => {
                const conf = prompt('KETIK "RESET" UNTUK MENGHAPUS SEMUA DATA:');
                if(conf === 'RESET') {
                    transactions.forEach(t => deleteDoc('transactions', t.id));
                    users.forEach(u => deleteDoc('users', u.id));
                    alert('Sistem berhasil direset total!');
                    setShowConfirmReset(false);
                } else {
                    alert('Reset dibatalkan. Kata kunci salah.');
                }
            };

            const parents = users.filter(u => u.role === 'utama');

            return (
                <div className="min-h-screen bg-gray-50 dark:bg-darkBg text-gray-900 dark:text-gray-100 flex flex-col">
                    <header className="bg-brandRed text-white px-6 py-4 flex justify-between items-center shadow-md">
                        <div className="flex items-center gap-3">
                            <i className="fas fa-shield-alt text-2xl"></i>
                            <h1 className="font-bold text-lg hidden md:block">Administrator Panel</h1>
                        </div>
                        <div className="flex items-center gap-4">
                             <button onClick={toggleTheme} className="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center hover:bg-white/30 transition">
                                <i className={`fas ${theme === 'dark' ? 'fa-sun' : 'fa-moon'}`}></i>
                            </button>
                            <button onClick={onLogout} className="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg text-sm font-bold transition">Keluar</button>
                        </div>
                    </header>

                    <main className="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full space-y-6">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-white dark:bg-darkCard p-5 rounded-2xl shadow border-l-4 border-blue-500">
                                <p className="text-gray-500 text-sm">Total User Terdaftar</p>
                                <h3 className="text-3xl font-black">{users.length}</h3>
                            </div>
                            <div className="bg-white dark:bg-darkCard p-5 rounded-2xl shadow border-l-4 border-green-500">
                                <p className="text-gray-500 text-sm">Total Transaksi Sistem</p>
                                <h3 className="text-3xl font-black">{transactions.length}</h3>
                            </div>
                             <div className="bg-white dark:bg-darkCard p-5 rounded-2xl shadow border-l-4 border-yellow-500">
                                <p className="text-gray-500 text-sm">Perputaran Uang Sistem</p>
                                <h3 className="text-xl md:text-2xl font-black">{formatRp(systemBalance)}</h3>
                            </div>
                        </div>

                        <div className="bg-white dark:bg-darkCard p-5 md:p-6 rounded-2xl shadow">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-lg font-bold">Manajemen User</h2>
                                <button onClick={() => setShowUserModal(true)} className="px-4 py-2 bg-blue-500 text-white text-sm font-bold rounded-lg shadow hover:bg-blue-600 transition">+ Tambah User</button>
                            </div>
                            
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm border-collapse">
                                    <thead>
                                        <tr className="bg-gray-100 dark:bg-gray-800">
                                            <th className="p-3 border-b dark:border-gray-700">Username</th>
                                            <th className="p-3 border-b dark:border-gray-700">Password</th>
                                            <th className="p-3 border-b dark:border-gray-700">Role</th>
                                            <th className="p-3 border-b dark:border-gray-700">Keterangan</th>
                                            <th className="p-3 border-b dark:border-gray-700">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {users.map(u => (
                                            <tr key={u.id} className="border-b dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800/50">
                                                <td className="p-3 font-bold">{u.username}</td>
                                                <td className="p-3"><span className="bg-gray-200 dark:bg-gray-700 px-2 py-1 rounded text-xs">{u.password}</span></td>
                                                <td className="p-3">
                                                    <span className={`px-2 py-1 rounded text-xs font-bold ${u.role === 'utama' ? 'bg-indigo-100 text-indigo-700' : 'bg-gray-100 text-gray-700'}`}>
                                                        {u.role.toUpperCase()}
                                                    </span>
                                                </td>
                                                <td className="p-3 text-xs text-gray-500">
                                                    {u.role === 'anggota' && `Memantau: ${users.find(x => x.id === u.parentId)?.username || '?'}`}
                                                </td>
                                                <td className="p-3">
                                                    <button onClick={() => {
                                                        if(window.confirm('Hapus user ini? Transaksinya akan tetap ada.')) deleteDoc('users', u.id);
                                                    }} className="text-red-500 hover:text-red-700"><i className="fas fa-trash"></i></button>
                                                </td>
                                            </tr>
                                        ))}
                                        {users.length === 0 && <tr><td colSpan="5" className="p-4 text-center text-gray-500">Belum ada user</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="bg-white dark:bg-darkCard p-5 md:p-6 rounded-2xl shadow">
                                <h3 className="font-bold mb-4">Pengaturan Global</h3>
                                <div>
                                    <label className="block text-sm font-medium mb-2 text-gray-600 dark:text-gray-400">Background Splash Screen (Global)</label>
                                    <input type="file" accept="image/*" onChange={handleGlobalBg} className="block w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 dark:file:bg-blue-900/30 dark:file:text-blue-400" />
                                </div>
                            </div>
                            
                            <div className="bg-red-50 dark:bg-red-900/10 p-5 md:p-6 rounded-2xl shadow border border-red-200 dark:border-red-800">
                                <h3 className="font-bold text-red-600 dark:text-red-400 mb-2"><i className="fas fa-skull-crossbones mr-2"></i>Wipe Data System</h3>
                                <p className="text-xs text-gray-600 dark:text-gray-400 mb-4">Hapus seluruh data (User & Transaksi) dari server Cloud Firebase. Aksi ini sangat fatal.</p>
                                <button onClick={() => setShowConfirmReset(true)} className="w-full py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-bold text-sm transition shadow-md">
                                    RESET SELURUH DATA SISTEM
                                </button>
                            </div>
                        </div>
                    </main>

                    {/* Admin Modals */}
                    {showUserModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
                            <div className="bg-white dark:bg-darkCard w-full max-w-sm rounded-2xl p-6 shadow-xl relative">
                                <button onClick={()=>setShowUserModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-800 dark:hover:text-white"><i className="fas fa-times"></i></button>
                                <h2 className="text-lg font-bold mb-4">Tambah User</h2>
                                <form onSubmit={e => {
                                    e.preventDefault();
                                    const fd = new FormData(e.target);
                                    saveDoc('users', generateId(), {
                                        username: fd.get('username'),
                                        password: fd.get('password'),
                                        role: fd.get('role'),
                                        parentId: fd.get('parentId') || null,
                                        targets: [],
                                        createdAt: Date.now()
                                    });
                                    setShowUserModal(false);
                                }} className="space-y-4">
                                    <input name="username" required placeholder="Username" className="w-full p-2 border rounded dark:bg-gray-800 dark:border-gray-700 text-sm" />
                                    <input name="password" required placeholder="Password" className="w-full p-2 border rounded dark:bg-gray-800 dark:border-gray-700 text-sm" />
                                    <select name="role" id="roleSelect" required className="w-full p-2 border rounded dark:bg-gray-800 dark:border-gray-700 text-sm" onChange={e => {
                                        document.getElementById('parentSelectDiv').style.display = e.target.value === 'anggota' ? 'block' : 'none';
                                        document.getElementById('parentSelect').required = e.target.value === 'anggota';
                                    }}>
                                        <option value="utama">Utama (Bisa Edit Data)</option>
                                        <option value="anggota">Anggota (Hanya Pantau)</option>
                                    </select>
                                    <div id="parentSelectDiv" style={{display: 'none'}}>
                                        <select name="parentId" id="parentSelect" className="w-full p-2 border rounded dark:bg-gray-800 dark:border-gray-700 text-sm">
                                            <option value="">Pilih Akun yang Dipantau...</option>
                                            {parents.map(p => <option key={p.id} value={p.id}>{p.username}</option>)}
                                        </select>
                                    </div>
                                    <button className="w-full bg-blue-500 text-white py-2 rounded font-bold">Simpan</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {showConfirmReset && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-red-900/80 backdrop-blur-sm">
                            <div className="bg-white dark:bg-darkCard w-full max-w-sm rounded-2xl p-6 shadow-2xl text-center animate-shake">
                                <div className="w-16 h-16 rounded-full bg-red-100 dark:bg-red-900/30 text-brandRed flex items-center justify-center text-2xl mx-auto mb-4 animate-bounce">
                                    <i className="fas fa-trash-alt"></i>
                                </div>
                                <h3 className="text-lg font-bold mb-2 text-brandRed">PERINGATAN KERAS!</h3>
                                <p className="text-sm text-gray-500 mb-6">Yakin ingin menghapus seluruh akun user dan semua data transaksi dari Cloud database? Tindakan ini akan melenyapkan sistem secara total dan data tidak dapat dipulihkan kembali.</p>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setShowConfirmReset(false)} className="flex-1 py-3 rounded-xl bg-gray-100 dark:bg-gray-800 font-bold text-sm hover:bg-gray-200 transition">Batal</button>
                                    <button type="button" onClick={handleResetCloud} className="flex-1 py-3 rounded-xl bg-brandRed text-white font-bold text-sm hover:bg-red-600 transition">Reset Sekarang</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
