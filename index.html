            }, [trans, tab]);

            const listData = useMemo(() => {
                let data = trans.filter(t => !t.isDeleted && t.category === tab);
                if (filterDateStr) data = data.filter(t => t.date === filterDateStr);
                if (filterName) data = data.filter(t => (userMap[t.userId] || '').toLowerCase().includes(filterName.toLowerCase()));
                return data.sort((a,b) => b.timestamp - a.timestamp);
            }, [trans, tab, filterDateStr, filterName, userMap]);

            const filteredTotal = useMemo(() => listData.reduce((acc, curr) => acc + (curr.type === 'out' ? parseInt(curr.amount) : -parseInt(curr.amount)), 0), [listData]);

            return (
                <div className="max-w-5xl mx-auto space-y-4 md:space-y-6">
                    <div className="flex p-1 bg-gray-200 dark:bg-gray-800 rounded-xl w-full max-w-sm mx-auto">
                        {['Tabungan', 'Pinjaman'].map(t => (
                            <button key={t} onClick={() => setTab(t)} className={`flex-1 py-1.5 md:py-2 text-xs md:text-sm font-bold rounded-lg transition-all ${tab === t ? 'bg-white dark:bg-slate-700 shadow text-blue-600 dark:text-blue-400' : 'text-gray-500'}`}>
                                {t} Global
                            </button>
                        ))}
                    </div>

                    <div className={`p-5 md:p-6 rounded-3xl text-center text-white shadow-xl ${tab === 'Tabungan' ? 'bg-gradient-to-r from-emerald-400 to-teal-500' : 'bg-gradient-to-r from-amber-500 to-orange-500'}`}>
                        <p className="text-xs md:text-sm font-bold mb-1 opacity-80">Total {tab} Seluruh User</p>
                        <h2 className="text-3xl md:text-4xl font-extrabold tracking-wider">{formatRp(globalTotal)}</h2>
                    </div>

                    <div className="bg-white dark:bg-darkCard rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 overflow-hidden">
                        <div className="p-3 md:p-4 border-b dark:border-gray-700 flex flex-col md:flex-row justify-between items-stretch md:items-center gap-3 bg-gray-50 dark:bg-slate-800/50">
                            <h3 className="font-bold text-sm md:text-base">Riwayat {tab} Global</h3>
                            <div className="flex gap-2 w-full md:w-auto">
                                <input type="date" value={filterDateStr} onChange={e => setFilterDateStr(e.target.value)} className="px-2 md:px-3 py-1.5 text-xs md:text-sm bg-white dark:bg-slate-700 border rounded-lg outline-none w-1/2 md:w-auto transition-colors" />
                                <input type="text" placeholder="Cari nama..." value={filterName} onChange={e => setFilterName(e.target.value)} className="px-2 md:px-3 py-1.5 text-xs md:text-sm bg-white dark:bg-slate-700 border rounded-lg outline-none w-1/2 md:w-auto transition-colors" />
                            </div>
                        </div>
                        
                        <div className="flex flex-col">
                            {listData.length === 0 ? (
                                <div className="p-8 text-center text-sm text-gray-500">Tidak ada riwayat {tab}.</div>
                            ) : listData.map((t, i) => (
                                <div key={t.id} className="flex justify-between items-center p-3 md:p-4 border-b last:border-0 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-slate-800/30 transition-colors">
                                    <div className="flex items-center gap-2.5 md:gap-4">
                                        <div className="w-6 h-6 md:w-8 md:h-8 rounded-full flex shrink-0 items-center justify-center bg-gray-100 dark:bg-slate-700 text-gray-500 text-[10px] md:text-xs font-bold">
                                            {i + 1}
                                        </div>
                                        <div className="flex flex-col">
                                            <span className="font-bold text-xs md:text-sm text-blue-600 dark:text-blue-400 truncate max-w-[120px] sm:max-w-[200px]">{userMap[t.userId] || 'Unknown'}</span>
                                            <span className="font-semibold text-sm md:text-base truncate max-w-[150px] sm:max-w-[250px]">{t.name}</span>
                                            <span className="text-[10px] md:text-xs text-gray-500">{t.date}</span>
                                        </div>
                                    </div>
                                    <span className={`font-bold text-sm md:text-base whitespace-nowrap ${t.type === 'out' ? 'text-green-600' : 'text-red-600'}`}>
                                        {t.type === 'out' ? '+' : '-'}{formatRp(t.amount)}
                                    </span>
                                </div>
                            ))}
                        </div>

                        <div className="bg-gray-50 dark:bg-slate-800/80 p-3 md:p-4 flex justify-between items-center font-bold border-t dark:border-gray-700 backdrop-blur-sm">
                            <span className="text-xs md:text-sm text-gray-600 dark:text-gray-300">TOTAL FILTER:</span>
                            <span className={`text-sm md:text-base ${filteredTotal >= 0 ? 'text-green-600' : 'text-red-600'}`}>{formatRp(filteredTotal)}</span>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminPengaturan = ({ setBgImage }) => {
            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    compressImage(file, (compressedBase64) => {
                        try { localStorage.setItem('fm_bg', compressedBase64); setBgImage(compressedBase64); customAlert("Latar belakang diubah!"); } 
                        catch (err) { customAlert("Gagal menyimpan gambar. Ukuran terlalu besar."); }
                    });
                }
            };
            const handleRemoveBg = () => { localStorage.removeItem('fm_bg'); setBgImage(''); customAlert("Latar belakang dikembalikan ke bawaan."); };

            return (
                <div className="max-w-2xl mx-auto space-y-4 md:space-y-6">
                    <div className="bg-white dark:bg-darkCard p-5 md:p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800">
                        <h2 className="text-lg md:text-xl font-bold mb-4 md:mb-6 border-b pb-2 dark:border-gray-700"><i className="fa-solid fa-image mr-2 text-blue-500"></i>Latar Belakang</h2>
                        <p className="text-xs md:text-sm text-gray-500 mb-4 md:mb-5">Pilih gambar untuk latar belakang (terkompresi otomatis).</p>
                        
                        <div className="flex flex-col gap-3 md:gap-4">
                            <label className="flex items-center justify-center w-full h-24 md:h-32 px-4 border-2 border-gray-300 dark:border-gray-600 border-dashed rounded-xl cursor-pointer hover:border-blue-400 bg-gray-50 dark:bg-slate-800 transition-colors">
                                <span className="flex items-center gap-2">
                                    <i className="fa-solid fa-upload text-gray-400 text-lg md:text-xl"></i>
                                    <span className="font-medium text-xs md:text-sm text-gray-600 dark:text-gray-300">Pilih Gambar</span>
                                </span>
                                <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                            </label>
                            
                            <button onClick={handleRemoveBg} className="w-full py-2 text-xs md:text-sm bg-red-100 text-red-600 rounded-xl font-bold hover:bg-red-200 dark:bg-red-900/30 transition-colors">
                                <i className="fa-solid fa-trash mr-1.5 md:mr-2"></i>Hapus Latar Belakang
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
